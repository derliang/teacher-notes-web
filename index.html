/* ============ 家長訊息：只針對個別學生產生簡短文案，不列出其他同學 ============ */
var ParentMsg = {
  name: function (item) {
    var t = (item.title || '').replace(/^\d{1,2}\/\d{1,2}\s*/, '').trim();
    return t && t !== TYPE_LABEL[item.type] ? t : item.title;
  },
  wrap: function (head, lines) {
    var sign = Pref.sign();
    return [head].concat(lines.filter(Boolean)).join('\n') + (sign ? '\n' + sign : '');
  },
  /* 聯絡紀錄：按下複製或分享時記下；同一則內容 30 分鐘內只記一次 */
  history: function (sid) {
    return DB.where('contacts', function (c) { return c.studentId === sid; }).sort(function (a, b) { return b.at - a.at; });
  },
  log: function (s, topics, text, via) {
    var last = ParentMsg.history(s.id)[0];
    if (last && last.text === text && Date.now() - last.at < 30 * 60000) return;
    DB.put('contacts', {
      id: uid(), studentId: s.id, classId: s.classId, date: L.today(), at: Date.now(), via: via, text: text,
      topics: topics.filter(function (t) { return t.on; }).map(function (t) { return { itemId: t.item.id, title: t.item.title, state: t.state, tone: t.tone }; })
    });
  },
  lastLabel: function (sid) {
    var h = ParentMsg.history(sid);
    return h.length ? '上次聯絡 ' + L.md(h[0].date) + (h.length > 1 ? '（共 ' + h.length + ' 次）' : '') : '';
  },
  /* 學生在這個事項的狀態（選擇學生時顯示） */
  status: function (s, item) {
    if (item.type === 'check') {
      var c = Q.checkMap(item.id)[s.id];
      return c && c.checked ? { done: true, text: '已完成' } : { done: false, text: '<span class="red">未完成</span>' };
    }
    if (item.type === 'score') {
      var sc = Q.scoreMap(item.id)[s.id];
      if (!sc || (!sc.absent && (sc.score === '' || sc.score == null))) return { done: false, text: '<span class="dim">未登記</span>' };
      return { done: true, text: sc.absent ? '<span class="red">缺考</span>' : sc.score + ' 分' };
    }
    var n = (ParentMsg.logsOf(s, item.title) || []).length;
    return { done: n > 0, text: n + ' 次' };
  },
  /* 事項頁「家長訊息」：先選學生，再逐位產生訊息 */
  pick: function (item) {
    var all = Q.rosterOf(item).filter(function (s) { return !s.out; });
    var defFilter = item.type === 'check' ? 'todo' : item.type === 'log' ? 'has' : 'all';
    var labels = item.type === 'check' ? [['todo', '未完成'], ['all', '全部']] : item.type === 'log' ? [['has', '有紀錄'], ['all', '全部']] : null;
    var filter = defFilter;
    var current = function () {
      return all.filter(function (s) { return filter === 'all' || (filter === 'todo' ? !ParentMsg.status(s, item).done : ParentMsg.status(s, item).done); });
    };
    var listHtml = function () {
      var list = current();
      return list.length ? '<div class="menu-list">' + list.map(function (s) {
        var h0 = ParentMsg.history(s.id)[0];
        return '<button data-sid="' + s.id + '"><span class="no">' + s.no + '</span><span>' + esc(s.name) + '</span>' + (h0 ? '<span class="tag">已聯絡 ' + L.md(h0.date) + '</span>' : '') + '<span class="sub">' + ParentMsg.status(s, item).text + '</span></button>';
      }).join('') + '</div>' : '<div class="empty">沒有符合的學生</div>';
    };
    UI.sheet({
      title: '家長訊息',
      body: '<div class="dim center" style="margin:-4px 0 8px">選擇學生，整理要跟那位家長說的事</div>' +
        (labels ? '<div class="seg full" id="pm-filter">' + labels.map(function (o) { return '<button data-f="' + o[0] + '" class="' + (o[0] === filter ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>' : '') +
        '<div id="pm-list" style="margin-top:6px">' + listHtml() + '</div>',
      onMount: function (el, close) {
        el.addEventListener('click', function (e) {
          var f = e.target.closest('[data-f]');
          if (f) {
            filter = f.dataset.f;
            el.querySelectorAll('[data-f]').forEach(function (x) { x.classList.toggle('on', x === f); });
            el.querySelector('#pm-list').innerHTML = listHtml();
            return;
          }
          var b = e.target.closest('[data-sid]');
          if (!b) return;
          var queue = current().map(function (x) { return x.id; });
          close();
          setTimeout(function () { ParentMsg.open(b.dataset.sid, item, queue, function () { ParentMsg.pick(item); }); }, 0);
        });
      }
    });
  },
  /* 依事項類型與情境的預設模版。每個情境可有幾種語氣，文字中的 {T} 為事項名稱。 */
  TPL: {
    checkTodo: { 提醒: '「{T}」還沒有完成，麻煩協助提醒孩子儘快完成。', 繳費: '「{T}」{A}還沒有繳交，麻煩協助準備。' },
    checkDone: { 感謝: '「{T}」已經完成了。' },
    log: { 提醒: '這學期「{T}」{N} 次（{D}），麻煩在家協助提醒。', 表揚: '這學期「{T}」{N} 次（{D}），表現很好，請多給鼓勵。' },
    absent: { 補考: '「{T}」缺考，會再安排補考時間。' },
    scoreLow: { 需加強: '「{T}」得到 {S} 分（滿分 {M}），這次比較需要加強，麻煩協助複習。', 一般: '「{T}」得到 {S} 分（滿分 {M}{V}）。' },
    score: { 一般: '「{T}」得到 {S} 分（滿分 {M}{V}）。', 表揚: '「{T}」得到 {S} 分，表現很好，請多給鼓勵！' }
  },
  /* 整理這位學生在各進行中事項的情境 */
  topics: function (s) {
    var out = [];
    ['check', 'score'].forEach(function (type) {
      Q.items(type, s.classId).forEach(function (item) {
        if ((item.roster || []).indexOf(s.id) < 0) return;
        var o = item.opts || {};
        var t = { item: item, vars: { T: ParentMsg.name(item) } };
        if (type === 'check') {
          var c = Q.checkMap(item.id)[s.id];
          if (c && c.checked) { t.sit = 'checkDone'; t.state = '已完成'; t.on = false; }
          else {
            t.sit = 'checkTodo'; t.state = '未完成'; t.on = true;
            t.vars.A = o.amount && o.defaultAmount ? ' ' + o.defaultAmount + ' 元' : '';
            t.tones = o.amount ? ['繳費', '提醒'] : ['提醒'];
          }
        } else if (type === 'score') {
          var sm = Q.scoreMap(item.id);
          var sc = sm[s.id];
          if (!sc || (!sc.absent && (sc.score === '' || sc.score == null))) return;
          var max = o.max || 100;
          if (sc.absent) { t.sit = 'absent'; t.state = '缺考'; t.on = true; }
          else {
            var ids = Q.rosterOf(item).filter(function (x) { return !x.out; }).map(function (x) { return x.id; });
            var st = L.scoreStats(ids, sm);
            var n = Number(sc.score);
            t.vars.S = sc.score;
            t.vars.M = max;
            t.vars.V = st.avg == null || !Pref.msgAvg() ? '' : '，全班平均 ' + st.avg;
            t.state = sc.score + ' 分';
            if (n < max * 0.6) { t.sit = 'scoreLow'; t.on = true; }
            else { t.sit = 'score'; t.on = false; if (n >= max * 0.9) t.tone = '表揚'; }
          }
        }
        var tones = t.tones = t.tones || Object.keys(ParentMsg.TPL[t.sit]);
        if (!t.tone || tones.indexOf(t.tone) < 0) t.tone = tones[0];
        out.push(t);
      });
    });
    // 快速登記：這學期每個事項一則
    var saved = Settings.get('logTones', {}) || {};
    var by = {};
    ParentMsg.logsOf(s).forEach(function (l) { (by[l.label] = by[l.label] || []).push(l); });
    L.logSummary(ParentMsg.logsOf(s)).forEach(function (c) {
      var evs = by[c.label];
      var t = { item: QLog.asItem(s.classId, c.label), sit: 'log', state: evs.length + ' 次', on: false, tones: Object.keys(ParentMsg.TPL.log) };
      t.vars = { T: c.label, N: evs.length, D: evs.slice(-5).map(function (e) { return L.md(e.date); }).join('、') + (evs.length > 5 ? '等' : '') };
      t.tone = saved[c.label] || (/加分|表揚|優良|幫忙|協助|主動|進步|榮譽|獎/.test(c.label) ? '表揚' : '提醒');
      out.push(t);
    });
    return out;
  },
  /* 這位學生這學期的快速登記（舊到新）；給 label 時只取那個事項 */
  logsOf: function (s, label) {
    var from = semesterStart();
    return DB.where('logs', function (l) { return l.studentId === s.id && l.date >= from && (label == null || l.label === label); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.at || 0) - (b.at || 0); });
  },
  sentence: function (t) {
    return ParentMsg.TPL[t.sit][t.tone].replace(/\{(\w)\}/g, function (m, k) { return t.vars[k] == null ? '' : t.vars[k]; });
  },
  compose: function (s, topics, extra) {
    var on = topics.filter(function (t) { return t.on; });
    var lines = on.map(ParentMsg.sentence);
    if (extra) lines.push(extra.replace(/[。！!]?$/, '。'));
    var hi = s.name + '家長您好：';
    if (!lines.length) return ParentMsg.wrap(hi, ['']);
    if (lines.length === 1) return ParentMsg.wrap(hi, [(on.length ? s.name : '') + lines[0], '謝謝您！']);
    return ParentMsg.wrap(hi, ['跟您說明' + s.name + '最近在學校的幾件事：'].concat(lines.map(function (l, i) { return (i + 1) + '. ' + l; })).concat(['謝謝您！']));
  },
  /* 個別學生的訊息：勾選要談的事情，依情境模版整理成一則。back：按「回上頁」時要回到的畫面（例如選學生清單） */
  open: function (sid, origin, queue, back) {
    var s = Q.student(sid);
    if (!s) return;
    var topics = ParentMsg.topics(s);
    topics.forEach(function (t) { if (origin && t.item.id === origin.id) t.on = true; });
    var next = queue ? queue[queue.indexOf(sid) + 1] : null;
    var actions = [
      { label: icon('back') + '回上頁', cls: 'back', onClick: function () { if (back) setTimeout(back, 0); } },
      { label: icon('share') + '分享', onClick: function (el) { var v = el.querySelector('#pm-text').value; ParentMsg.share(v, function () { ParentMsg.log(s, topics, v, '分享'); }); return false; } },
      { label: icon('copy') + '複製', cls: 'primary', onClick: function (el, close) { var ta = el.querySelector('#pm-text'); var v = ta.value; ParentMsg.copy(ta, close, function () { ParentMsg.log(s, topics, v, '複製'); }); return false; } }
    ];
    if (next && Q.student(next)) actions.push({ label: '下一位 ›', onClick: function () { setTimeout(function () { ParentMsg.open(next, origin, queue, back); }, 0); } });
    var rows = topics.map(function (t, i) {
      var tones = t.tones;
      return '<div class="pm-topic"><label class="check-line grow"><input type="checkbox" data-t="' + i + '"' + (t.on ? ' checked' : '') + '><span class="grow ellipsis">' + esc(t.item.title) + '</span><span class="sub ' + (t.on ? 'red' : 'dim') + '">' + esc(t.state) + '</span></label>' +
        (tones.length > 1 ? '<div class="seg small">' + tones.map(function (n) { return '<button data-t="' + i + '" data-tone="' + n + '" class="' + (n === t.tone ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div>' : '') + '</div>';
    }).join('');
    UI.sheet({
      title: '家長訊息',
      body: '<div class="dim center" style="margin:-4px 0 8px">' + s.no + ' 號　' + esc(s.name) + (ParentMsg.lastLabel(s.id) ? '　<span class="red">' + ParentMsg.lastLabel(s.id) + '</span>' : '') + '</div>' +
        '<div class="section-label" style="margin-top:0">要談的事情</div>' +
        (rows || '<div class="dim">這位學生目前沒有進行中的事項紀錄，可以在下方自己補充。</div>') +
        '<label class="field" style="margin-top:10px"><span>補充（選填）</span><input class="input" id="pm-extra" placeholder="例如：最近上課比較容易分心"></label>' +
        '<textarea class="input pm-text" id="pm-text" rows="7"></textarea>' +
        '<p class="dim">只寫這位學生的狀況。訊息可直接修改，但改變上方勾選會重新產生；署名在「設定 › 家長訊息」。</p>',
      actions: actions,
      onMount: function (el) {
        var ta = el.querySelector('#pm-text');
        var extra = el.querySelector('#pm-extra');
        var redo = function () { ta.value = ParentMsg.compose(s, topics, extra.value.trim()); };
        redo();
        el.addEventListener('change', function (e) {
          var cb = e.target.closest('input[type=checkbox][data-t]');
          if (!cb) return;
          var t = topics[Number(cb.dataset.t)];
          t.on = cb.checked;
          var lab = cb.parentNode.querySelector('.sub');
          lab.classList.toggle('red', t.on);
          lab.classList.toggle('dim', !t.on);
          redo();
        });
        el.addEventListener('click', function (e) {
          var b = e.target.closest('[data-tone]');
          if (!b) return;
          var t = topics[Number(b.dataset.t)];
          t.tone = b.dataset.tone;
          t.on = true;
          b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
          var cb = el.querySelector('input[type=checkbox][data-t="' + b.dataset.t + '"]');
          cb.checked = true;
          if (t.sit === 'log') { var tones = Object.assign({}, Settings.get('logTones', {})); tones[t.item.title] = t.tone; Settings.set('logTones', tones); }
          redo();
        });
        extra.addEventListener('input', redo);
      }
    });
  },
  copy: function (ta, close, onDone) {
    var text = ta.value;
    var ok = function () { if (onDone) onDone(); UI.buzz(10); if (close) close(); UI.toast('已複製，可以貼到 LINE 傳給家長'); };
    var fallback = function () {
      ta.focus();
      ta.select();
      var copied = false;
      try { copied = document.execCommand('copy'); } catch (e) {}
      if (copied) ok(); else UI.toast('請長按文字手動複製');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  },
  /* onDone 只在確定交給分享面板或 LINE 後呼叫；被拒絕（例如框架不允許分享）時改開 LINE */
  share: function (text, onDone) {
    var line = function () {
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
      if (onDone) onDone();
    };
    if (!navigator.share) { line(); return; }
    navigator.share({ text: text }).then(function () { if (onDone) onDone(); }, function (err) {
      if (!err || err.name !== 'AbortError') line();
    });
  }
};
Act.studentMsg = function (d) { ParentMsg.open(d.id); };
Act.viewContact = function (d) {
  var c = DB.get('contacts', d.id);
  if (!c) return;
  UI.sheet({
    title: '家長聯絡紀錄',
    body: '<div class="dim center" style="margin:-4px 0 8px">' + L.fmtStamp(c.at) + '　' + esc(c.via || '') + '</div><textarea class="input pm-text" id="pm-text" rows="7" readonly>' + esc(c.text) + '</textarea>',
    actions: [
      { label: icon('trash') + '刪除這筆聯絡紀錄', del: true, onClick: function () {
        DB.del('contacts', c.id);
        UI.undo('已刪除聯絡紀錄', function () { DB.put('contacts', Object.assign({}, c, { deleted: false })); });
      } },
      { label: icon('back') + '回上頁', cls: 'back' },
      { label: icon('copy') + '再複製', cls: 'primary', onClick: function (el, close) { ParentMsg.copy(el.querySelector('#pm-text'), close); return false; } }
    ]
  });
};
Act.parentMsg = function (d) {
  var item = DB.get('items', d.item);
  if (item) ParentMsg.pick(item);
};
</script>

    <script>
/* 學生快速登記：先點學生，再點常見事項（掃地沒掃、缺交作業…），每點一次記一筆日期時間；
   也可「依事項看」：先選事項，再點學生 +1（舊版的累計表併入這裡）。
   可加備註與相片，事後依學生、期間、事項匯出 PDF 或試算表交出。 */

var DEFAULT_QUICK = ['掃地沒掃', '缺交作業', '上課吵鬧', '講髒話', '上課睡覺', '遲到', '忘記帶學用品', '服儀不整'];
Pref.quickList = function () {
  var v = Settings.get('quickList', null);
  return Array.isArray(v) ? v : DEFAULT_QUICK.slice();
};

var QLog = {
  photoCache: {},
  todayOf: function (pred) {
    var t = L.today();
    return DB.where('logs', function (l) { return l.date === t && pred(l); }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
  },
  add: function (sid, label) {
    var s = Q.student(sid);
    if (!s || !label) return null;
    var r = DB.put('logs', { id: uid(), classId: s.classId, studentId: sid, label: label, date: L.today(), at: Date.now(), note: '', photos: [] });
    UI.buzz(15);
    UI.undo('已登記 ' + s.no + ' 號：' + label, function () { DB.del('logs', r.id); });
    return r;
  },
  row: function (l, opts) {
    opts = opts || {};
    var s = Q.student(l.studentId);
    var n = (l.photos || []).length;
    return '<li class="li' + (opts.cls ? ' ' + opts.cls : '') + '" ' + (opts.attr || 'data-act="qlEdit"') + ' data-id="' + l.id + '"><span class="when' + (opts.date ? ' wide' : '') + '">' + (opts.date ? L.md(l.date) + ' ' : '') + (l.at ? L.hm(l.at) : '') + '</span>' +
      '<span class="grow">' + (opts.who && s ? '<span class="dim">' + s.no + '</span> ' + esc(s.name) + '　' : '') + '<b>' + esc(l.label) + '</b>' +
      (l.note ? '<div class="dim ellipsis">' + esc(l.note) + '</div>' : '') + '</span>' +
      (n ? '<span class="dim nowrap">' + icon('camera') + (n > 1 ? n : '') + '</span>' : '') + '</li>';
  },

  /* 點學生後的快速清單：每點一項記一筆；下方列出該生今天的登記，可點開加備註或相片 */
  open: function (sid) {
    var s = Q.student(sid);
    if (!s) return;
    var last = null;
    var draw = function (el) {
      var mine = QLog.todayOf(function (l) { return l.studentId === sid; });
      var cnt = {};
      mine.forEach(function (l) { cnt[l.label] = (cnt[l.label] || 0) + 1; });
      var list = Pref.quickList();
      el.innerHTML = '<div class="ql-items">' + list.map(function (x, i) {
        return '<button class="ql-item" data-ql="' + i + '"><span>' + esc(x) + '</span>' + (cnt[x] ? '<span class="badge">' + cnt[x] + '</span>' : '') + '</button>';
      }).join('') + '<button class="ql-item other" data-qother="1">' + icon('plus') + '<span>其他…</span></button></div>' +
        '<div class="row ql-sub"><span class="grow">今天的登記</span><button class="btn small" data-qedit-list="1">' + icon('edit') + '編輯清單</button></div>' +
        (mine.length ? '<ul class="list">' + mine.map(function (l) {
          return QLog.row(l, { attr: 'data-qrow="1"', cls: last === l.id ? 'hit' : '' });
        }).join('') + '</ul><p class="dim center" style="margin:6px 0 0">點一筆可加備註或相片</p>' : '<div class="dim">今天還沒有登記</div>');
    };
    var listener = null;
    UI.sheet({
      title: s.no + ' 號　' + esc(s.name),
      body: '',
      actions: [{ label: icon('user') + '個人明細', onClick: function () { App.go('personal', { id: sid }); } }, { label: '完成', cls: 'primary' }],
      onMount: function (el, close) {
        draw(el);
        listener = function () { draw(el); };
        DB.onChange(listener);
        el.addEventListener('click', function (e) {
          var b = e.target.closest('[data-ql]');
          if (b) {
            var r = QLog.add(sid, Pref.quickList()[Number(b.dataset.ql)]);
            last = r && r.id;
            draw(el);
            return;
          }
          if (e.target.closest('[data-qother]')) {
            UI.prompt('其他事項', '', { placeholder: '例如：午休講話', ok: '登記' }).then(function (v) {
              if (!v) return;
              var r = QLog.add(sid, v);
              last = r && r.id;
              draw(el);
            });
            return;
          }
          // 換頁前先關掉這個視窗（App.go 也會關），否則視窗會蓋住清單頁，返回鍵也按不到
          if (e.target.closest('[data-qedit-list]')) { close(); App.go('quickListEdit'); return; }
          var row = e.target.closest('[data-qrow]');
          // 從這裡打開的編輯視窗，按「不存，回上頁」或「儲存」後直接回到選學生的畫面
          if (row) QLog.edit(row.dataset.id, { after: close });
        });
      },
      onClose: function () { if (listener) DB.offChange(listener); }
    });
  },

  /* 編輯一筆登記：事項、日期時間、備註、相片。opts.after：按下面的按鈕離開時一併關掉的上一層視窗 */
  edit: function (id, opts) {
    opts = opts || {};
    var after = function () { if (opts.after) opts.after(); };
    var l = DB.get('logs', id);
    if (!l) return;
    var s = Q.student(l.studentId);
    var photos = (l.photos || []).slice();
    var uploading = 0;
    var labels = Pref.quickList();
    if (labels.indexOf(l.label) < 0) labels = [l.label].concat(labels);
    var drawPhotos = function (el) {
      el.querySelector('#ql-photos').innerHTML = photos.map(function (p, i) {
        var src = QLog.photoCache[p.id];
        return '<div class="ql-ph" data-view-ph="' + i + '">' + (src ? '<img src="' + src + '" alt="相片">' : '<span class="dim">' + icon('sync', 'spin') + '</span>') +
          '<button class="ql-ph-x" data-rm-ph="' + i + '" aria-label="移除相片">' + icon('close') + '</button></div>';
      }).join('') + (uploading ? '<div class="ql-ph"><span class="dim">' + icon('sync', 'spin') + '</span></div>' : '') +
        '<label class="ql-ph add">' + icon('camera') + '<span>加相片</span><input type="file" accept="image/*" id="ql-file" hidden></label>';
      photos.forEach(function (p) {
        if (QLog.photoCache[p.id] || QLog.photoCache[p.id + ':loading']) return;
        QLog.photoCache[p.id + ':loading'] = true;
        Backend.call('photo', { id: p.id }).then(function (r) {
          QLog.photoCache[p.id] = 'data:' + r.type + ';base64,' + r.base64;
          if (el.isConnected) drawPhotos(el);
        }).catch(function () {}).then(function () { QLog.photoCache[p.id + ':loading'] = false; });
      });
    };
    UI.sheet({
      title: '登記・' + (s ? s.no + ' 號 ' + esc(s.name) : ''),
      body: '<label class="field"><span>事項</span><select class="input" id="ql-label">' + labels.map(function (x) {
          return '<option' + (x === l.label ? ' selected' : '') + '>' + esc(x) + '</option>';
        }).join('') + '</select></label>' +
        '<div class="row"><label class="field grow"><span>日期</span><input class="input" type="date" required id="ql-date" value="' + l.date + '"></label>' +
        '<label class="field grow"><span>時間</span><input class="input" type="time" id="ql-time" value="' + (l.at ? L.hm(l.at) : '') + '"></label></div>' +
        '<label class="field"><span>備註</span><textarea class="input" id="ql-note" rows="3" placeholder="例如：第三節英文課，已提醒兩次">' + esc(l.note || '') + '</textarea></label>' +
        '<div class="field"><span>相片</span><div class="ql-photos" id="ql-photos"></div></div>',
      actions: [
        { label: icon('trash') + '刪除這筆登記', del: true, onClick: function () {
          DB.del('logs', l.id);
          UI.undo('已刪除這筆登記', function () { DB.put('logs', Object.assign({}, l, { deleted: false })); });
          after();
        } },
        { label: icon('back') + '不存，回上頁', cls: 'back', onClick: after },
        { label: '儲存', cls: 'primary', onClick: function (el) {
          if (uploading) { UI.toast('相片還在上傳，請稍候'); return false; }
          var date = el.querySelector('#ql-date').value || l.date;
          var tm = el.querySelector('#ql-time').value;
          var at = l.at;
          if (tm) { var d = L.parse(date); var p = tm.split(':'); d.setHours(Number(p[0]), Number(p[1])); at = d.getTime(); }
          DB.put('logs', Object.assign({}, DB.raw('logs', l.id) || l, { label: el.querySelector('#ql-label').value, date: date, at: at, note: el.querySelector('#ql-note').value.trim(), photos: photos }));
          UI.toast('已儲存');
          after();
        } }
      ],
      onMount: function (el) {
        drawPhotos(el);
        el.addEventListener('click', function (e) {
          var rm = e.target.closest('[data-rm-ph]');
          if (rm) { e.preventDefault(); photos.splice(Number(rm.dataset.rmPh), 1); drawPhotos(el); return; }
          var v = e.target.closest('[data-view-ph]');
          if (v) { var src = QLog.photoCache[photos[Number(v.dataset.viewPh)].id]; if (src) QLog.viewPhoto(src); }
        });
        el.addEventListener('change', function (e) {
          if (e.target.id !== 'ql-file' || !e.target.files[0]) return;
          var file = e.target.files[0];
          if (!online()) { UI.toast('離線中，相片要連上網路才能上傳'); return; }
          uploading++;
          drawPhotos(el);
          var name = Q.className(l.classId) + '_' + (s ? s.no + '號' + s.name : '') + '_' + l.date.replace(/-/g, '') + '_' + l.label;
          QLog.shrink(file, 1600).then(function (data) {
            return Backend.call('uploadPhoto', { data: data, name: name }).then(function (r) {
              QLog.photoCache[r.id] = data;
              photos.push({ id: r.id, name: r.name });
            });
          }).catch(function (err) { UI.error(err); }).then(function () {
            uploading--;
            if (el.isConnected) drawPhotos(el);
          });
        });
      }
    });
  },

  /* 先在手機上縮圖（長邊不超過 max），再轉成 JPEG data URL 上傳 */
  shrink: function (file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('無法讀取這張相片')); };
      img.src = url;
    });
  },
  /* 依事項看：期間（本週、本學期、全部） */
  period: function () { return App.ui.qlPeriod || 'sem'; },
  from: function () {
    var p = QLog.period();
    return p === 'week' ? L.weekStart(L.today()) : p === 'all' ? '0000-00-00' : semesterStart();
  },
  periodSeg: function () { return UI.seg('qlPeriod', [['week', '本週'], ['sem', '本學期'], ['all', '全部']], QLog.period()); },
  /* 某班某事項在期間內的登記，依學生分組（舊到新） */
  ofLabel: function (classId, label, from) {
    var m = {};
    DB.where('logs', function (l) { return l.classId === classId && l.label === label && l.date >= from; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.at || 0) - (b.at || 0); })
      .forEach(function (l) { (m[l.studentId] = m[l.studentId] || []).push(l); });
    return m;
  },
  /* 事項清單：快速清單的順序在前，其他有紀錄的事項依次數排在後面 */
  labels: function (classId, from) {
    var t = L.today();
    var m = {};
    var get = function (x) { return m[x] || (m[x] = { label: x, count: 0, today: 0, sids: {} }); };
    var quick = Pref.quickList();
    quick.forEach(get);
    DB.where('logs', function (l) { return l.classId === classId && l.date >= from; }).forEach(function (l) {
      var x = get(l.label);
      x.count++;
      x.sids[l.studentId] = true;
      if (l.date === t) x.today++;
    });
    var all = Object.keys(m).map(function (k) { var x = m[k]; x.students = Object.keys(x.sids).length; return x; });
    var pos = function (x) { var i = quick.indexOf(x.label); return i < 0 ? 1e6 : i; };
    return all.sort(function (a, b) { return pos(a) - pos(b) || b.count - a.count; });
  },
  /* 給家長訊息用的「事項」：同一個事項名稱的登記 */
  asItem: function (classId, label) {
    return { id: 'log:' + label, type: 'log', classId: classId, title: label, roster: Q.students(classId).map(function (s) { return s.id; }) };
  },
  viewPhoto: function (src) {
    UI.sheet({ center: true, body: '<img class="ql-full" src="' + src + '" alt="相片">', actions: [{ label: '關閉' }] });
  }
};

  var sid = students[App.ui.lxStu] ? App.ui.lxStu : '';

  var to = App.ui.lxTo || L.today();

  var all = L.logReport({ logs: logs, students: students, from: from, to: to, studentId: sid });
  var off = App.ui.lxOff || {};
  var labels = all.counts.map(function (c) { return c.label; });
  var chosen = labels.filter(function (x) { return !off[x]; });
  var rep = L.logReport({ logs: logs, students: students, from: from, to: to, studentId: sid, labels: chosen });
  return {
    cls: cls, students: students, sid: sid, from: from, to: to, all: all, rep: rep, off: off,
    note: App.ui.lxNote !== false, photos: App.ui.lxPhoto !== false
  };
}

Change.lxClass = function (d, el) { App.ui.lxStu = ''; App.ui.lxOff = {}; App.setUi('lxClass', el.value, false); };
Change.lxStu = function (d, el) { App.ui.lxOff = {}; App.setUi('lxStu', el.value, false); };
Change.lxLabel = function (d, el) {
  var off = Object.assign({}, App.ui.lxOff);
  if (el.checked) delete off[d.label]; else off[d.label] = true;

Change.lxOpt = function (d, el) { App.setUi(d.k, el.checked, false); };
function logFileName(x) {

}

      actions: [
        r.url && { label: '開啟試算表', onClick: function () { UI.download(r.url); } },
        { label: '下載 Excel', cls: 'primary', onClick: function () { UI.download(r.xlsxUrl); } }

    });

};

    <script>
/* 學生請假紀錄：以班級名單為基礎，記下學生哪天要請假、假別與原因、是否跟家長確認、是否完成請假手續。
   請假後還沒完成手續：以上課日計算（銷假回來第一個上課日算第 1 天，週末與行事曆上的放假日不算、補上課日要算），
   滿 Pref.leaveRemind() 個上課日提醒、滿 Pref.leaveWarn() 個警示（今日總覽、請假頁）。
   請假紀錄主要給老師看；需要時可對單一學生列出明細跟家長核對。 */

var LEAVE_KINDS = ['病假', '事假', '公假', '喪假', '生理假', '其他'];
Pref.leaveRemind = function () { return Number(Settings.get('leaveRemind', 7)) || 7; };
Pref.leaveWarn = function () { return Number(Settings.get('leaveWarn', 14)) || 14; };

var Leave = {
  _on: {},
  _school: null,
  /* 是否為上課日：依行事曆的「放假」「補上課」設定 */
  isSchool: function () {
    if (!this._school) this._school = L.schoolDays(DB.where('cal', function (e) { return !!e.dayType; }));
    return this._school;
  },
  /* 某班（不給則所有使用中班級）的請假，只算還在班上的學生 */
  list: function (classId) {
    var live = {};
    Q.classes().forEach(function (c) { live[c.id] = true; });
    return DB.where('leaves', function (l) {
      var s = Q.student(l.studentId);
      return (classId ? l.classId === classId : live[l.classId]) && s && !s.deleted && !s.out;
    });
  },
  board: function (classId) {
    return L.leaveBoard(this.list(classId), L.today(), { remind: Pref.leaveRemind(), warn: Pref.leaveWarn(), isSchool: this.isSchool() });
  },
  /* 某天請假的學生（學生ID → 請假紀錄），名單列標示用；資料變動時重算 */
  onDay: function (d) {
    d = d || L.today();
    if (!this._on[d]) {
      var m = {};
      DB.where('leaves', function (l) { return L.onLeave(l, d); }).forEach(function (l) { m[l.studentId] = l; });
      this._on[d] = m;
    }
    return this._on[d];
  },
  /* 名單上的請假標籤：date 為事項日期（不給則今天） */
  mark: function (sid, date) {
    var l = this.onDay(date)[sid];
    return l ? ' <span class="tag leave" title="' + (date && date !== L.today() ? L.md(date) + ' ' : '今天') + '請假">' + esc(l.kind || '請假') + '</span>' : '';
  },
  alertTag: function (a) {
    if (!a) return '';
    if (a.level === 'warn') return '<span class="tag red">警示・已過 ' + a.days + ' 個上課日</span>';
    if (a.level === 'remind') return '<span class="tag warn">提醒・已過 ' + a.days + ' 個上課日</span>';
    return '<span class="tag">' + (a.days ? '手續未完成・已過 ' + a.days + ' 個上課日' : '手續未完成') + '</span>';
  },
  /* 一筆請假：左側勾選「已完成手續」，中間日期、學生、假別、原因，右側狀態 */
  row: function (l, opts) {
    opts = opts || {};
    var s = Q.student(l.studentId);
    var t = L.today();
    var a = L.leaveAlert(l, t, Pref.leaveRemind(), Pref.leaveWarn(), this.isSchool());
    var days = L.leaveDays(l);
    var ahead = L.diffDays(t, l.start);
    var state = L.onLeave(l, t) ? '<span class="tag leave">今天請假</span>' : ahead > 0 ? '<span class="tag leave">' + (ahead === 1 ? '明天' : ahead === 2 ? '後天' : ahead + ' 天後') + '</span>' : '';
    var who = opts.who && s ? '<span class="dim">' + s.no + '</span> ' + esc(s.name) + '　' : '';
    var status = l.done ? '<span class="tag ok">手續完成</span>' : this.alertTag(a);
    var unrep = l.unreported ? '<span class="tag red">未報備</span>' : '';
    var body;
    if (opts.compact) {
      // 今日總覽用：一行「誰・假別・日期」，下面只放狀態
      body = '<span class="lv-who">' + who + (l.kind ? '<b>' + esc(l.kind) + '</b>　' : '') + '<span class="dim nowrap">' + L.leaveRange(l) + '</span></span>' +
        '<span class="lv-tags">' + state + unrep + (l.parentOk ? '' : '<span class="tag">家長未確認</span>') + (a && a.days > 0 ? status : '') + '</span>';
    } else {
      body = '<span class="lv-when">' + L.leaveRange(l) + (days > 1 ? '<span class="dim">　' + days + ' 天</span>' : '') + '</span>' +
        '<span class="lv-who">' + who + (l.kind ? '<b>' + esc(l.kind) + '</b>' : '') +
          (l.reason ? '<span class="dim">' + (l.kind ? '・' : '') + esc(l.reason) + '</span>' : '') + '</span>' +
        '<span class="lv-tags">' + state + unrep + (l.parentOk ? '<span class="tag ok">家長已確認</span>' : '<span class="tag">家長未確認</span>') + status + '</span>';
    }
    // 左側方框＝請假手續是否完成；方框下方直接寫「手續完成」，勾了改成「已完成」
    return '<li class="li lv-row' + (a && a.level !== 'pending' ? ' ' + a.level : '') + '">' +
      '<span class="lv-donebox' + (l.done ? ' on' : '') + '"><button class="lv-done' + (l.done ? ' on' : '') + '"' + (opts.still ? ' disabled' : ' data-act="leaveDone"') + ' data-id="' + l.id + '" aria-label="' + (l.done ? '已完成請假手續' : '標記已完成請假手續') + '">' +
        (l.done ? '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '</button><span class="cap">' + (l.done ? '手續<br>已完成' : '手續<br>完成') + '</span></span>' +
      '<span class="grow"' + (opts.still ? '' : ' data-act="leaveEdit"') + ' data-id="' + l.id + '">' + body + '</span></li>';
  },
  toggleDone: function (id) {
    var l = DB.get('leaves', id);
    if (!l) return;
    var done = !l.done;
    DB.put('leaves', Object.assign({}, l, { done: done, doneAt: done ? Date.now() : null }));
    UI.buzz(15);
    var s = Q.student(l.studentId);
    UI.undo((s ? s.no + ' 號 ' : '') + (done ? '已完成請假手續' : '改為手續未完成'), function () { DB.put('leaves', Object.assign({}, l, { deleted: false })); });
  },

  /* 新增或編輯請假。sid：新增時的學生；id：編輯既有紀錄 */
  edit: function (id, sid) {
    var old = id ? DB.get('leaves', id) : null;
    if (id && !old) return;
    var s = Q.student(old ? old.studentId : sid);
    if (!s) return;
    var t = L.today();
    var l = old || { id: uid(), classId: s.classId, studentId: s.id, start: t, end: '', kind: '', reason: '', parentOk: false, done: false };
    var kind = l.kind || '';
    var others = this.list(s.classId).filter(function (x) { return x.studentId === s.id && x.id !== l.id; })
      .sort(function (a, b) { return a.start < b.start ? 1 : -1; });
    var kinds = LEAVE_KINDS.slice();
    if (kind && kinds.indexOf(kind) < 0) kinds.splice(kinds.length - 1, 0, kind);
    var body = '<div class="row"><label class="field grow"><span>請假日期（可選任何一天）</span><input class="input" type="date" required id="lv-start" value="' + l.start + '"></label>' +
      '<label class="field grow"><span>到哪一天（連續多天才填）</span><input class="input" type="date" id="lv-end" min="' + l.start + '" value="' + (l.end && l.end > l.start ? l.end : '') + '"></label></div>' +
      '<div class="lv-quick" id="lv-quick"><span class="dim">快速選</span>' + [[0, '今天'], [1, '明天'], [2, '後天']].map(function (x) {
        return '<button type="button" class="chip" data-lv-day="' + L.addDays(t, x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="field"><span>假別</span><div class="chips" id="lv-kinds">' + kinds.map(function (k) {
        return '<button type="button" class="chip' + (k === kind ? ' on' : '') + '" data-lv-kind="' + esc(k) + '">' + esc(k) + '</button>';
      }).join('') + '</div></div>' +
      '<label class="field"><span>原因</span><textarea class="input" id="lv-reason" rows="2" placeholder="例如：看牙醫，下午返校">' + esc(l.reason || '') + '</textarea></label>' +
      '<label class="check-line"><input type="checkbox" id="lv-unrep"' + (l.unreported ? ' checked' : '') + '><span class="grow">未報備（事前沒有跟老師說）</span></label>' +
      '<label class="check-line"><input type="checkbox" id="lv-parent"' + (l.parentOk ? ' checked' : '') + '><span class="grow">已跟家長確認</span>' +
        (l.parentOk && l.parentAt ? '<span class="dim">' + L.fmtStamp(l.parentAt) + '</span>' : '') + '</label>' +
      '<label class="check-line"><input type="checkbox" id="lv-done"' + (l.done ? ' checked' : '') + '><span class="grow">已完成請假手續</span>' +
        (l.done && l.doneAt ? '<span class="dim">' + L.fmtStamp(l.doneAt) + '</span>' : '') + '</label>' +
      '<p class="dim lv-hint">還沒完成手續時，從銷假回來的第一個上課日算第 1 天，滿 ' + Pref.leaveRemind() + ' 個上課日提醒、滿 ' + Pref.leaveWarn() + ' 個上課日警示；週末與行事曆上的放假日不算。</p>' +
      (others.length ? '<div class="row ql-sub"><span class="grow">這位學生的其他請假</span><button type="button" class="btn small" data-lv-parent="1">' + icon('msg') + '跟家長核對</button></div>' +
        '<ul class="list">' + others.slice(0, 6).map(function (x) { return Leave.row(x, { still: true }); }).join('') + '</ul>' : '');
    var acts = [];
    if (old) acts.push({ label: icon('trash') + '刪除這筆請假', del: true, onClick: function () {
      DB.del('leaves', old.id);
      UI.undo('已刪除這筆請假', function () { DB.put('leaves', Object.assign({}, old, { deleted: false })); });
    } });
    acts.push({ label: icon('back') + '不存，回上頁', cls: 'back' });
    acts.push({ label: old ? '儲存' : '登記', cls: 'primary', onClick: function (el) {
      var start = el.querySelector('#lv-start').value;
      var end = el.querySelector('#lv-end').value;
      if (!start) { UI.toast('請選擇請假日期'); return false; }
      if (end && end < start) { var x = start; start = end; end = x; }
      if (end === start) end = '';
      var parentOk = el.querySelector('#lv-parent').checked;
      var done = el.querySelector('#lv-done').checked;
      var cur = DB.raw('leaves', l.id) || l;
      DB.put('leaves', Object.assign({}, cur, {
        start: start, end: end, kind: kind, reason: el.querySelector('#lv-reason').value.trim(), unreported: el.querySelector('#lv-unrep').checked,
        parentOk: parentOk, parentAt: parentOk ? cur.parentAt || Date.now() : null,
        done: done, doneAt: done ? cur.doneAt || Date.now() : null,
        createdAt: cur.createdAt || Date.now(), deleted: false
      }));
      UI.buzz(15);
      UI.toast(old ? '已儲存' : '已登記 ' + s.no + ' 號 ' + s.name + ' ' + L.md(start) + (end ? '～' + L.md(end) : '') + ' 請假');
    } });
    UI.sheet({
      title: s.no + ' 號　' + esc(s.name) + '・' + (old ? '請假' : '登記請假'),
      body: body,
      actions: acts,
      onMount: function (el) {
        var startEl = el.querySelector('#lv-start');
        var endEl = el.querySelector('#lv-end');
        var syncQuick = function () {
          el.querySelectorAll('[data-lv-day]').forEach(function (b) { b.classList.toggle('on', b.dataset.lvDay === startEl.value && !endEl.value); });
        };
        syncQuick();
        startEl.addEventListener('change', function () {
          endEl.min = startEl.value;
          if (endEl.value && endEl.value <= startEl.value) endEl.value = '';
          syncQuick();
        });
        endEl.addEventListener('change', syncQuick);
        el.addEventListener('click', function (e) {
          if (e.target.closest('[data-lv-parent]')) { setTimeout(function () { Leave.parentCheck(s.id); }, 0); return; }
          var d = e.target.closest('[data-lv-day]');
          if (d) { startEl.value = d.dataset.lvDay; endEl.value = ''; endEl.min = startEl.value; syncQuick(); return; }
          var k = e.target.closest('[data-lv-kind]');
          if (k) {
            var v = k.dataset.lvKind;
            if (v === '其他') {
              UI.prompt('假別', LEAVE_KINDS.indexOf(kind) < 0 ? kind : '', { placeholder: '例如：婚假、颱風停課', ok: '確定' }).then(function (x) {
                x = (x || '').trim();
                if (!x) return;
                kind = x;
                k.textContent = x;
                el.querySelectorAll('[data-lv-kind]').forEach(function (b) { b.classList.toggle('on', b === k); });
              });
              return;
            }
            kind = kind === v ? '' : v;
            el.querySelectorAll('[data-lv-kind]').forEach(function (b) { b.classList.toggle('on', b.dataset.lvKind === kind); });
          }
        });
      }
    });
  }
};
/* 跟家長核對：列出單一學生某期間的請假明細，可複製、分享或產生 PDF（只含這位學生） */
Leave.parentCheck = function (sid) {
  var s = Q.student(sid);
  if (!s) return;
  var mine = Leave.list(s.classId).filter(function (l) { return l.studentId === s.id; });
  var from = semesterStart();
  var to = mine.reduce(function (m, l) { return L.leaveEnd(l) > m ? L.leaveEnd(l) : m; }, L.today());
  var pick = function () {
    return mine.filter(function (l) { return l.start <= to && L.leaveEnd(l) >= from; }).sort(function (a, b) { return a.start < b.start ? -1 : 1; });
  };
  var text = function () {
    var sign = Pref.sign();
    return L.leaveText(pick(), { name: s.name, from: from, to: to }) + (sign ? '\n' + sign : '');
  };
  var logIt = function (ta, via) {
    DB.put('contacts', { id: uid(), studentId: s.id, classId: s.classId, date: L.today(), at: Date.now(), via: via, text: ta.value, topics: [{ title: '請假紀錄核對' }] });
  };
  UI.sheet({
    title: s.no + ' 號　' + esc(s.name) + '・請假明細',
    body: '<div class="row"><input class="input" type="date" required id="lp-from" value="' + from + '"><span>～</span><input class="input" type="date" required id="lp-to" value="' + to + '"></div>' +
      '<label class="field" style="margin-top:10px"><span>給家長的訊息（只含這位學生，可修改）</span><textarea class="input" id="lp-text" rows="9"></textarea></label>' +
      '<button type="button" class="btn block" data-lp-pdf="1">' + icon('export') + '產生 PDF 明細</button>',
    actions: [
      { label: icon('back') + '回上頁', cls: 'back' },
      { label: icon('share') + '分享', onClick: function (el, close) {
        var ta = el.querySelector('#lp-text');
        ParentMsg.share(ta.value, function () { logIt(ta, '分享'); close(); });
        return false;
      } },
      { label: icon('copy') + '複製', cls: 'primary', onClick: function (el, close) {
        var ta = el.querySelector('#lp-text');
        ParentMsg.copy(ta, close, function () { logIt(ta, '複製'); });
        return false;
      } }
    ],
    onMount: function (el) {
      var ta = el.querySelector('#lp-text');
      ta.value = text();
      el.addEventListener('change', function (e) {
        if (e.target.id === 'lp-from' && e.target.value) from = e.target.value;
        else if (e.target.id === 'lp-to' && e.target.value) to = e.target.value;
        else return;
        ta.value = text();
      });
      el.addEventListener('click', function (e) {
        if (!e.target.closest('[data-lp-pdf]')) return;
        var html = L.leaveReportHtml(pick(), { className: Q.className(s.classId), no: s.no, name: s.name, from: from, to: to });
        var done = UI.busy('產生 PDF 中…');
        Backend.call('htmlToPdf', { html: html, name: Q.className(s.classId) + '_' + s.no + '號_' + s.name + '_請假紀錄' }).then(function (r) {
          done();
          sharePdf(r);
        }).catch(function (err) { done(); UI.error(err); });
      });
    }
  });
};
Act.leaveParent = function (d) { Leave.parentCheck(d.sid); };

DB.onChange(function () { Leave._on = {}; Leave._school = null; });

Act.leave = function (d) { if (d.sid) Leave.edit(null, d.sid); else App.go('leave'); };
Act.leaveNew = function (d) { Leave.edit(null, d.sid); };
Act.leaveEdit = function (d) { Leave.edit(d.id); };
Act.leaveDone = function (d) { Leave.toggleDone(d.id); };
Change.lvClass = function (d, el) { App.setClass(el.value); };

/* 今日總覽的請假卡片：目前班級今天請假、這幾天要請假、手續未完成；超過天數另以橫幅提醒（所有班級） */
function leaveTodayHtml(cls) {
  var all = Leave.board();
  var h = '';
  if (all.warn || all.remind) {
    // 直接列出是哪幾位學生（座號、姓名；別班的學生前面加班級名稱）
    var names = function (level) {
      var seen = {};
      return all.todo.filter(function (x) { return x.level === level; }).map(function (x) {
        var s = Q.student(x.l.studentId);
        if (!s || seen[s.id]) return '';
        seen[s.id] = true;
        return (cls && s.classId !== cls.id ? Q.className(s.classId) + ' ' : '') + s.no + ' 號 ' + s.name;
      }).filter(Boolean);
    };
    var warn = names('warn');
    var remind = names('remind');
    var line = function (label, list, n) { return label + '：' + esc(list.join('、')) + ' 銷假後已滿 ' + n + ' 個上課日還沒完成請假手續'; };
    h += '<button class="banner block lv-banner' + (all.warn ? '' : ' warn') + '" data-act="leaveLate">' + icon('alert') + '<span>' +
      (warn.length ? line('警示', warn, Pref.leaveWarn()) : '') + (warn.length && remind.length ? '；' : '') + (remind.length ? line('提醒', remind, Pref.leaveRemind()) : '') + '</span></button>';
  }
  if (!cls) return h;
  var b = Leave.board(cls.id);
  var t = L.today();
  var soon = b.upcoming.filter(function (l) { return L.diffDays(t, l.start) <= 7; });

/* ============ 請假頁：以班級名單為基礎 ============ */
Views.leave = {

    var late = b.todo.filter(function (x) { return x.level !== 'pending'; }).map(function (x) { return x.l; }).sort(byDate);

      (soon.length ? '<ul class="list">' + soon.slice().sort(byDate).map(function (l) { return Leave.row(l, { who: true }); }).join('') + '</ul>' : '<div class="dim">目前沒有登記的請假</div>') + '</div>';

        '<ul class="list">' + past.map(function (x) { return Leave.row(x.l, { who: true, compact: true }); }).join('') + '</ul>' +
        '<p class="dim lv-hint">點左邊方框即可標記「已完成請假手續」。</p></div>';

  }
};

/* 設定：提醒與警示天數 */
Change.leaveDays = function (d, el) {
  var n = Math.round(Number(el.value));
  var remind = d.key === 'leaveRemind' ? n : Pref.leaveRemind();
  var warn = d.key === 'leaveWarn' ? n : Pref.leaveWarn();
  if (!(n >= 1) || remind >= warn) {

    return;
  }
  Settings.set(d.key, n);
};

    <script>/*
 * 網頁版前端接線：取代 GAS 後端（Backend.call），並負責
 * - 首次使用的選擇畫面（Google 雲端硬碟同步／只存在這台裝置／從 Excel 開始）
 * - 與雲端硬碟或電腦上的 Excel 檔同步（Cloud）
 * - 相片、PDF、匯出 Excel、名單匯入、備份等原本由 GAS 處理的功能
 * 載入順序：xlsx.js、gas-shim.js、runtime.js、drive.js、App 的 js_*、本檔。
 */
var WEB = { version: (window.BOOT && BOOT.version) || '' };
var DATA_FILE = '老師隨手記資料.xlsx';

/* ---------- 裝置上的儲存（IndexedDB） ---------- */
var WebStore = {
  db: null,
  open: function () {
    var self = this;
    if (this.db) return Promise.resolve(this.db);
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open('teacher-notes-web', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onsuccess = function () { self.db = req.result; resolve(self.db); };
        req.onerror = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
  },
  get: function (k) {
    return this.open().then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        var req = db.transaction('kv').objectStore('kv').get(k);
        req.onsuccess = function () { resolve(req.result == null ? null : req.result); };
        req.onerror = function () { resolve(null); };
      });
    });
  },
  set: function (k, v) {
    return this.open().then(function (db) {
      if (!db) return;
      return new Promise(function (resolve) {
        try {
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, k);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { resolve(); };
        } catch (e) { resolve(); }
      });
    });
  },
  del: function (k) {
    return this.open().then(function (db) {
      if (!db) return;
      try { db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) {}
    });
  }
};

/* ---------- 小工具 ---------- */
function webBytesToB64(bytes) {
  var s = '';
  for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function webB64ToBytes(b64) {
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
var webBlobNames = {};
function webBlobUrl(bytes, type, name) {
  var url = URL.createObjectURL(new Blob([bytes], { type: type }));
  webBlobNames[url] = name;
  return url;
}
/** 把檔案存到這台裝置（下載）。 */
function webSaveFile(bytes, name, type) {
  var a = document.createElement('a');
  a.href = webBlobUrl(bytes, type || 'application/octet-stream', name);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 10000);
}
/** 讓老師選一個檔案。 */
function webPickFile(accept) {
  return new Promise(function (resolve) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept || '';
    inp.style.display = 'none';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return resolve(null);
      f.arrayBuffer().then(function (b) { resolve({ name: f.name, bytes: new Uint8Array(b), type: f.type }); });
    });
    document.body.appendChild(inp);
    inp.click();
  });
}
function webStamp(ms) {
  var d = new Date(ms);
  return d.getFullYear() + '-' + L.pad(d.getMonth() + 1) + '-' + L.pad(d.getDate());
}
function webLoadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error('無法載入 ' + src + '，請確認網路連線')); };
    document.head.appendChild(s);
  });
}

/* ---------- 資料引擎 ---------- */
WEB.rt = null;
WEB.meta = { mode: null };
WEB._saveT = null;
WEB.saveSoon = function () {
  clearTimeout(WEB._saveT);
  WEB._saveT = setTimeout(WEB.saveNow, 250);
};
WEB.saveNow = function () {
  clearTimeout(WEB._saveT);
  if (!WEB.rt) return Promise.resolve();
  return Promise.all([WebStore.set('rt', WEB.rt.dump()), WebStore.set('meta', WEB.meta)]);
};
WEB.newRuntime = function (saved) {
  saved = saved || {};
  var rt = WebRuntime.createRuntime({
    gasSource: window.GAS_SOURCE,
    createFakeGas: window.createFakeGas,
    Xlsx: Xlsx,
    state: saved.state,
    ops: saved.ops,
    seq: saved.seq,
    uploadedSeq: saved.uploadedSeq,
    lastNow: saved.lastNow

  window.__fake = rt.fake;
  return rt;
};
WEB.setState = function (state, replay) {
  WEB.rt.rebase(state, replay);

  WEB.saveSoon();
};
WEB.info = function () {
  var m = WEB.meta;
  return {
    version: WEB.version,
    mode: 'W',
    email: m.mode === 'google' ? m.email || '' : '',

};

/* ---------- 後端轉接 ---------- */
Backend.local = true;
Backend.call = function (action, payload) {
  payload = payload || {};

  if (special) return Promise.resolve().then(function () { return special(payload); });
  return new Promise(function (resolve, reject) {
    setTimeout(function () {
      try {
        var data = WEB.rt.call(action, payload);
        if (action === 'pull') data.info = WEB.info();

  });
};
// 畫面上的同步圖示改顯示「與雲端／檔案」的同步狀態
Sync.view = function () {

WEB.actions = {

  importRoster: function () { throw new Error('請改用「從 Excel 匯入」'); },
  resetPin: function () { return WEB.resetPin(); },

  uploadPhoto: function (p) { return Photos.upload(p); },

/* ---------- 同步：Google 雲端硬碟或電腦上的 Excel 檔 ---------- */
var Providers = {};
Providers.google = {
  label: 'Google 雲端硬碟',
  check: function () {
    return Drive.meta(WEB.meta.fileId).then(function (m) {

      if (e.status === 404) return { missing: true };

    });
  },
  download: function () { return Drive.download(WEB.meta.fileId); },
  upload: function (bytes) {
    return Drive.update(WEB.meta.fileId, bytes).then(function (r) { return { version: String(r.version) }; });
  },
  recreate: function (bytes) {

Providers.file = {
  label: '電腦上的 Excel 檔',
  handle: null,
  perm: function (ask) {
    var h = this.handle;

var Cloud = {

  error: '',
  lastSync: 0,
  running: null,
  again: false,
  timer: null,
  provider: function () {
    var m = WEB.meta.mode;

  },
  set: function (s, err) {

  sync: function (opts) {

            WEB.meta.version = r.version;

      return rebaseIfNewer(false).then(function (changed) {
        if (changed && ++tries < 4) return push();
        if (changed) snap = WEB.rt.snapshot();
        return p.upload(snap.bytes).then(function (r) {
          WEB.meta.version = r.version;
          WEB.rt.ack(snap);
        });
      });
    };
    this.running = prep
      .then(function () { return rebaseIfNewer(!!opts.download); })
      .then(push)
      .then(function () {
        self.lastSync = Date.now();
        WEB.meta.lastSync = self.lastSync;
        self.set('synced');
        WEB.saveNow();
        if (pulled && window.App && App.booted) Sync.run();
        return self.backup(false).catch(function () {});
      })
      .catch(function (e) {
        console.warn(e);
        if (e && e.needsTap) self.set('tap', e.message);
        else if (navigator.onLine === false) self.set('offline');
        else self.set('error', (e && e.message) || String(e));
      })
      .then(function () {
        self.running = null;
        if (self.again) { self.again = false; self.schedule(500); }
      });
    return this.running;
  },
  /** 每週（或 force 時）備份。雲端硬碟：存到「老師隨手記備份」資料夾保留 4 份；只存在裝置時：下載一份 Excel。 */
  backup: function (force) {
    var rt = WEB.rt;
    var now = Date.now();
    var last = Number(rt.getProp('LAST_BACKUP') || 0);
    var name = '老師隨手記資料 備份 ' + webStamp(now) + '.xlsx';
    if (WEB.meta.mode !== 'google' || !WEB.meta.fileId) {
      if (!force) return Promise.resolve(null);
      webSaveFile(rt.toXlsx(), name, Drive.XLSX_MIME);
      rt.setProp('LAST_BACKUP', now);
      return Promise.resolve({ at: now, kept: 1 });
    }
    if (!force && now - last < 7 * 86400000) return Promise.resolve(null);
    var folder;
    return Drive.folder('老師隨手記備份', 'backup').then(function (f) {
      folder = f;
      return Drive.create(name, rt.toXlsx(), Drive.XLSX_MIME, folder);
    }).then(function () { return Drive.list(folder); }).then(function (files) {
      var mine = files.filter(function (f) { return f.name.indexOf('老師隨手記資料 備份 ') === 0; });
      return Promise.all(mine.slice(4).map(function (f) { return Drive.trash(f.id); })).then(function () {
        rt.setProp('LAST_BACKUP', now);
        return { at: now, kept: Math.min(mine.length, 4) };
      });
    });
  },
  resetFile: function () {
    if (WEB.meta.mode === 'google') { WEB.meta.fileId = ''; return Cloud.connectGoogle({ keepLocal: true }).then(function () { return { ok: true }; }); }
    return Promise.resolve({ ok: true });
  },

  /** 連接 Google 帳號（必須在點擊時呼叫）。找到雲端資料檔就載入，否則建立新檔。 */
  connectGoogle: function (opts) {
    opts = opts || {};
    var self = this;
    var hadData = WEB.rt.hasData();
    var done = UI.busy('連接 Google 雲端硬碟…');
    return Drive.token(true, { prompt: opts.prompt })
      .then(function () { return Drive.about(); })
      .then(function (who) {
        WEB.meta.email = who.email;
        return opts.keepLocal ? [] : Drive.find(DATA_FILE);
      })
      .then(function (files) {
        if (!files.length) {
          // 雲端沒有資料檔：用這台裝置的資料建立
          if (!WEB.rt.hasData()) WEB.rt.call('pull', { since: 0 });
          return Drive.create(DATA_FILE, WEB.rt.toXlsx()).then(function (r) {
            WEB.meta.fileId = r.id;
            WEB.meta.version = String(r.version);
            WEB.rt.uploadedSeq = WEB.rt.seq;
            WEB.rt.ops = [];
            return 'created';
          });
        }
        var f = files[0];
        return Drive.download(f.id).then(function (bytes) {
          var remote = WebRuntime.sheetsToState(Xlsx.read(bytes));
          var ask = hadData && !opts.useCloud;
          if (ask) done();
          var choose = ask ? WEB.askMerge() : Promise.resolve('cloud');
          return choose.then(function (how) {
            if (!how) throw Object.assign(new Error('已取消'), { cancelled: true });
            WEB.meta.fileId = f.id;
            WEB.meta.version = String(f.version);
            if (how === 'device') { WEB.rt.ops = []; WEB.rt.touch(); return how; }
            WEB.setState(remote, false);
            return how;
          });
        });
      })
      .then(function (how) {
        done();
        WEB.meta.mode = 'google';
        Providers.file.handle = null;
        WebStore.del('fileHandle');
        self.set('synced');
        WEB.saveNow();
        return how;
      })
      .catch(function (e) {
        done();
        if (!e.cancelled) throw e;
      });
  },
  disconnect: function () {
    Drive.signOut();
    WEB.meta = { mode: 'local' };
    Providers.file.handle = null;
    WebStore.del('fileHandle');
    this.set('local');
    WEB.saveNow();
  },
  /** 電腦版 Chrome／Edge：把資料自動存到一個 Excel 檔。open 為 true 時開啟既有的檔案。 */
  linkFile: function (open) {
    var self = this;
    var types = [{ description: 'Excel 活頁簿', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }];
    var pick = open
      ? window.showOpenFilePicker({ types: types, multiple: false }).then(function (hs) { return hs[0]; })
      : window.showSaveFilePicker({ suggestedName: DATA_FILE, types: types });
    var hadData = WEB.rt.hasData();
    return pick.then(function (h) {
      Providers.file.handle = h;
      return Providers.file.perm(true).then(function () { return h.getFile(); }).then(function (f) {
        if (!open || !f.size) return 'device';
        return f.arrayBuffer().then(function (b) {
          var remote = WebRuntime.sheetsToState(Xlsx.read(new Uint8Array(b)));
          return (hadData ? WEB.askMerge('這個 Excel 檔') : Promise.resolve('cloud')).then(function (how) {
            if (!how) throw Object.assign(new Error('已取消'), { cancelled: true });
            if (how !== 'device') WEB.setState(remote, false);
            return how;
          });
        });
      }).then(function (how) {
        WEB.meta = { mode: 'file', fileName: h.name };
        WEB.meta.version = '';
        if (how === 'device') WEB.rt.touch();
        WebStore.set('fileHandle', h);
        WEB.saveNow();
        return self.sync().then(function () { return how; });
      });
    }).catch(function (e) {
      if (e && (e.name === 'AbortError' || e.cancelled)) return null;
      throw e;
    });
  }
};

/* ---------- 相片 ---------- */
var Photos = {
  upload: function (p) {
    var m = String(p.data || '').match(/^data:(image\/(jpeg|png|webp));base64,([A-Za-z0-9+\/=]+)$/);
    if (!m) return Promise.reject(new Error('不支援這種相片格式'));
    var ext = m[2] === 'jpeg' ? 'jpg' : m[2];
    var name = String(p.name || '相片').replace(/[\\\/:*?"<>|\r\n]+/g, ' ').trim().slice(0, 80) + '.' + ext;
    var keepLocal = function () {
      var id = 'local-' + uid();
      return WebStore.set('photo:' + id, { type: m[1], base64: m[3] }).then(function () { return { id: id, name: name }; });
    };
    if (WEB.meta.mode !== 'google' || !Drive.hasToken() || navigator.onLine === false) return keepLocal();
    return Drive.folder('老師隨手記相片', 'photo').then(function (folder) {
      return Drive.create(name, webB64ToBytes(m[3]), m[1], folder);
    }).then(function (r) {
      WebStore.set('photo:' + r.id, { type: m[1], base64: m[3] });
      return { id: r.id, name: name };
    }, function (e) {
      console.warn('相片上傳失敗，先存在這台裝置：', e);
      return keepLocal();
    });
  },
  get: function (id) {
    return WebStore.get('photo:' + id).then(function (c) {
      if (c) return c;
      if (String(id).indexOf('local-') === 0) throw new Error('這張相片只存在當初拍照的裝置上');
      return Drive.fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media').then(function (res) {
        var type = res.headers.get('Content-Type') || 'image/jpeg';
        return res.arrayBuffer().then(function (b) {
          var r = { type: type, base64: webBytesToB64(new Uint8Array(b)) };
          WebStore.set('photo:' + id, r);
          return r;
        });
      });
    });
  },
  /** PDF 用：把 <img data-photo="ID"> 換成內嵌圖片。 */
  embed: function (html) {
    var ids = [];
    html.replace(/<img data-photo="([\w-]+)"/g, function (all, id) { ids.push(id); return all; });
    if (!ids.length) return Promise.resolve(html);
    var map = {};
    return Promise.all(ids.map(function (id) {
      return Photos.get(id).then(function (r) { map[id] = 'data:' + r.type + ';base64,' + r.base64; }, function () {});
    })).then(function () {
      return html.replace(/<img data-photo="([\w-]+)"/g, function (all, id) {
        return map[id] ? '<img src="' + map[id] + '"' : '<img alt="（相片無法讀取）"';
      });
    });
  }
};

/* ---------- 匯出：Excel 與 PDF ---------- */
var Exporter = {
  note: function (kind) {
    return WEB.meta.mode === 'google' ? '已存到雲端硬碟「老師隨手記匯出」資料夾' : '';
  },
  keep: function (name, bytes, mime) {
    if (WEB.meta.mode !== 'google' || !WEB.meta.fileId) return Promise.resolve(null);
    return Drive.folder('老師隨手記匯出', 'export').then(function (folder) {
      return Drive.find(name, { parent: folder }).then(function (old) {
        return Promise.all(old.map(function (f) { return Drive.trash(f.id); }));
      }).then(function () { return Drive.create(name, bytes, mime, folder); });
    }).then(function (r) { return Drive.viewUrl(r.id); }, function (e) { console.warn('存到雲端硬碟失敗：', e); return null; });
  },
  sheet: function (p) {
    var width = (p.header || []).length;
    var rows = [p.header].concat(p.rows || []).map(function (r) {
      var row = (r || []).slice(0, width);
      while (row.length < width) row.push('');
      return row.map(function (v) { return v == null ? '' : String(v); });
    });
    var sheets = [{ name: p.sheetName || '整班明細', rows: rows, header: true, widths: (p.header || []).map(function (h, i) { return i < 2 ? 10 : Math.max(8, Math.min(24, String(h).length * 2 + 2)); }) }];
    if (p.chart && p.chart.labels && p.chart.labels.length) {
      sheets.push({
        name: '統計',
        header: true,
        numbers: true,
        widths: [24, 12],
        rows: [['項目', p.chart.seriesName || '數值']].concat(p.chart.labels.map(function (l, i) { return [String(l), Number(p.chart.values[i]) || 0]; }))
      });
    }
    var bytes = Xlsx.write(sheets);
    var name = (p.title || '老師隨手記匯出') + '.xlsx';
    var blob = webBlobUrl(bytes, Drive.XLSX_MIME, name);
    return this.keep(name, bytes, Drive.XLSX_MIME).then(function (url) {
      return { name: name, url: url, xlsxUrl: blob, note: url ? Exporter.note() : '' };
    });
  },
  libs: function () {
    if (window.jspdf && window.html2canvas) return Promise.resolve();
    return webLoadScript('vendor/html2canvas.min.js').then(function () { return webLoadScript('vendor/jspdf.umd.min.js'); });
  },
  /** 把古典風格的報表 HTML 轉成 A4 PDF（在瀏覽器裡排版後轉成圖片）。 */
  pdf: function (p) {
    var name = (p.name || '個人明細') + '.pdf';
    var frame;
    return Promise.all([this.libs(), Photos.embed(String(p.html || ''))]).then(function (res) {
      var html = res[1];
      Exporter._html = html;
      frame = document.createElement('iframe');
      frame.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;visibility:hidden';
      document.body.appendChild(frame);
      var doc = frame.contentDocument;
      doc.open();
      doc.write(html.replace('<head>', '<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap">'));
      doc.close();
      return new Promise(function (resolve) {
        var waitImgs = Array.prototype.map.call(doc.images, function (img) {
          return img.complete ? null : new Promise(function (r) { img.onload = img.onerror = r; });
        }).filter(Boolean);
        var fonts = doc.fonts && doc.fonts.ready ? doc.fonts.ready : Promise.resolve();
        Promise.race([Promise.all(waitImgs.concat([fonts])), new Promise(function (r) { setTimeout(r, 4000); })]).then(function () { setTimeout(resolve, 150); });
      });
    }).then(function () {
      var doc = frame.contentDocument;
      var body = doc.body;
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      return window.html2canvas(body, { scale: 2, backgroundColor: getComputedStyle(body).backgroundColor || '#ffffff', windowWidth: 794, useCORS: true, logging: false }).then(function (canvas) {
        // 依頁高切頁；盡量切在空白列上，避免把一行字切成兩半
        var pxPerPt = canvas.width / pageW;
        var pagePx = Math.floor(pageH * pxPerPt);
        var ctx = canvas.getContext('2d');
        var y = 0;
        var first = true;
        while (y < canvas.height) {
          var end = Math.min(canvas.height, y + pagePx);
          if (end < canvas.height) {
            var best = end;
            var data = ctx.getImageData(0, Math.max(y, end - 160), canvas.width, Math.min(160, end - y)).data;
            var rows = data.length / 4 / canvas.width;
            for (var r = rows - 1; r >= 0; r--) {
              var base = r * canvas.width * 4;
              var r0 = data[base], g0 = data[base + 1], b0 = data[base + 2];
              var same = true;
              for (var x = 0; x < canvas.width; x += 3) {
                var k = base + x * 4;
                if (Math.abs(data[k] - r0) + Math.abs(data[k + 1] - g0) + Math.abs(data[k + 2] - b0) > 40) { same = false; break; }
              }
              if (same) { best = Math.max(y, end - 160) + r; break; }
            }
            end = best > y + pagePx / 2 ? best : end;
          }
          var part = document.createElement('canvas');
          part.width = canvas.width;
          part.height = end - y;
          var pctx = part.getContext('2d');
          pctx.fillStyle = getComputedStyle(body).backgroundColor || '#ffffff';
          pctx.fillRect(0, 0, part.width, part.height);
          pctx.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
          if (!first) pdf.addPage();
          first = false;
          pdf.setFillColor(getComputedStyle(body).backgroundColor || '#ffffff');
          pdf.addImage(part.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, pageW, (end - y) / pxPerPt);
          y = end;
        }
        return new Uint8Array(pdf.output('arraybuffer'));
      });
    }).then(function (bytes) {
      frame.remove();
      Exporter.last = { name: name, size: bytes.length, html: frame.srcdoc || Exporter._html };
      var blob = webBlobUrl(bytes, 'application/pdf', name);
      return Exporter.keep(name, bytes, 'application/pdf').then(function (url) {
        return { name: name, url: url || blob, downloadUrl: blob, base64: webBytesToB64(bytes), note: url ? Exporter.note() : '' };
      });
    }, function (e) {
      if (frame) frame.remove();
      throw e;
    });
  }
};

/* ---------- 名單：從 Excel 或 CSV 檔匯入 ---------- */
function webRosterFromRows(values) {
  var noCol = 0;
  var nameCol = 1;
  var start = 0;
  for (var r = 0; r < Math.min(values.length, 10); r++) {
    var row = (values[r] || []).map(function (v) { return String(v == null ? '' : v).trim(); });
    var a = row.indexOf('座號');
    var b = row.indexOf('姓名');
    if (a >= 0 && b >= 0) { noCol = a; nameCol = b; start = r + 1; break; }
  }
  var out = [];
  for (var i = start; i < values.length; i++) {
    var v = values[i] || [];
    var no = Number(v[noCol]);
    var name = String(v[nameCol] == null ? '' : v[nameCol]).trim();
    if (no > 0 && name) out.push({ no: no, name: name });
  }
  return out;
}
function webParseCsv(text) {
  return text.replace(/^﻿/, '').split(/\r?\n/).map(function (line) {
    var sep = line.indexOf('\t') >= 0 ? '\t' : ',';
    return line.split(sep).map(function (c) { return c.replace(/^"|"$/g, '').trim(); });
  });
}
Act.importRoster = function (d) {
  webPickFile('.xlsx,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv').then(function (f) {
    if (!f) return;
    var list;
    try {
      if (/\.xlsx$/i.test(f.name)) {
        var sheets = Xlsx.read(f.bytes).filter(function (s) { return !s.hidden; });
        list = webRosterFromRows(sheets[0] ? sheets[0].rows : []);
      } else {
        list = webRosterFromRows(webParseCsv(new TextDecoder('utf-8').decode(f.bytes)));
      }
    } catch (e) {
      UI.error(new Error('讀不到這個檔案：' + e.message + '。請選擇 Excel（.xlsx）或 CSV 檔'));
      return;
    }
    if (!list.length) { UI.toast('找不到名單：第一個工作表需有「座號」「姓名」欄，或前兩欄為座號與姓名'); return; }
    UI.confirm('找到 ' + list.length + ' 位學生（' + esc(list.slice(0, 3).map(function (x) { return x.no + ' ' + x.name; }).join('、')) + '…），要加入嗎？', { ok: '加入' }).then(function (y) {
      if (y) addStudents(d.id, list);
    });
  });
};

  h += '<button class="btn small" data-act="backupNow">' + icon('copy') + (m.mode === 'google' ? '立即備份' : '備份（下載 Excel）') + '</button>' +
    '<button class="btn small" data-act="webExport">' + icon('export') + '下載資料檔（Excel）</button>' +
    '<button class="btn small" data-act="webImport">' + icon('restore') + '從 Excel 匯入</button></div>';
  if (m.mode === 'google') {
    h += '<p class="dim">每次修改約 3 秒後自動存到你雲端硬碟裡的「' + DATA_FILE + '」，其他裝置打開時會自動取得最新資料。每週自動備份到「老師隨手記備份」資料夾，保留 4 份。資料檔可用 Excel 或 Google 試算表打開。</p>' +
      '<div class="row wrap"><button class="btn small danger" data-act="webDisconnect">中斷 Google 連接</button></div>';
  } else {
    h += '<p class="dim">' + (m.mode === 'file' ? '每次修改後自動存回這個 Excel 檔。' : '資料只存在這台裝置的瀏覽器裡；換裝置或清除瀏覽器資料前，請先下載資料檔。') + '</p>' +
      '<div class="menu-list">' +
      (Drive.configured() ? setRow('sync', '改用 Google 雲端硬碟同步（多台裝置共用）', 'webConnect') : '') +
      (window.showSaveFilePicker ? setRow('export', m.mode === 'file' ? '改用其他 Excel 檔' : '自動存到電腦上的 Excel 檔', 'webLinkFile') : '') +
      (m.mode === 'file' ? setRow('close', '停止自動存檔（只存在這台裝置）', 'webDisconnect') : '') +
      '</div>';
  }
  h += '<details class="adv"><summary class="dim">進階：Google 用戶端 ID</summary>' +
    '<p class="dim">一般不需要更改。學校或老師想用自己的 Google Cloud 專案時，可在這裡填入。</p>' +
    '<input class="input" data-change="webClientId" data-fk="web:cid" placeholder="' + esc((window.WEB_CONFIG && WEB_CONFIG.googleClientId) || '例如 1234-abc.apps.googleusercontent.com') + '" value="' + esc((function () { try { return localStorage.getItem('tn:web:clientId') || ''; } catch (e) { return ''; } })()) + '"></details>';
  h += '</div>';
  h += A2HS.settingsHtml();
  return h;
};
Change.webClientId = function (d, el) {
  var v = el.value.trim();
  if (v && !/\.apps\.googleusercontent\.com$/.test(v)) { UI.toast('格式不對：用戶端 ID 結尾是 .apps.googleusercontent.com'); return; }
  Drive.setClientId(v);
  UI.toast(v ? '已改用自訂的用戶端 ID' : '已改回網站預設的用戶端 ID');
  App.render();
};
Act.webSync = function () {
  Cloud.sync({ interactive: true }).then(function () {
    UI.toast(Cloud.status === 'synced' ? '已同步' : '同步失敗：' + (Cloud.error || Cloud.status));
  });
};
Act.webConnect = function () {
  if (!Drive.configured()) { UI.toast('網站尚未設定 Google 用戶端 ID'); return; }
  Cloud.connectGoogle().then(function (how) {
    if (!how) return;
    UI.toast(how === 'created' ? '已在雲端硬碟建立「' + DATA_FILE + '」' : '已連接 Google 雲端硬碟');
    return WEB.refreshClient(how).then(function () { return Cloud.sync(); });
  }).catch(function (e) { UI.error(e); });
};
Act.webLinkFile = function () {
  UI.menu([
    { icon: 'plus', label: '建立新的 Excel 檔', sub: '把這台裝置的資料存成新檔', onClick: function () { webLink(false); } },
    { icon: 'export', label: '開啟既有的 Excel 檔', sub: '例如之前存的老師隨手記資料', onClick: function () { webLink(true); } }
  ], '自動存到電腦上的 Excel 檔');
  function webLink(open) {
    Cloud.linkFile(open).then(function (how) {
      if (!how) return;
      UI.toast('之後會自動存到「' + WEB.meta.fileName + '」');
      return WEB.refreshClient(how);
    }).catch(function (e) { UI.error(e); });

};
Act.webDisconnect = function () {
  var g = WEB.meta.mode === 'google';
  UI.confirm(g ? '這台裝置會保留目前的資料，但不再與雲端硬碟同步。雲端硬碟裡的資料檔不會被刪除。' : '資料會保留在這台裝置，但不再自動存到 Excel 檔。', { title: g ? '中斷 Google 連接？' : '停止自動存檔？', ok: '中斷' }).then(function (yes) {
    if (!yes) return;
    Cloud.disconnect();
    App.render();
  });
};
Act.webExport = function () {
  webSaveFile(WEB.rt.toXlsx(), '老師隨手記資料 ' + webStamp(Date.now()) + '.xlsx', Drive.XLSX_MIME);
};
Act.webImport = function () {
  webPickFile('.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet').then(function (f) {
    if (!f) return;
    var st;
    try {
      var sheets = Xlsx.read(f.bytes);
      if (!sheets.some(function (s) { return s.name === '班級'; })) throw new Error('找不到「班級」工作表，這不是老師隨手記的資料檔。名單請到「班級與名單」匯入。');
      st = WebRuntime.sheetsToState(sheets);
    } catch (e) { UI.error(e); return; }
    UI.sheet({
      center: true,
      title: '從 Excel 匯入',
      body: '<p class="center">「' + esc(f.name) + '」</p><p class="dim center">可匯入網頁版下載的資料檔，或 GAS 版資料試算表下載成的 Excel。</p>',
      actions: [
        { label: '取消' },
        { label: '取代目前資料', cls: 'danger', onClick: function () { webImportApply(st, 'cloud'); } },
        { label: '合併', cls: 'primary', onClick: function () { webImportApply(st, 'merge'); } }
      ]
    });
  });
};
function webImportApply(st, how) {
  WEB.setState(st, false);
  WEB.rt.touch();
  WEB.refreshClient(how).then(function () {
    Cloud.schedule(0);
    UI.toast(how === 'merge' ? '已合併匯入的資料' : '已改用匯入的資料');
  });
}

Act.rebuild = function () {
  UI.confirm('會以' + (WEB.meta.mode === 'google' ? '雲端硬碟上' : '') + '資料檔的內容重新建立畫面上的資料；尚未同步的修改會先送出。', { title: '重新載入資料？', ok: '重新載入' }).then(function (yes) {
    if (!yes) return;
    var done = UI.busy('重新載入中…');
