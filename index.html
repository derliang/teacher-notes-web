/* ---------- 加到主畫面（讓網頁版用起來像 App） ----------
 * iOS 不允許網頁一鍵安裝：iPhone／iPad 的 Safari 還沒加到主畫面時，跳出一次圖解說明（可選不要再提醒）。
 * Android／電腦的 Chrome 會發出 beforeinstallprompt，先攔下來，讓設定與首次使用畫面的「安裝到主畫面」按鈕使用。 */
var A2HS = {
  evt: null,
  key: 'tn:web:a2hs',
  standalone: function () {
    return !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  },
  ios: function () {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },
  // iOS 上只有 Safari 有「加入主畫面」的完整流程；Chrome、Firefox 等 iOS 版本不提示
  iosSafari: function () { return this.ios() && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(navigator.userAgent || ''); },
  can: function () { return !!this.evt && !this.standalone(); },
  pref: function () { try { return JSON.parse(localStorage.getItem(this.key) || '{}'); } catch (e) { return {}; } },
  setPref: function (v) { try { localStorage.setItem(this.key, JSON.stringify(v)); } catch (e) {} },
  install: function () {
    var e = A2HS.evt;
    if (!e) { A2HS.guide(); return Promise.resolve(false); }
    e.prompt();
    return (e.userChoice || Promise.resolve({})).then(function (r) {
      A2HS.evt = null;
      if (r && r.outcome === 'accepted') UI.toast('已安裝到主畫面');
      A2HS.refresh();
      return r && r.outcome === 'accepted';
    });
  },
  icons: {
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>',
    add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>'
  },
  // 圖解說明：iPhone 的分享鈕在下方工具列，iPad 在右上角
  guide: function (opts) {
    opts = opts || {};
    var ipad = /iPad/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var ic = A2HS.icons;
    var body = '<p class="dim" style="margin-top:0">加到主畫面後，老師隨手記會像 App 一樣有自己的圖示，開啟時是全螢幕，不會有網址列。</p>' +
      '<ol class="a2hs-steps">' +
      '<li><span>按 Safari ' + (ipad ? '右上角' : '下方工具列') + '的<b>「分享」</b>按鈕</span><span class="ic">' + ic.share + '</span></li>' +
      '<li><span>往下滑，選<b>「加入主畫面」</b></span><span class="ic">' + ic.add + '</span></li>' +
      '<li><span>按右上角的<b>「新增」</b>，主畫面就會出現「隨手記」圖示</span><span class="ic">' + ic.ok + '</span></li>' +
      '</ol>' +
      (ipad ? '' : '<div class="a2hs-hint">分享按鈕在畫面下方 <span class="arrow">↓</span></div>');
    var acts = opts.auto
      ? [{ label: '不要再提醒', onClick: function () { var p = A2HS.pref(); p.never = true; A2HS.setPref(p); UI.toast('之後不會再提醒，需要時可到「設定」查看'); } },
         { label: '知道了', cls: 'primary' }]
      : [{ label: icon('back') + '回上頁', cls: 'back' }];
    UI.sheet({ title: '加到主畫面', body: body, actions: acts });
  },
  // 啟動後自動提示一次（iOS Safari、還沒加到主畫面、沒有選過「不要再提醒」）；每台裝置只自動跳一次
  autoPrompt: function () {
    if (!A2HS.iosSafari() || A2HS.standalone()) return;
    var p = A2HS.pref();
    if (p.never || p.shown) return;
    var tries = 0;
    (function wait() {
      // 等 PIN、首次設定等其他視窗關掉再跳
      if ((window.Pin && Pin.locked) || (UI._open && UI._open.length) || document.querySelector('.overlay')) {
        if (++tries < 20) setTimeout(wait, 3000);
        return;
      }
      var q = A2HS.pref(); q.shown = Date.now(); A2HS.setPref(q);
      A2HS.guide({ auto: true });
    })();
  },
  // 設定頁的一段
  settingsHtml: function () {
    if (A2HS.standalone()) return '';
    var row;
    if (A2HS.can()) row = '<button class="btn small primary" data-act="a2hsInstall">' + icon('plus') + '安裝到主畫面</button>';
    else if (A2HS.ios()) row = '<button class="btn small" data-act="a2hsGuide">' + icon('plus') + '怎麼加到主畫面</button>';
    else return '';
    return '<div class="section-label">加到主畫面</div><div class="card"><p class="dim" style="margin-top:0">加到主畫面後，像 App 一樣從圖示直接開啟、全螢幕使用。</p><div class="row wrap">' + row + '</div></div>';
  },
  refresh: function () {
    var w = document.querySelector('.welcome .a2hs-slot');
    if (w) w.innerHTML = A2HS.can() ? '<button class="btn primary a2hs-btn" data-act="a2hsInstall">' + icon('plus') + '安裝到主畫面</button>' : '';
    if (window.App && App.booted && App.top && App.top() && App.top().view === 'settings') App.renderSoon();
  }
};
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  A2HS.evt = e;
  A2HS.refresh();
});
window.addEventListener('appinstalled', function () { A2HS.evt = null; A2HS.refresh(); });
Act.a2hsInstall = function () { A2HS.install(); };
Act.a2hsGuide = function () { A2HS.guide(); };

/* ---------- 首次使用 ---------- */
WEB.welcome = function () {
  var root = document.getElementById('app');
  var g = Drive.configured();
  root.innerHTML = '<div class="welcome"><span class="seal-logo" style="width:64px;height:64px;font-size:40px;border-radius:12px">記</span>' +
    '<h1 class="serif">老師隨手記</h1><p class="dim">選擇資料要存在哪裡。之後可以在「設定」更改。</p>' +
    '<div class="welcome-list">' +
    (g ? '<button class="welcome-opt primary" data-w="google"><b>用 Google 帳號同步</b><span>資料存在你的雲端硬碟，手機、平板、電腦都能用同一份資料。第一次需要按「允許」。</span><em>建議</em></button>' : '') +
    '<button class="welcome-opt" data-w="local"><b>只存在這台裝置</b><span>不用登入；資料只在這個瀏覽器裡，可隨時下載成 Excel。</span></button>' +
    (window.showOpenFilePicker ? '<button class="welcome-opt" data-w="file"><b>存到電腦上的 Excel 檔</b><span>選一個 Excel 檔（新的或之前存的），之後自動存回這個檔。</span></button>' : '') +
    '<button class="welcome-opt" data-w="import"><b>從 Excel 檔開始</b><span>匯入之前下載的資料檔，或 GAS 版資料試算表下載成的 Excel。</span></button>' +
    '</div>' + (g ? '' : '<p class="dim" style="font-size:12px">這個網站尚未設定 Google 用戶端 ID，暫時無法使用雲端硬碟同步。</p>') +
    '<div class="a2hs-slot">' + (A2HS.can() ? '<button class="btn primary a2hs-btn" data-act="a2hsInstall">' + icon('plus') + '安裝到主畫面</button>' : '') + '</div>' +
    '<p class="dim" style="font-size:12px"><a href="about/">關於老師隨手記</a>・<a href="privacy/">隱私權政策</a></p></div>';
  return new Promise(function (resolve) {
    root.querySelector('.welcome-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-w]');
      if (!b) return;
      var w = b.dataset.w;
      var go = function (mode) { if (!WEB.meta.mode) WEB.meta.mode = mode; WEB.saveNow().then(resolve); };
      if (w === 'local') return go('local');
      if (w === 'google') {
        Cloud.connectGoogle({ useCloud: true }).then(function (how) { if (how) go('google'); }).catch(function (e) { UI.error(e); });
        return;
      }
      if (w === 'file') {
        UI.menu([
          { icon: 'plus', label: '建立新的 Excel 檔', onClick: function () { Cloud.linkFile(false).then(function (how) { if (how) go('file'); }).catch(UI.error); } },
          { icon: 'export', label: '開啟既有的 Excel 檔', onClick: function () { Cloud.linkFile(true).then(function (how) { if (how) go('file'); }).catch(UI.error); } }
        ], '存到電腦上的 Excel 檔');
        return;
      }
      if (w === 'import') {
        webPickFile('.xlsx').then(function (f) {
          if (!f) return;
          try {
            var sheets = Xlsx.read(f.bytes);
            if (!sheets.some(function (s) { return s.name === '班級'; })) throw new Error('找不到「班級」工作表，這不是老師隨手記的資料檔');
            WEB.setState(WebRuntime.sheetsToState(sheets), false);
            WEB.rt.touch();
            UI.toast('已匯入「' + f.name + '」');
            go('local');
          } catch (err) { UI.error(err); }
        });
      }
    });
  });
};

/* ---------- 啟動 ---------- */
WEB.start = function () {
  applyTheme();
  var params = new URLSearchParams(location.search);
  var reset = params.has('reset');
  var prep = reset
    ? new Promise(function (resolve) {
        try { localStorage.clear(); } catch (e) {}
        indexedDB.deleteDatabase('teacher-notes');
        var r = indexedDB.deleteDatabase('teacher-notes-web');
        r.onsuccess = r.onerror = r.onblocked = function () { resolve(); };
      })
    : Promise.resolve();
  prep.then(function () {
    return Promise.all([WebStore.get('rt'), WebStore.get('meta'), WebStore.get('fileHandle')]);
  }).then(function (res) {
    WEB.rt = WEB.newRuntime(res[0]);
    WEB.meta = res[1] || { mode: null };
    Providers.file.handle = res[2] || null;
    if (params.get('mode') === 'local' && !WEB.meta.mode) WEB.meta.mode = 'local';
    if (WEB.meta.mode === 'google' && !WEB.meta.fileId) WEB.meta.mode = 'local';
    if (WEB.meta.mode === 'file' && !Providers.file.handle) WEB.meta.mode = 'local';
    Cloud.set(Cloud.provider() ? 'idle' : 'local');
    if (WEB.meta.mode) return;
    return WEB.welcome();
  }).then(function () {
    boot();
    Cloud.sync();
    setTimeout(A2HS.autoPrompt, 2500);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') Cloud.schedule(0);
      else WEB.saveNow();
    });
    window.addEventListener('online', function () { Cloud.schedule(0); });
    window.addEventListener('pagehide', function () { WEB.saveNow(); });
    // 開著的時候每分鐘看一次其他裝置有沒有更新
    setInterval(function () { if (document.visibilityState === 'visible') Cloud.schedule(0); }, 60000);
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !params.has('nosw')) {
    // 發布新版後，第一次開啟仍是快取的舊版；新版在背景下載好、接手時提醒重新開啟
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && window.UI && UI.toast) UI.toast('已下載新版，重新開啟 App 就會更新');
    });
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
};
