<script>window.GAS_SOURCE = "// ---- Archive.gs\n/**\n * 歸檔與封存：\n * - 裝置上把事項設為歸檔後，該事項與紀錄不再同步到裝置。\n * - 歸檔滿 ARCHIVE_MOVE_AFTER_DAYS 天，其紀錄搬入「封存」sheet，維持主表精簡。\n * - 已歸檔事項可查詢、檢視、還原，或在確認後刪除。\n */\n\nfunction readArchiveSheet_() {\n  var sh = getSS_().getSheetByName(ARCHIVE_SHEET);\n  var n = sh.getLastRow() - 1;\n  var rows = n > 0 ? sh.getRange(2, 1, n, ARCHIVE_COLS.length).getValues() : [];\n  return {\n    sh: sh,\n    rows: rows.filter(function (r) {\n      return r[0] !== '';\n    })\n  };\n}\n\nfunction writeArchiveSheet_(ar, rows) {\n  // 單次寫入（不先清空），中途失敗也不會清掉整張封存表\n  var old = Math.max(ar.sh.getLastRow() - 1, 0);\n  var n = Math.max(old, rows.length);\n  if (!n) return;\n  var values = rows.slice();\n  while (values.length < n) values.push(['', '', '', '', '']);\n  ar.sh.getRange(2, 1, n, ARCHIVE_COLS.length).setNumberFormat('@').setValues(values);\n}\n\n/** 把歸檔夠久的事項紀錄搬入封存 sheet。 */\nfunction moveArchivedChildren_(now) {\n  var cutoff = now - ARCHIVE_MOVE_AFTER_DAYS * 86400000;\n  var itemsTb = openTable_('items');\n  var targets = {};\n  var movedItems = [];\n  readRows_(itemsTb).forEach(function (i) {\n    if (i.archived && !i.moved && !i.deleted && (i.archivedAt || 0) < cutoff) {\n      targets[i.id] = true;\n      i.moved = true;\n      i._raw = objToRow_(itemsTb, i, i._raw);\n      movedItems.push(i);\n    }\n  });\n  if (!movedItems.length) return 0;\n  // 順序：先寫入封存 → 再從主表移除 → 最後標記已搬移。任何一步中斷都只會重複、不會遺失；\n  // 已在封存中的紀錄不會重複寫入。\n  var ar = readArchiveSheet_();\n  var inArchive = {};\n  ar.rows.forEach(function (row) {\n    inArchive[row[0] + '|' + row[1]] = true;\n  });\n  var add = [];\n  var stamp = String(now);\n  var plans = [];\n  CHILD_TABLES.forEach(function (t) {\n    var tb = openTable_(t);\n    var rows = readRows_(tb);\n    var keep = [];\n    rows.forEach(function (r) {\n      if (targets[r.itemId]) {\n        if (!r.deleted && !inArchive[t + '|' + r.id]) add.push([t, r.id, r.itemId, JSON.stringify(publicObj_(tb, r)), stamp]);\n      } else {\n        keep.push(r);\n      }\n    });\n    if (keep.length !== rows.length) plans.push([tb, keep]);\n  });\n  if (add.length) {\n    var start = ar.sh.getLastRow() + 1;\n    var need = start + add.length - 1 - ar.sh.getMaxRows();\n    if (need > 0) ar.sh.insertRowsAfter(ar.sh.getMaxRows(), need);\n    ar.sh.getRange(start, 1, add.length, ARCHIVE_COLS.length).setNumberFormat('@').setValues(add);\n  }\n  plans.forEach(function (pl) {\n    rewriteTable_(pl[0], pl[1]);\n  });\n  writeRows_(itemsTb, movedItems, []);\n  return movedItems.length;\n}\n\nfunction findItem_(itemsTb, id) {\n  var rows = readRows_(itemsTb);\n  for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];\n  return null;\n}\n\n/** 讀取某些事項的全部紀錄（主表＋封存）。 */\nfunction childrenOf_(itemIds, filter) {\n  var ids = {};\n  itemIds.forEach(function (id) {\n    ids[id] = true;\n  });\n  var out = { checks: [], events: [], scores: [] };\n  CHILD_TABLES.forEach(function (t) {\n    var tb = openTable_(t);\n    readRows_(tb).forEach(function (r) {\n      if (ids[r.itemId] && !r.deleted && (!filter || filter(t, r))) out[t].push(publicObj_(tb, r));\n    });\n  });\n  var seen = {};\n  CHILD_TABLES.forEach(function (t) {\n    out[t].forEach(function (r) {\n      seen[t + '|' + r.id] = true;\n    });\n  });\n  readArchiveSheet_().rows.forEach(function (row) {\n    if (!ids[row[2]] || !out[row[0]] || seen[row[0] + '|' + row[1]]) return;\n    seen[row[0] + '|' + row[1]] = true;\n    try {\n      var r = JSON.parse(row[3]);\n      if (!filter || filter(row[0], r)) out[row[0]].push(r);\n    } catch (e) {}\n  });\n  return out;\n}\n\nfunction apiArchivedList_(p) {\n  getSS_();\n  var tb = openTable_('items');\n  var q = String(p.q || '').trim().toLowerCase();\n  var list = readRows_(tb)\n    .filter(function (i) {\n      if (!i.archived || i.deleted) return false;\n      if (p.type && i.type !== p.type) return false;\n      if (p.classId && i.classId !== p.classId) return false;\n      if (q && String(i.title).toLowerCase().indexOf(q) < 0) return false;\n      return true;\n    })\n    .map(function (i) {\n      return publicObj_(tb, i);\n    });\n  list.sort(function (a, b) {\n    return (b.archivedAt || 0) - (a.archivedAt || 0);\n  });\n  return list;\n}\n\nfunction apiArchivedDetail_(p) {\n  getSS_();\n  var tb = openTable_('items');\n  var item = findItem_(tb, p.id);\n  if (!item || item.deleted) throw new Error('找不到這個事項');\n  var ch = childrenOf_([item.id]);\n  return { item: publicObj_(tb, item), checks: ch.checks, events: ch.events, scores: ch.scores };\n}\n\nfunction apiRestoreItem_(p) {\n  return withLock_(function () {\n    getSS_();\n    var now = Date.now();\n    var itemsTb = openTable_('items');\n    var item = findItem_(itemsTb, p.id);\n    if (!item || item.deleted) throw new Error('找不到這個事項');\n    if (item.moved) {\n      var ar = readArchiveSheet_();\n      var keep = [];\n      var back = { checks: [], events: [], scores: [] };\n      ar.rows.forEach(function (row) {\n        if (row[2] === item.id && back[row[0]]) {\n          try {\n            back[row[0]].push(JSON.parse(row[3]));\n          } catch (e) {}\n        } else {\n          keep.push(row);\n        }\n      });\n      CHILD_TABLES.forEach(function (t) {\n        if (!back[t].length) return;\n        var tb = openTable_(t);\n        var exists = {};\n        readRows_(tb).forEach(function (r) {\n          exists[r.id] = true;\n        });\n        back[t] = back[t].filter(function (r) {\n          if (exists[r.id]) return false;\n          exists[r.id] = true;\n          return true;\n        });\n        var appends = back[t].map(function (r) {\n          r._rev = now;\n          r._raw = objToRow_(tb, r);\n          return r;\n        });\n        writeRows_(tb, [], appends);\n      });\n      writeArchiveSheet_(ar, keep);\n    } else {\n      CHILD_TABLES.forEach(function (t) {\n        var tb = openTable_(t);\n        var ups = readRows_(tb).filter(function (r) {\n          return r.itemId === item.id;\n        });\n        ups.forEach(function (r) {\n          r._rev = now;\n          r._raw = objToRow_(tb, r, r._raw);\n        });\n        writeRows_(tb, ups, []);\n      });\n    }\n    item.archived = false;\n    item.archivedAt = null;\n    item.moved = false;\n    item.updatedAt = now;\n    item._rev = now;\n    item._raw = objToRow_(itemsTb, item, item._raw);\n    writeRows_(itemsTb, [item], []);\n    return { ok: true };\n  });\n}\n\nfunction apiDeleteArchived_(p) {\n  return withLock_(function () {\n    getSS_();\n    var now = Date.now();\n    var itemsTb = openTable_('items');\n    var item = findItem_(itemsTb, p.id);\n    if (!item || item.deleted) return { ok: true };\n    if (!item.archived) throw new Error('只能刪除已歸檔的事項');\n    CHILD_TABLES.forEach(function (t) {\n      var tb = openTable_(t);\n      var rows = readRows_(tb);\n      var keep = rows.filter(function (r) {\n        return r.itemId !== item.id;\n      });\n      if (keep.length !== rows.length) rewriteTable_(tb, keep);\n    });\n    var ar = readArchiveSheet_();\n    var keepAr = ar.rows.filter(function (row) {\n      return row[2] !== item.id;\n    });\n    if (keepAr.length !== ar.rows.length) writeArchiveSheet_(ar, keepAr);\n    item.deleted = true;\n    item.updatedAt = now;\n    item._rev = now;\n    item._raw = objToRow_(itemsTb, item, item._raw);\n    writeRows_(itemsTb, [item], []);\n    return { ok: true };\n  });\n}\n\n/**\n * 匯出用：取得某班（或某位學生）在日期範圍內的所有事項與紀錄，含已歸檔與封存。\n * 勾選與成績以事項日期篩選。\n */\nfunction apiFetchRange_(p) {\n  getSS_();\n  var from = p.from || '0000-00-00';\n  var to = p.to || '9999-99-99';\n  var tb = openTable_('items');\n  var items = readRows_(tb).filter(function (i) {\n    if (i.deleted || i.classId !== p.classId) return false;\n    return i.date >= from && i.date <= to;\n  });\n  var ch = childrenOf_(\n    items.map(function (i) {\n      return i.id;\n    }),\n    function (t, r) {\n      if (p.studentId && r.studentId !== p.studentId) return false;\n      return true;\n    }\n  );\n  return {\n    items: items.map(function (i) {\n      return publicObj_(tb, i);\n    }),\n    checks: ch.checks,\n    events: ch.events,\n    scores: ch.scores\n  };\n}\n\n// ---- Calendar.gs\n/**\n * 行事曆單向同步：本 App 寫入專用的「老師隨手記」Google 日曆，日曆端的修改不回寫。\n */\n\nfunction teacherCalendar_(create) {\n  var id = props_().getProperty('CAL_ID');\n  var cal = null;\n  if (id) {\n    try {\n      cal = CalendarApp.getCalendarById(id);\n      if (cal && !cal.isOwnedByMe()) cal = null;\n    } catch (e) {\n      cal = null;\n    }\n  }\n  if (!cal) {\n    // 只用自己建立的日曆，略過別人分享過來的同名日曆\n    var list = (CalendarApp.getCalendarsByName(CALENDAR_NAME) || []).filter(function (c) {\n      return c.isOwnedByMe();\n    });\n    cal = list.length ? list[0] : null;\n    if (!cal && create) cal = CalendarApp.createCalendar(CALENDAR_NAME, { color: CalendarApp.Color.RED });\n    if (cal) props_().setProperty('CAL_ID', cal.getId());\n  }\n  return cal;\n}\n\nfunction classNameMap_() {\n  var map = {};\n  readRows_(openTable_('classes')).forEach(function (c) {\n    map[c.id] = c.name;\n  });\n  return map;\n}\n\nfunction parseLocalDate_(date, time) {\n  var d = String(date).split('-');\n  var y = Number(d[0]);\n  var m = Number(d[1]) - 1;\n  var day = Number(d[2]);\n  if (!time) return new Date(y, m, day);\n  var t = String(time).split(':');\n  return new Date(y, m, day, Number(t[0]), Number(t[1] || 0));\n}\n\n/** 把行事曆列同步到 Google 日曆，並把日曆事件 ID 寫回 sheet。 */\nfunction syncCalendarRows_(tb, rows) {\n  var cal = teacherCalendar_(true);\n  if (!cal) throw new Error('無法建立 Google 日曆');\n  var names = classNameMap_();\n  var col = tb.idx.gcalId + 1;\n  rows.forEach(function (r) {\n    var ev = null;\n    if (r.gcalId) {\n      try {\n        ev = cal.getEventById(r.gcalId);\n      } catch (e) {\n        ev = null;\n      }\n    }\n    var gid = r.gcalId || '';\n    if (r.deleted || !r.date) {\n      if (ev) ev.deleteEvent();\n      gid = '';\n    } else {\n      var title = (r.classId && names[r.classId] ? '［' + names[r.classId] + '］' : '') + r.text;\n      var start = parseLocalDate_(r.date, r.time);\n      if (!ev) {\n        ev = r.time\n          ? cal.createEvent(title, start, new Date(start.getTime() + CALENDAR_EVENT_MINUTES * 60000))\n          : cal.createAllDayEvent(title, start);\n      } else {\n        ev.setTitle(title);\n        if (r.time) ev.setTime(start, new Date(start.getTime() + CALENDAR_EVENT_MINUTES * 60000));\n        else ev.setAllDayDate(start);\n      }\n      gid = ev.getId();\n    }\n    if (gid !== (r.gcalId || '') && r._row) {\n      tb.sh.getRange(r._row, col).setNumberFormat('@').setValue(gid);\n      r.gcalId = gid;\n    }\n  });\n}\n\n/** 開啟同步時，把今天（含）以後的行程全部寫入日曆。 */\nfunction apiCalendarSyncAll_() {\n  return withLock_(function () {\n    getSS_();\n    var tb = openTable_('cal');\n    var today = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');\n    var rows = readRows_(tb).filter(function (r) {\n      return !r.deleted && r.date >= today;\n    });\n    syncCalendarRows_(tb, rows);\n    var cal = teacherCalendar_(false);\n    return { count: rows.length, calendarId: cal ? cal.getId() : null };\n  });\n}\n\n// ---- Code.gs\n/**\n * 網頁 App 入口與 API 分派。\n * 前端只透過 api(action, payload) 呼叫後端，回傳 JSON 字串；\n * 日後要改成獨立前台時，只需替換前端的 Backend 轉接層。\n */\n\nfunction doGet() {\n  var t = HtmlService.createTemplateFromFile('index');\n  t.boot = JSON.stringify({ version: APP_VERSION, email: Session.getActiveUser().getEmail() });\n  var out = t\n    .evaluate()\n    .setTitle(APP_NAME)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');\n  if (FAVICON_URL) out.setFaviconUrl(FAVICON_URL);\n  return out;\n}\n\nfunction include(name) {\n  return HtmlService.createHtmlOutputFromFile(name).getContent();\n}\n\nfunction apiTable_() {\n  return {\n    pull: apiPull_,\n    push: apiPush_,\n    archivedList: apiArchivedList_,\n    archivedDetail: apiArchivedDetail_,\n    restoreItem: apiRestoreItem_,\n    deleteArchived: apiDeleteArchived_,\n    fetchRange: apiFetchRange_,\n    createSheet: apiCreateSheet_,\n    htmlToPdf: apiHtmlToPdf_,\n    uploadPhoto: apiUploadPhoto_,\n    photo: apiPhoto_,\n    importRoster: apiImportRoster_,\n    resetPin: apiResetPin_,\n    checkVersion: apiCheckVersion_,\n    calendarSyncAll: apiCalendarSyncAll_,\n    backupNow: apiBackupNow_,\n    resetDataFile: apiResetDataFile_\n  };\n}\n\nfunction api(action, payload) {\n  // 每次呼叫都重新判斷試算表狀態（GAS 每次執行本來就會重置全域變數）\n  _ss = null;\n  _fresh = false;\n  try {\n    var fn = apiTable_()[action];\n    if (!fn) throw new Error('未知的操作：' + action);\n    return JSON.stringify({ ok: true, data: fn(payload || {}) });\n  } catch (err) {\n    console.error(action + ' 失敗：' + (err && err.stack ? err.stack : err));\n    return JSON.stringify({ ok: false, error: String((err && err.message) || err) });\n  }\n}\n\n// ---- Config.gs\n/**\n * 老師隨手記：全域設定。\n * 改版時請同步更新 APP_VERSION 與根目錄的 version.json。\n */\nvar APP_NAME = '老師隨手記';\nvar APP_VERSION = '1.3.0';\n\n// 方式 A（自行部署）用的版本檢查網址：指向一個公開的 version.json（格式見 repo 根目錄）。\n// 留空則不檢查。\nvar VERSION_CHECK_URL = '';\n\n// 網頁分頁圖示（需為公開的 https PNG 網址），留空則使用預設。\nvar FAVICON_URL = '';\n\nvar DATA_FILE_NAME = '老師隨手記資料';\nvar BACKUP_FOLDER_NAME = '老師隨手記備份';\nvar PHOTO_FOLDER_NAME = '老師隨手記相片';\n// 單張相片上限（前端會先縮圖，通常只有幾百 KB）。\nvar PHOTO_MAX_BYTES = 5 * 1024 * 1024;\n// 沒有任何登記紀錄使用的相片，上傳幾天後丟進垃圾桶（垃圾桶內 30 天內仍可救回）。\nvar PHOTO_ORPHAN_DAYS = 7;\nvar BACKUP_KEEP = 4;\nvar BACKUP_EVERY_DAYS = 7;\nvar CALENDAR_NAME = '老師隨手記';\nvar CALENDAR_EVENT_MINUTES = 60;\n\n// 已歸檔事項的紀錄在歸檔幾天後搬入「封存」sheet。\nvar ARCHIVE_MOVE_AFTER_DAYS = 7;\n// 已完成待辦保留天數。\nvar DONE_TODO_KEEP_DAYS = 30;\n// 已刪除資料（同步用的刪除標記）保留天數；超過後裝置需整份重新同步。\nvar TOMBSTONE_KEEP_DAYS = 60;\n\n// 快速登記清單的預設項目（老師沒改過清單時使用；與前端 js_log.html 的 DEFAULT_QUICK 相同）。\nvar DEFAULT_QUICK_LIST = ['掃地沒掃', '缺交作業', '上課吵鬧', '講髒話', '上課睡覺', '遲到', '忘記帶學用品', '服儀不整'];\n\n// ---- Db.gs\n/**\n * 試算表存取層：找到（或建立）老師的資料試算表、維護欄位結構、讀寫資料列。\n *\n * 方式 C：網頁 App 以存取者身分執行，資料試算表建立在老師自己的雲端硬碟，\n *         試算表 ID 存在 UserProperties。\n * 方式 A：腳本綁定在老師複製的試算表上，直接使用該試算表。\n */\nvar _ss = null;\nvar _fresh = false;\n\nfunction props_() {\n  return PropertiesService.getUserProperties();\n}\n\nfunction boundSpreadsheet_() {\n  try {\n    return SpreadsheetApp.getActiveSpreadsheet();\n  } catch (e) {\n    return null;\n  }\n}\n\nfunction appMode_() {\n  return boundSpreadsheet_() ? 'A' : 'C';\n}\n\nfunction getSS_() {\n  if (_ss) return _ss;\n  var bound = boundSpreadsheet_();\n  if (bound) {\n    _ss = bound;\n    if (!_ss.getSheetByName(TABLES.classes.sheet)) _fresh = true;\n  } else {\n    var id = props_().getProperty('SS_ID');\n    if (id) {\n      try {\n        _ss = SpreadsheetApp.openById(id);\n      } catch (e) {\n        // 只有確認檔案已丟進垃圾桶才換新檔；其他錯誤（服務暫時失敗、配額等）直接回報，避免悄悄換成空白試算表\n        if (!isTrashed_(id)) throw new Error(SS_OPEN_ERROR + '（' + String((e && e.message) || e) + '）');\n      }\n      if (_ss && isTrashed_(id)) _ss = null;\n    }\n    if (!_ss) {\n      _ss = SpreadsheetApp.create(DATA_FILE_NAME);\n      props_().setProperty('SS_ID', _ss.getId());\n      props_().deleteProperty('SCHEMA_VER');\n      props_().deleteProperty('PURGE_HORIZON');\n      _fresh = true;\n    }\n  }\n  if (_fresh || props_().getProperty('SCHEMA_VER') !== APP_VERSION + ':' + _ss.getId()) {\n    ensureSchema_(_ss);\n    props_().setProperty('SCHEMA_VER', APP_VERSION + ':' + _ss.getId());\n  }\n  return _ss;\n}\n\nvar SS_OPEN_ERROR = '暫時無法開啟你的資料試算表，請稍後再試。若檔案已被永久刪除，可在「同步狀態」選擇改用新的資料試算表';\n\n/** 老師確認原檔已永久刪除後，改用新的資料試算表（下次同步時建立，裝置上的資料會重新上傳）。 */\nfunction apiResetDataFile_() {\n  if (boundSpreadsheet_()) throw new Error('自行部署的版本請直接使用綁定的試算表');\n  props_().deleteProperty('SS_ID');\n  return { ok: true };\n}\n\nfunction isTrashed_(id) {\n  try {\n    return DriveApp.getFileById(id).isTrashed();\n  } catch (e) {\n    return false;\n  }\n}\n\n/** 建立缺少的 sheet 與欄位；既有欄位不動，新欄位加在最後。 */\nfunction ensureSchema_(ss) {\n  Object.keys(TABLES).forEach(function (t) {\n    var labels = tableCols_(t).map(function (c) {\n      return c.label;\n    });\n    ensureSheet_(ss, TABLES[t].sheet, labels);\n  });\n  ensureSheet_(ss, ARCHIVE_SHEET, ARCHIVE_COLS);\n  ['Sheet1', '工作表1', '工作表 1'].forEach(function (n) {\n    var sh = ss.getSheetByName(n);\n    if (sh && ss.getSheets().length > 1 && sh.getLastRow() === 0) ss.deleteSheet(sh);\n  });\n}\n\nfunction ensureSheet_(ss, name, labels) {\n  var sh = ss.getSheetByName(name);\n  if (!sh) sh = ss.insertSheet(name);\n  var lastCol = sh.getLastColumn();\n  var header = lastCol ? sh.getRange(1, 1, 1, lastCol).getValues()[0] : [];\n  var missing = labels.filter(function (l) {\n    return header.indexOf(l) < 0;\n  });\n  if (missing.length) {\n    sh.getRange(1, header.length + 1, 1, missing.length)\n      .setNumberFormat('@')\n      .setValues([missing])\n      .setFontWeight('bold')\n      .setBackground('#efe4c8');\n    sh.setFrozenRows(1);\n  }\n  return sh;\n}\n\n/** 開啟資料表：回傳 sheet 與「欄位鍵 → 欄位索引」對照。 */\nfunction openTable_(t) {\n  var sh = getSS_().getSheetByName(TABLES[t].sheet);\n  var width = sh.getLastColumn();\n  var header = sh.getRange(1, 1, 1, width).getValues()[0];\n  var cols = tableCols_(t);\n  var idx = {};\n  cols.forEach(function (c) {\n    idx[c.key] = header.indexOf(c.label);\n  });\n  return { t: t, sh: sh, cols: cols, idx: idx, width: width };\n}\n\nfunction readRows_(tb) {\n  var n = tb.sh.getLastRow() - 1;\n  if (n <= 0) return [];\n  var vals = tb.sh.getRange(2, 1, n, tb.width).getValues();\n  var out = [];\n  for (var i = 0; i < vals.length; i++) {\n    if (vals[i][tb.idx.id] === '' || vals[i][tb.idx.id] == null) continue;\n    var o = rowToObj_(tb, vals[i]);\n    o._row = i + 2;\n    o._raw = vals[i];\n    out.push(o);\n  }\n  return out;\n}\n\nfunction rowToObj_(tb, row) {\n  var o = {};\n  tb.cols.forEach(function (c) {\n    var i = tb.idx[c.key];\n    o[c.key] = parseCell_(c.type, i >= 0 ? row[i] : '');\n  });\n  return o;\n}\n\nfunction objToRow_(tb, o, base) {\n  var row = base ? base.slice() : [];\n  for (var i = row.length; i < tb.width; i++) row.push('');\n  tb.cols.forEach(function (c) {\n    var i = tb.idx[c.key];\n    if (i >= 0) row[i] = fmtCell_(c.type, o[c.key]);\n  });\n  return row;\n}\n\nfunction parseCell_(type, v) {\n  if (v instanceof Date) v = Utilities.formatDate(v, Session.getScriptTimeZone(), 'yyyy-MM-dd');\n  if (type === 'num') return v === '' || v == null ? null : Number(v);\n  if (type === 'bool') return v === true || v === 1 || v === '1' || v === 'TRUE' || v === 'true';\n  if (type === 'json') {\n    if (v === '' || v == null) return null;\n    try {\n      return JSON.parse(v);\n    } catch (e) {\n      return null;\n    }\n  }\n  return v == null ? '' : String(v);\n}\n\nfunction fmtCell_(type, v) {\n  if (v === undefined || v === null || v === '') return '';\n  if (type === 'bool') return v ? '1' : '';\n  if (type === 'json') return JSON.stringify(v);\n  return String(v);\n}\n\n/** 只回傳給裝置看的欄位（去除內部欄位與 serverOnly 欄位）。 */\nfunction publicObj_(tb, o) {\n  var out = {};\n  tb.cols.forEach(function (c) {\n    if (!c.serverOnly) out[c.key] = o[c.key];\n  });\n  return out;\n}\n\n/**\n * 寫回資料：updates 為已讀出的列物件（帶 _row、_raw），appends 為新列物件（帶 _raw）。\n * 相鄰的更新會合併成一次寫入。\n */\nfunction writeRows_(tb, updates, appends) {\n  if (updates.length) {\n    updates.sort(function (a, b) {\n      return a._row - b._row;\n    });\n    var cluster = [];\n    var flush = function () {\n      if (!cluster.length) return;\n      var first = cluster[0]._row;\n      var last = cluster[cluster.length - 1]._row;\n      var block;\n      if (cluster.length === last - first + 1) {\n        block = cluster.map(function (o) {\n          return o._raw;\n        });\n      } else {\n        block = tb.sh.getRange(first, 1, last - first + 1, tb.width).getValues();\n        cluster.forEach(function (o) {\n          block[o._row - first] = o._raw;\n        });\n      }\n      tb.sh.getRange(first, 1, block.length, tb.width).setNumberFormat('@').setValues(block);\n      cluster = [];\n    };\n    updates.forEach(function (o) {\n      if (cluster.length && o._row - cluster[cluster.length - 1]._row > 20) flush();\n      cluster.push(o);\n    });\n    flush();\n  }\n  if (appends.length) {\n    var start = tb.sh.getLastRow() + 1;\n    var need = start + appends.length - 1 - tb.sh.getMaxRows();\n    if (need > 0) tb.sh.insertRowsAfter(tb.sh.getMaxRows(), need);\n    tb.sh\n      .getRange(start, 1, appends.length, tb.width)\n      .setNumberFormat('@')\n      .setValues(\n        appends.map(function (o) {\n          return o._raw;\n        })\n      );\n    appends.forEach(function (o, i) {\n      o._row = start + i;\n    });\n  }\n}\n\n/** 以新的資料列整個取代資料表內容（用於搬移與清除）。 */\nfunction rewriteTable_(tb, rows) {\n  // 一次寫入「新資料＋空白列補到原本長度」，避免先清空再寫入時中途失敗而清掉整張表\n  var old = Math.max(tb.sh.getLastRow() - 1, 0);\n  var n = Math.max(old, rows.length);\n  if (n) {\n    var blank = [];\n    for (var i = 0; i < tb.width; i++) blank.push('');\n    var values = rows.map(function (o) {\n      return o._raw;\n    });\n    while (values.length < n) values.push(blank.slice());\n    tb.sh.getRange(2, 1, n, tb.width).setNumberFormat('@').setValues(values);\n  }\n  var extra = tb.sh.getMaxRows() - Math.max(rows.length + 1, 2) - 50;\n  if (extra > 200) tb.sh.deleteRows(rows.length + 52, extra);\n}\n\nfunction withLock_(fn) {\n  var lock = LockService.getUserLock();\n  lock.waitLock(25000);\n  try {\n    return fn();\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction readSetting_(key) {\n  var tb = openTable_('settings');\n  var rows = readRows_(tb);\n  for (var i = 0; i < rows.length; i++) {\n    if (rows[i].id === key && !rows[i].deleted) return rows[i].value;\n  }\n  return null;\n}\n\nfunction writeSetting_(key, value) {\n  var tb = openTable_('settings');\n  var rows = readRows_(tb);\n  var now = Date.now();\n  var cur = null;\n  rows.forEach(function (r) {\n    if (r.id === key) cur = r;\n  });\n  var obj = { id: key, value: value, updatedAt: now, deleted: false, _rev: now };\n  if (cur) {\n    cur._raw = objToRow_(tb, obj, cur._raw);\n    writeRows_(tb, [cur], []);\n  } else {\n    obj._raw = objToRow_(tb, obj);\n    writeRows_(tb, [], [obj]);\n  }\n}\n\n// ---- Export.gs\n/**\n * 匯出與匯入：\n * - 整班明細：產生新的 Google 試算表（可下載 Excel）。\n * - 個人明細：前端組好古典風格 HTML，這裡轉成 PDF 存到雲端硬碟。\n * - 從其他試算表匯入學生名單。\n */\n\nfunction exportFolder_() {\n  return ownFolder_('EXPORT_FOLDER_ID', APP_NAME + '匯出');\n}\n\n/**\n * p.title：檔名；p.header：表頭；p.rows：資料列；\n * p.sheetName：工作表名稱（預設「整班明細」）；\n * p.chart：{ title, labels: [], values: [], seriesName }（選填，會另建「統計」工作表與長條圖）\n */\nfunction apiCreateSheet_(p) {\n  var ss = SpreadsheetApp.create(p.title || APP_NAME + '匯出');\n  var sh = ss.getSheets()[0];\n  sh.setName(p.sheetName || '整班明細');\n  var data = [p.header].concat(p.rows || []);\n  var width = p.header.length;\n  sh.getRange(1, 1, data.length, width).setNumberFormat('@').setValues(\n    data.map(function (r) {\n      var row = r.slice(0, width);\n      while (row.length < width) row.push('');\n      return row.map(function (v) {\n        return v == null ? '' : String(v);\n      });\n    })\n  );\n  sh.getRange(1, 1, 1, width).setFontWeight('bold').setBackground('#efe4c8');\n  sh.setFrozenRows(1);\n  sh.setFrozenColumns(Math.min(2, width));\n  sh.autoResizeColumns(1, width);\n  if (p.chart && p.chart.labels && p.chart.labels.length) {\n    var st = ss.insertSheet('統計');\n    var vals = [['項目', p.chart.seriesName || '數值']].concat(\n      p.chart.labels.map(function (l, i) {\n        return [String(l), Number(p.chart.values[i]) || 0];\n      })\n    );\n    st.getRange(1, 1, vals.length, 2).setValues(vals);\n    st.getRange(1, 1, 1, 2).setFontWeight('bold');\n    var chart = st\n      .newChart()\n      .setChartType(Charts.ChartType.COLUMN)\n      .addRange(st.getRange(1, 1, vals.length, 2))\n      .setPosition(1, 4, 0, 0)\n      .setOption('title', p.chart.title || '')\n      .setOption('legend', { position: 'none' })\n      .setOption('colors', ['#b8312f'])\n      .build();\n    st.insertChart(chart);\n  }\n  try {\n    DriveApp.getFileById(ss.getId()).moveTo(exportFolder_());\n  } catch (e) {}\n  return {\n    url: ss.getUrl(),\n    xlsxUrl: 'https://docs.google.com/spreadsheets/d/' + ss.getId() + '/export?format=xlsx',\n    name: ss.getName()\n  };\n}\n\nfunction apiHtmlToPdf_(p) {\n  var name = (p.name || '個人明細') + '.pdf';\n  var blob = HtmlService.createHtmlOutput(embedPhotos_(String(p.html || ''))).getBlob().getAs('application/pdf').setName(name);\n  var folder = exportFolder_();\n  // 同名的舊檔丟進垃圾桶，避免每按一次就多一份\n  var old = folder.getFilesByName(name);\n  while (old.hasNext()) old.next().setTrashed(true);\n  var file = folder.createFile(blob);\n  return {\n    name: name,\n    url: file.getUrl(),\n    downloadUrl: 'https://drive.google.com/uc?export=download&id=' + file.getId(),\n    base64: Utilities.base64Encode(blob.getBytes())\n  };\n}\n\n/** 從試算表網址匯入名單：找含「座號」「姓名」的表頭，否則取前兩欄。 */\nfunction apiImportRoster_(p) {\n  var ss = SpreadsheetApp.openByUrl(String(p.url).trim());\n  var values = ss.getSheets()[0].getDataRange().getValues();\n  var noCol = 0;\n  var nameCol = 1;\n  var start = 0;\n  for (var r = 0; r < Math.min(values.length, 10); r++) {\n    var row = values[r].map(String);\n    var a = row.indexOf('座號');\n    var b = row.indexOf('姓名');\n    if (a >= 0 && b >= 0) {\n      noCol = a;\n      nameCol = b;\n      start = r + 1;\n      break;\n    }\n  }\n  var out = [];\n  for (var i = start; i < values.length; i++) {\n    var no = Number(values[i][noCol]);\n    var name = String(values[i][nameCol] || '').trim();\n    if (no > 0 && name) out.push({ no: no, name: name });\n  }\n  return out;\n}\n\n/** 忘記 PIN：能呼叫到這裡就代表已用 Google 帳號登入，直接清除 PIN。 */\nfunction apiResetPin_() {\n  return withLock_(function () {\n    getSS_();\n    writeSetting_('pin', { enabled: false, asked: true });\n    return { ok: true, email: Session.getActiveUser().getEmail() };\n  });\n}\n\nfunction apiCheckVersion_() {\n  if (!VERSION_CHECK_URL) return { current: APP_VERSION, latest: null };\n  var cached = props_().getProperty('VERSION_CHECK');\n  if (cached) {\n    var c = JSON.parse(cached);\n    if (Date.now() - c.at < 6 * 3600000) return c.data;\n  }\n  var data = { current: APP_VERSION, latest: null };\n  try {\n    var res = UrlFetchApp.fetch(VERSION_CHECK_URL, { muteHttpExceptions: true });\n    if (res.getResponseCode() === 200) {\n      var j = JSON.parse(res.getContentText());\n      data = { current: APP_VERSION, latest: j.version, notes: j.notes || '', url: j.url || '' };\n    }\n  } catch (e) {}\n  props_().setProperty('VERSION_CHECK', JSON.stringify({ at: Date.now(), data: data }));\n  return data;\n}\n\n// ---- Maintenance.gs\n/**\n * 定期維護（每日觸發器，觸發器不存在時也會在拉取資料時補做）：\n * - 清除完成超過 30 天的待辦\n * - 歸檔事項的紀錄搬入封存\n * - 沒被任何登記紀錄使用的相片丟進垃圾桶\n * - 清除過期的刪除標記\n * - 每週備份整份試算表，保留 4 份\n */\n\nfunction ensureTriggers_() {\n  var ssId = getSS_().getId();\n  if (props_().getProperty('TRIGGER_VER') === APP_VERSION + ':' + ssId) return;\n  try {\n    var triggers = ScriptApp.getProjectTriggers();\n    var has = function (h, src) {\n      return triggers.some(function (t) {\n        return t.getHandlerFunction() === h && (!src || t.getTriggerSourceId() === src);\n      });\n    };\n    if (!has('dailyMaintenance')) ScriptApp.newTrigger('dailyMaintenance').timeBased().everyDays(1).atHour(3).create();\n    // 老師直接修改試算表時，讓該列重新同步到裝置\n    if (!has('onDataEdit', ssId)) ScriptApp.newTrigger('onDataEdit').forSpreadsheet(ssId).onEdit().create();\n    props_().setProperty('TRIGGER_VER', APP_VERSION + ':' + ssId);\n  } catch (e) {\n    console.warn('無法建立觸發器：' + e);\n  }\n}\n\n/** 由每日觸發器呼叫。 */\nfunction dailyMaintenance() {\n  withLock_(function () {\n    maintenance_(Date.now());\n  });\n  backupIfDue_(false);\n}\n\nfunction maintenanceIfDue_() {\n  var last = Number(props_().getProperty('LAST_MAINT') || 0);\n  if (Date.now() - last > 86400000) maintenance_(Date.now());\n}\n\nfunction maintenance_(now) {\n  getSS_();\n  // 1. 已完成超過 30 天的待辦 → 標記刪除\n  var todoTb = openTable_('todos');\n  var cutoff = now - DONE_TODO_KEEP_DAYS * 86400000;\n  var expired = readRows_(todoTb).filter(function (r) {\n    return r.done && !r.deleted && r.doneAt && r.doneAt < cutoff;\n  });\n  expired.forEach(function (r) {\n    r.deleted = true;\n    r.updatedAt = now;\n    r._rev = now;\n    r._raw = objToRow_(todoTb, r, r._raw);\n  });\n  writeRows_(todoTb, expired, []);\n\n  // 2. 歸檔事項紀錄搬入封存\n  moveArchivedChildren_(now);\n\n  // 3. 沒有登記紀錄使用的相片丟進垃圾桶\n  try {\n    cleanupPhotos_(now);\n  } catch (e) {\n    console.warn('清理相片失敗：' + e);\n  }\n\n  // 4. 清除過期刪除標記\n  var tombCut = now - TOMBSTONE_KEEP_DAYS * 86400000;\n  var purged = false;\n  Object.keys(TABLES).forEach(function (t) {\n    var tb = openTable_(t);\n    var rows = readRows_(tb);\n    var keep = rows.filter(function (r) {\n      // 已轉成學生登記的累計事項保留（讓原本的累計事件繼續隱藏，不會被當成無主紀錄同步）\n      if (t === 'items' && r.opts && r.opts.toLogs) return true;\n      return !(r.deleted && (r.updatedAt || 0) < tombCut);\n    });\n    if (keep.length !== rows.length) {\n      rewriteTable_(tb, keep);\n      purged = true;\n    }\n  });\n  if (purged) props_().setProperty('PURGE_HORIZON', String(now));\n  props_().setProperty('LAST_MAINT', String(now));\n}\n\nfunction backupFolder_() {\n  return ownFolder_('BACKUP_FOLDER_ID', BACKUP_FOLDER_NAME);\n}\n\n/**\n * 取得老師自己擁有的資料夾。依名稱搜尋時會略過別人分享過來的同名資料夾，\n * 避免把學生資料複製進他人的共用空間。\n */\nfunction ownFolder_(propKey, name) {\n  var me = Session.getEffectiveUser().getEmail();\n  var mine = function (f) {\n    try {\n      var o = f.getOwner();\n      return !f.isTrashed() && !!o && o.getEmail() === me;\n    } catch (e) {\n      return false;\n    }\n  };\n  var id = props_().getProperty(propKey);\n  if (id) {\n    try {\n      var f = DriveApp.getFolderById(id);\n      if (mine(f)) return f;\n    } catch (e) {}\n  }\n  var it = DriveApp.getFoldersByName(name);\n  while (it.hasNext()) {\n    var g = it.next();\n    if (mine(g)) {\n      props_().setProperty(propKey, g.getId());\n      return g;\n    }\n  }\n  var folder = DriveApp.createFolder(name);\n  props_().setProperty(propKey, folder.getId());\n  return folder;\n}\n\nfunction backupIfDue_(force) {\n  var now = Date.now();\n  var last = Number(props_().getProperty('LAST_BACKUP') || 0);\n  if (!force && now - last < BACKUP_EVERY_DAYS * 86400000) return null;\n  var ss = getSS_();\n  var folder = backupFolder_();\n  var stamp = Utilities.formatDate(new Date(now), Session.getScriptTimeZone(), 'yyyy-MM-dd');\n  var prefix = ss.getName() + ' 備份 ';\n  DriveApp.getFileById(ss.getId()).makeCopy(prefix + stamp, folder);\n  var files = [];\n  var it = folder.getFiles();\n  while (it.hasNext()) {\n    var f = it.next();\n    if (f.getName().indexOf(prefix) === 0 && !f.isTrashed()) files.push(f);\n  }\n  files.sort(function (a, b) {\n    return b.getDateCreated().getTime() - a.getDateCreated().getTime();\n  });\n  files.slice(BACKUP_KEEP).forEach(function (f) {\n    f.setTrashed(true);\n  });\n  props_().setProperty('LAST_BACKUP', String(now));\n  return { at: now, kept: Math.min(files.length, BACKUP_KEEP), folderUrl: folder.getUrl() };\n}\n\nfunction apiBackupNow_() {\n  return backupIfDue_(true);\n}\n\n// ---- Migrate.gs\n/**\n * 資料轉換：累計表併入學生快速登記（v1.2）。\n *\n * 每次拉取資料時檢查，有累計事項就轉換：\n * - 每一筆累計事件 → 一筆學生登記（事項名稱＝累計表標題，日期時間不變）。\n *   登記的 ID 由事件 ID 決定（ev-事件ID），多台裝置同時轉換或重複轉換都不會多出紀錄。\n * - 未歸檔的累計表標題、累計範本名稱加進快速登記清單，之後一樣點一下就能記。\n * - 累計事項標記為已轉換並刪除（不再同步到裝置），累計範本刪除。\n *   原本的「累計事件」sheet 與封存資料原封不動保留，作為備查。\n * 已轉換的累計事項之後若還收到舊版裝置上傳的事件，下次拉取時會一併補轉。\n */\n\nfunction migrateCounters_(now) {\n  var itemsTb = openTable_('items');\n  var items = readRows_(itemsTb).filter(function (i) {\n    return i.type === 'counter' && (!i.deleted || (i.opts && i.opts.toLogs));\n  });\n  var tplTb = openTable_('templates');\n  var tpls = readRows_(tplTb).filter(function (t) {\n    return t.type === 'counter' && !t.deleted;\n  });\n  if (!items.length && !tpls.length) return 0;\n\n  var pending = items.filter(function (i) {\n    return !i.deleted;\n  });\n  var byId = {};\n  items.forEach(function (i) {\n    byId[i.id] = i;\n  });\n\n  // 新轉換的事項讀主表＋封存；已轉換過的只看主表有沒有新上傳的事件\n  var events = [];\n  if (pending.length) {\n    events = childrenOf_(\n      pending.map(function (i) {\n        return i.id;\n      })\n    ).events;\n  }\n  var evTb = openTable_('events');\n  var seenEv = {};\n  events.forEach(function (e) {\n    seenEv[e.id] = true;\n  });\n  readRows_(evTb).forEach(function (e) {\n    var it = byId[e.itemId];\n    if (!it || !it.deleted || e.deleted || seenEv[e.id]) return;\n    seenEv[e.id] = true;\n    events.push(publicObj_(evTb, e));\n  });\n\n  var logTb = openTable_('logs');\n  var have = {};\n  readRows_(logTb).forEach(function (l) {\n    have[l.id] = true;\n  });\n  var appends = [];\n  events.forEach(function (e) {\n    var it = byId[e.itemId];\n    var id = 'ev-' + e.id;\n    if (!it || have[id] || !e.studentId) return;\n    have[id] = true;\n    var log = {\n      id: id,\n      classId: it.classId,\n      studentId: e.studentId,\n      label: String(it.title || '').trim() || '累計',\n      date: e.date,\n      at: e.at,\n      note: '',\n      photos: [],\n      updatedAt: now,\n      deleted: false,\n      _rev: now\n    };\n    log._raw = objToRow_(logTb, log);\n    appends.push(log);\n  });\n  writeRows_(logTb, [], appends);\n\n  // 快速登記清單：補上還在用的累計表與累計範本名稱\n  var add = [];\n  pending\n    .filter(function (i) {\n      return !i.archived;\n    })\n    .sort(function (a, b) {\n      return (a.createdAt || 0) - (b.createdAt || 0);\n    })\n    .forEach(function (i) {\n      add.push(String(i.title || '').trim());\n    });\n  tpls.forEach(function (t) {\n    add.push(String(t.name || '').trim());\n  });\n  if (add.length) {\n    var cur = readSetting_('quickList');\n    var list = Array.isArray(cur) ? cur.slice() : DEFAULT_QUICK_LIST.slice();\n    var changed = false;\n    add.forEach(function (x) {\n      if (x && list.indexOf(x) < 0) {\n        list.push(x);\n        changed = true;\n      }\n    });\n    if (changed || !Array.isArray(cur)) writeSetting_('quickList', list);\n  }\n\n  pending.forEach(function (i) {\n    i.opts = Object.assign({}, i.opts, { toLogs: true });\n    i.deleted = true;\n    i.updatedAt = now;\n    i._rev = now;\n    i._raw = objToRow_(itemsTb, i, i._raw);\n  });\n  writeRows_(itemsTb, pending, []);\n  tpls.forEach(function (t) {\n    t.deleted = true;\n    t.updatedAt = now;\n    t._rev = now;\n    t._raw = objToRow_(tplTb, t, t._raw);\n  });\n  writeRows_(tplTb, tpls, []);\n  return appends.length;\n}\n\n// ---- Photo.gs\n/**\n * 學生登記的相片：存在老師自己雲端硬碟的「老師隨手記相片」資料夾（App 自己建立、擁有的資料夾）。\n * 前端先縮圖再上傳；讀取時只回傳這個資料夾裡的檔案。\n */\n\nfunction photoFolder_() {\n  return ownFolder_('PHOTO_FOLDER_ID', PHOTO_FOLDER_NAME);\n}\n\n/** p.data：data URL（image/jpeg、png、webp）；p.name：檔名（不含副檔名）。 */\nfunction apiUploadPhoto_(p) {\n  var m = String(p.data || '').match(/^data:(image\\/(jpeg|png|webp));base64,([A-Za-z0-9+\\/=]+)$/);\n  if (!m) throw new Error('不支援這種相片格式');\n  var bytes = Utilities.base64Decode(m[3]);\n  if (bytes.length > PHOTO_MAX_BYTES) throw new Error('相片太大，請換一張');\n  var base = String(p.name || '相片').replace(/[\\\\\\/:*?\"<>|\\r\\n]+/g, ' ').trim().slice(0, 80) || '相片';\n  var file = photoFolder_().createFile(Utilities.newBlob(bytes, m[1], base + '.' + (m[2] === 'jpeg' ? 'jpg' : m[2])));\n  return { id: file.getId(), name: file.getName() };\n}\n\n/** 只允許讀取相片資料夾裡的檔案。 */\nfunction photoFile_(id) {\n  var folderId = photoFolder_().getId();\n  var file;\n  try {\n    file = DriveApp.getFileById(String(id));\n  } catch (e) {\n    throw new Error('找不到這張相片');\n  }\n  var parents = file.getParents();\n  while (parents.hasNext()) {\n    if (parents.next().getId() === folderId) return file;\n  }\n  throw new Error('找不到這張相片');\n}\n\nfunction apiPhoto_(p) {\n  var blob = photoFile_(p.id).getBlob();\n  return { type: blob.getContentType(), base64: Utilities.base64Encode(blob.getBytes()) };\n}\n\n/** PDF 用：把 <img data-photo=\"檔案ID\"> 換成內嵌圖片。 */\nfunction embedPhotos_(html) {\n  if (html.indexOf('data-photo=') < 0) return html;\n  return html.replace(/<img data-photo=\"([\\w-]+)\"/g, function (all, id) {\n    try {\n      var b = photoFile_(id).getBlob();\n      return '<img src=\"data:' + b.getContentType() + ';base64,' + Utilities.base64Encode(b.getBytes()) + '\"';\n    } catch (e) {\n      return '<img alt=\"（相片無法讀取）\"';\n    }\n  });\n}\n\n/** 沒被任何登記紀錄使用、且上傳超過 PHOTO_ORPHAN_DAYS 天的相片丟進垃圾桶。 */\nfunction cleanupPhotos_(now) {\n  var folderId = props_().getProperty('PHOTO_FOLDER_ID');\n  if (!folderId) return;\n  var rows = readRows_(openTable_('logs'));\n  // 登記表是空的（例如剛換新的資料試算表）時不清，避免誤丟所有相片\n  if (!rows.length) return;\n  var used = {};\n  rows.forEach(function (r) {\n    if (r.deleted) return;\n    (r.photos || []).forEach(function (ph) {\n      if (ph && ph.id) used[ph.id] = true;\n    });\n  });\n  var folder;\n  try {\n    folder = DriveApp.getFolderById(folderId);\n  } catch (e) {\n    return;\n  }\n  var cut = now - PHOTO_ORPHAN_DAYS * 86400000;\n  var it = folder.getFiles();\n  while (it.hasNext()) {\n    var f = it.next();\n    if (!used[f.getId()] && !f.isTrashed() && f.getDateCreated().getTime() < cut) f.setTrashed(true);\n  }\n}\n\n// ---- Schema.gs\n/**\n * 試算表資料結構。每個資料表對應一個 sheet，第一列為中文欄名。\n * 欄位型別：str（預設）、num、bool、json。\n * serverOnly 欄位只由伺服器寫入，裝置上傳時不會覆蓋。\n */\nvar TABLES = {\n  classes: {\n    sheet: '班級',\n    cols: [\n      ['id', 'ID'],\n      ['name', '班級名稱'],\n      ['year', '學年'],\n      ['order', '排序', 'num'],\n      ['archived', '歸檔', 'bool'],\n      ['seatRows', '座位列數', 'num'],\n      ['seatCols', '座位行數', 'num']\n    ]\n  },\n  students: {\n    sheet: '學生',\n    cols: [\n      ['id', 'ID'],\n      ['classId', '班級ID'],\n      ['no', '座號', 'num'],\n      ['name', '姓名'],\n      ['out', '轉出', 'bool']\n    ]\n  },\n  items: {\n    sheet: '事項清單',\n    cols: [\n      ['id', 'ID'],\n      ['classId', '班級ID'],\n      ['type', '類型'], // check 勾選｜score 成績（舊版的 counter 累計已轉成學生登記，見 Migrate.gs）\n      ['title', '標題'],\n      ['date', '日期'],\n      ['archived', '歸檔', 'bool'],\n      ['archivedAt', '歸檔時間', 'num'],\n      ['roster', '名單快照', 'json'],\n      ['opts', '設定', 'json'],\n      ['createdAt', '建立時間', 'num'],\n      ['moved', '已搬入封存', 'bool', 'serverOnly']\n    ]\n  },\n  checks: {\n    sheet: '勾選紀錄',\n    child: true,\n    cols: [\n      ['id', 'ID'],\n      ['itemId', '事項ID'],\n      ['studentId', '學生ID'],\n      ['checked', '勾選', 'bool'],\n      ['checkedAt', '勾選時間', 'num'],\n      ['amount', '金額']\n    ]\n  },\n  // 舊版累計表的紀錄，已轉成學生登記（logs）；保留作為備查與轉換來源\n  events: {\n    sheet: '累計事件',\n    child: true,\n    cols: [\n      ['id', 'ID'],\n      ['itemId', '事項ID'],\n      ['studentId', '學生ID'],\n      ['date', '日期'],\n      ['at', '時間', 'num']\n    ]\n  },\n  scores: {\n    sheet: '成績紀錄',\n    child: true,\n    cols: [\n      ['id', 'ID'],\n      ['itemId', '事項ID'],\n      ['studentId', '學生ID'],\n      ['score', '分數'],\n      ['absent', '缺考', 'bool']\n    ]\n  },\n  todos: {\n    sheet: '待辦',\n    cols: [\n      ['id', 'ID'],\n      ['text', '內容'],\n      ['due', '期限'],\n      ['classId', '班級標籤'],\n      ['repeat', '重複設定', 'json'],\n      ['occurrence', '第幾次', 'num'],\n      ['done', '完成', 'bool'],\n      ['doneAt', '完成時間', 'num'],\n      ['nextId', '下一次ID']\n    ]\n  },\n  cal: {\n    sheet: '行事曆',\n    cols: [\n      ['id', 'ID'],\n      ['date', '日期'],\n      ['time', '時間'],\n      ['text', '內容'],\n      ['classId', '班級標籤'],\n      ['gcalId', 'Google日曆ID', 'str', 'serverOnly'],\n      ['dayType', '上課日設定'], // 空白：一般行程｜off 放假（不上課）｜makeup 補上課\n      ['endDate', '結束日期'] // 放假可連續多天（例如寒暑假）\n    ]\n  },\n  templates: {\n    sheet: '範本',\n    cols: [\n      ['id', 'ID'],\n      ['name', '名稱'],\n      ['type', '類型'],\n      ['opts', '設定', 'json'],\n      ['order', '排序', 'num']\n    ]\n  },\n  notes: {\n    sheet: '學生備註',\n    cols: [\n      ['id', 'ID'],\n      ['studentId', '學生ID'],\n      ['date', '日期'],\n      ['text', '備註']\n    ]\n  },\n  contacts: {\n    sheet: '家長聯絡紀錄',\n    cols: [\n      ['id', 'ID'],\n      ['studentId', '學生ID'],\n      ['classId', '班級ID'],\n      ['date', '日期'],\n      ['at', '時間', 'num'],\n      ['topics', '談及事項', 'json'],\n      ['text', '訊息內容'],\n      ['via', '方式']\n    ]\n  },\n  logs: {\n    sheet: '學生登記',\n    cols: [\n      ['id', 'ID'],\n      ['classId', '班級ID'],\n      ['studentId', '學生ID'],\n      ['label', '事項'],\n      ['date', '日期'],\n      ['at', '時間', 'num'],\n      ['note', '備註'],\n      ['photos', '相片', 'json']\n    ]\n  },\n  leaves: {\n    sheet: '請假紀錄',\n    cols: [\n      ['id', 'ID'],\n      ['classId', '班級ID'],\n      ['studentId', '學生ID'],\n      ['start', '開始日期'],\n      ['end', '結束日期'],\n      ['kind', '假別'],\n      ['reason', '原因'],\n      ['unreported', '未報備', 'bool'],\n      ['parentOk', '家長已確認', 'bool'],\n      ['parentAt', '家長確認時間', 'num'],\n      ['done', '已完成請假手續', 'bool'],\n      ['doneAt', '完成手續時間', 'num'],\n      ['createdAt', '登記時間', 'num']\n    ]\n  },\n  seats: {\n    sheet: '座位',\n    cols: [\n      ['id', 'ID'],\n      ['classId', '班級ID'],\n      ['studentId', '學生ID'],\n      ['row', '列', 'num'],\n      ['col', '行', 'num']\n    ]\n  },\n  groups: {\n    sheet: '分組',\n    cols: [\n      ['id', 'ID'],\n      ['classId', '班級ID'],\n      ['name', '方案名稱'],\n      ['groups', '各組成員', 'json']\n    ]\n  },\n  settings: {\n    sheet: '設定',\n    cols: [\n      ['id', '鍵'],\n      ['value', '值', 'json']\n    ]\n  }\n};\n\nvar META_COLS = [\n  ['updatedAt', '修改時間', 'num'],\n  ['deleted', '已刪除', 'bool'],\n  ['_rev', '同步版本', 'num', 'serverOnly']\n];\n\nvar ARCHIVE_SHEET = '封存';\nvar ARCHIVE_COLS = ['資料表', 'ID', '事項ID', '資料', '搬入時間'];\n\n/** 子資料表（隸屬於事項）的名稱。 */\nvar CHILD_TABLES = ['checks', 'events', 'scores'];\n\nfunction tableCols_(t) {\n  var def = TABLES[t];\n  if (!def) throw new Error('未知的資料表：' + t);\n  if (!def._all) {\n    def._all = def.cols.concat(META_CO     });
    var summary = ['', '統計'].concat(items.map(function (i) {
      var ids = (i.roster || []).filter(function (id) { return students.some(function (s) { return s.id === id; }); });
      if (i.type === 'check') {
        var cm = {};
        ids.forEach(function (id) { cm[id] = checks[i.id + ':' + id]; });
        var st = checkStats(ids, cm);
        var rate = st.total ? Math.round((st.done / st.total) * 100) : 0;
        return '完成 ' + rate + '%' + (i.opts && i.opts.amount ? '，合計 ' + st.amount : '');
      }
      if (i.type === 'log') {
        return '共 ' + ids.reduce(function (a, id) { return a + (counts[i.id + ':' + id] || 0); }, 0) + ' 次';
      }
      var sm = {};
      ids.forEach(function (id) { sm[id] = scores[i.id + ':' + id]; });
      var ss = scoreStats(ids, sm);
      return ss.avg == null ? '' : '平均 ' + ss.avg;
    }));
    var checkItems = items.filter(function (i) { return i.type === 'check'; });
    var rateChart = checkItems.map(function (i) {
      var done = (i.roster || []).filter(function (id) { var c = checks[i.id + ':' + id]; return c && c.checked; }).length;
      return { label: itemTitle(i.title, i.date), value: (i.roster || []).length ? Math.round((done / i.roster.length) * 100) : 0, max: 100, suffix: '%' };
    });
    var logItems = items.filter(function (i) { return i.type === 'log'; });
    var countChart = students.map(function (s) {
      return { label: s.no + ' ' + s.name, value: logItems.reduce(function (a, i) { return a + (counts[i.id + ':' + s.id] || 0); }, 0) };
    }).filter(function (x) { return x.value > 0; }).sort(function (a, b) { return b.value - a.value; });
    return { header: header, rows: rows, summary: summary, rateChart: rateChart, countChart: countChart, items: items, students: students };
  }

  // 個人明細：只列需注意項目，最後加「其餘皆完成」；成績全列；快速登記依事項列次數與日期。
  function personalReport(data) {
    var sid = data.student.id;
    var items = data.items.filter(function (i) { return (i.roster || []).indexOf(sid) >= 0; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var checks = {};
    data.checks.forEach(function (c) { if (c.studentId === sid) checks[c.itemId] = c; });
    var scores = {};
    data.scores.forEach(function (c) { if (c.studentId === sid) scores[c.itemId] = c; });
    var pending = [];
    var doneCount = 0;
    var checkTotal = 0;
    var scoreList = [];
    items.forEach(function (i) {
      if (i.type === 'check') {
        if (i.date < data.from || i.date > data.to) return;
        checkTotal++;
        var c = checks[i.id];
        if (c && c.checked) doneCount++;
        else pending.push({ title: i.title, date: i.date, amount: c && c.amount });
      } else if (i.type === 'score') {
        if (i.date < data.from || i.date > data.to) return;
        var s = scores[i.id];
        scoreList.push({ title: i.title, date: i.date, max: (i.opts && i.opts.max) || 100, score: s && !s.absent ? s.score : '', absent: !!(s && s.absent) });
      }
    });
    return {
      logs: logSummary((data.logs || []).filter(function (l) { return l.studentId === sid && l.date >= data.from && l.date <= data.to; })),
      pending: pending,
      doneCount: doneCount,
      checkTotal: checkTotal,
      checkRate: checkTotal ? Math.round((doneCount / checkTotal) * 100) : null,
      scores: scoreList
    };
  }

  // 學生登記：依事項彙總次數與日期（次數多的在前）
  function logSummary(logs) {
    var m = {};
    var order = [];
    logs.slice().sort(byAt).forEach(function (l) {
      if (!m[l.label]) { m[l.label] = { label: l.label, count: 0, dates: [] }; order.push(m[l.label]); }
      m[l.label].count++;
      m[l.label].dates.push(l.date);
    });
    return order.sort(function (a, b) { return b.count - a.count; });
  }
  var byAt = function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.at || 0) - (b.at || 0); };

  // 學生登記交出用：依期間、學生、事項篩選。students 為「學生ID → 學生」對照，不在對照裡的紀錄略過。
  function logReport(data) {
    var labels = data.labels ? mapBy(data.labels.map(function (x) { return { id: x }; }), 'id') : null;
    var list = data.logs.filter(function (l) {
      return l.date >= data.from && l.date <= data.to && data.students[l.studentId] &&
        (!data.studentId || l.studentId === data.studentId) && (!labels || labels[l.label]);
    }).sort(byAt);
    var per = {};
    list.forEach(function (l) { per[l.studentId] = (per[l.studentId] || 0) + 1; });
    var byStudent = Object.keys(per).map(function (id) { return { s: data.students[id], count: per[id] }; })
      .sort(function (a, b) { return b.count - a.count || (a.s.no || 0) - (b.s.no || 0); });
    return { list: list, counts: logSummary(list), byStudent: byStudent };
  }

  /* ---------- 請假 ---------- */
  // 請假紀錄：start 開始日、end 結束日（單日可空白）。
  var leaveEnd = function (l) { return l.end && l.end > l.start ? l.end : l.start; };
  var onLeave = function (l, d) { return !!l.start && l.start <= d && d <= leaveEnd(l); };
  var leaveDays = function (l) { return diffDays(l.start, leaveEnd(l)) + 1; };
  function leaveRange(l) {
    var e = leaveEnd(l);
    return md(l.start) + '（' + WEEK[dow(l.start)] + '）' + (e > l.start ? '～' + md(e) + '（' + WEEK[dow(e)] + '）' : '');
  }
  // 學校上課日：週一到週五，扣掉行事曆標為「放假」的日子（可連續多天），加上「補上課」的日子。
  function schoolDays(cals) {
    var off = {};
    var makeup = {};
    (cals || []).forEach(function (e) {
      if (!e.date || e.deleted) return;
      if (e.dayType === 'makeup') makeup[e.date] = true;
      else if (e.dayType === 'off') {
        var end = e.endDate && e.endDate > e.date ? e.endDate : e.date;
        for (var d = e.date, n = 0; d <= end && n < 400; d = addDays(d, 1), n++) off[d] = true;
      }
    });
    return function (d) {
      if (makeup[d]) return true;
      if (off[d]) return false;
      var w = dow(d);
      return w !== 0 && w !== 6;
    };
  }
  // 請假結束後到 t 為止的上課日數：銷假回來的第一個上課日算第 1 天。
  function schoolDaysAfter(end, t, isSchool) {
    isSchool = isSchool || schoolDays([]);
    var n = 0;
    for (var d = addDays(end, 1), k = 0; d <= t && k < 800; d = addDays(d, 1), k++) if (isSchool(d)) n++;
    return n;
  }
  // 手續提醒：還沒完成請假手續時，以上課日計算，滿 remind 個上課日為「提醒」、滿 warn 個為「警示」。
  // 還沒到請假日不算；請假期間內為 pending（0 天）。
  function leaveAlert(l, t, remind, warn, isSchool) {
    if (l.done || !l.start || l.start > t) return null;
    var d = schoolDaysAfter(leaveEnd(l), t, isSchool);
    return { level: d >= (warn || 14) ? 'warn' : d >= (remind || 7) ? 'remind' : 'pending', days: d };
  }
  // 請假總表：今天請假、即將請假、手續未完成（逾期久的在前）
  function leaveBoard(leaves, t, opt) {
    opt = opt || {};
    var b = { today: [], upcoming: [], todo: [], warn: 0, remind: 0 };
    leaves.forEach(function (l) {
      if (!l.start) return;
      if (onLeave(l, t)) b.today.push(l);
      else if (l.start > t) b.upcoming.push(l);
      var a = leaveAlert(l, t, opt.remind, opt.warn, opt.isSchool);
      if (a) {
        b.todo.push({ l: l, level: a.level, days: a.days });
        if (a.level === 'warn') b.warn++;
        else if (a.level === 'remind') b.remind++;
      }
    });
    b.upcoming.sort(function (x, y) { return x.start < y.start ? -1 : x.start > y.start ? 1 : 0; });
    b.todo.sort(function (x, y) { return y.days - x.days || (x.l.start < y.l.start ? -1 : 1); });
    return b;
  }

  // 單一學生請假明細（跟家長核對用）：meta = { className, no, name, from, to }
  function leaveText(list, meta) {

    var head = meta.name + '家長您好：\n以下是' + meta.name + '在 ' + md(meta.from) + '～' + md(meta.to) + ' 的請假紀錄，麻煩您核對，若有不符請告訴我：';
    return list.length ? [head].concat(lines).concat(['共 ' + list.length + ' 次、' + days + ' 天。' + (list.some(function (l) { return !l.done; }) ? '尚未完成請假手續的部分，再麻煩協助孩子補辦，謝謝！' : '謝謝您！')]).join('\n')
      : meta.name + '家長您好：\n' + meta.name + '在 ' + md(meta.from) + '～' + md(meta.to) + ' 沒有請假紀錄。謝謝您！';
  }
  function leaveReportHtml(list, meta) {

      list.forEach(function (l) {

      });

    h.push('<div style="text-align:right;margin-top:22px;"><span class="seal">老師隨手記</span>　' + e(md(today())) + ' 製表</div>');
    h.push('</div></body></html>');
    return h.join('');
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  }

  /* 「加入 Google 日曆」連結：開啟 Google 日曆的新增活動畫面並帶入內容（整天或指定時間，預設 1 小時） */
  function gcalUrl(ev, className) {
    var d = String(ev.date || '').replace(/-/g, '');
    var dates;
    if (ev.time) {

var UI = {
  _open: [],
  /* 底部彈出面板。opts: { title, body, actions:[{label, cls, del, onClick}], center, onMount, onClose }

     沒有給任何按鈕的面板（選單、選學生）自動加上「回上頁」，每個彈出視窗都有明確的返回方式。 */
  sheet: function (opts) {
    var list = (opts.actions || []).filter(Boolean);
    if (!list.length && opts.dismissable !== false && opts.back !== false) list = [{ label: icon('back') + '回上頁', cls: 'back' }];
    opts = Object.assign({}, opts, { actions: list });
    var ov = document.createElement('div');
    ov.className = 'overlay' + (opts.center ? ' center' : '');
    var btn = function (a, i) { return '<button class="btn ' + (a.cls || '') + (a.del ? ' del' : '') + '" data-i="' + i + '">' + a.label + '</button>'; };
    var acts = list.map(function (a, i) { return a.del ? '' : btn(a, i); }).join('');
    var dels = list.map(function (a, i) { return a.del ? btn(a, i) : ''; }).join('');
    ov.innerHTML = '<div class="sheet" role="dialog">' + (opts.center ? '' : '<div class="grip"></div>') +
      (opts.title ? '<h2>' + opts.title + '</h2>' : '') + '<div class="sheet-body">' + (opts.body || '') + '</div>' +
      (acts ? '<div class="acts">' + acts + '</div>' : '') + (dels ? '<div class="acts acts-del">' + dels + '</div>' : '') + '</div>';
    var closed = false;
    var close = function (v) {
      if (closed) return;
      closed = true;
      ov.remove();
      var k = UI._open.indexOf(close);
      if (k >= 0) UI._open.splice(k, 1);
      if (opts.onClose) opts.onClose(v);
    };
    ov.addEventListener('click', function (e) {
      if (e.target === ov && opts.dismissable !== false) close();

  dropdown: function (anchor, items, opts) {

    var r = anchor.getBoundingClientRect();

  _snack: null,
