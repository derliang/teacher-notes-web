/* ---------- 日期選擇器（自製，取代系統內建的日期欄） ----------
   畫面上所有 <input type="date"> 都會自動換成這個選擇器：欄位改成唯讀文字並顯示「2026/10/21（三）」，
   .value 仍讀寫 yyyy-mm-dd，選好日期時送出 change 事件，原本讀取日期欄的程式不用改。
   月曆每週前面標週次（開學那週為第 1 週），今天、星期六日與行事曆上的放假日都特別標示。 */
var DatePick = {
  _desc: null,
  fmt: function (v) { return v ? v.replace(/-/g, '/') + '（' + L.WEEK[L.dow(v)] + '）' : ''; },
  enhance: function (inp) {
    if (inp.dataset.dp) return;
    var desc = DatePick._desc || (DatePick._desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value'));
    var iso = desc.get.call(inp) || inp.getAttribute('value') || '';
    inp.dataset.dp = '1';
    inp.type = 'text';
    inp.readOnly = true;
    inp.setAttribute('inputmode', 'none');
    inp.classList.add('date-in');
    if (!inp.placeholder) inp.placeholder = '選擇日期';
    Object.defineProperty(inp, 'value', {
      configurable: true,
      get: function () { return inp.dataset.iso || ''; },
      set: function (v) { v = /^\d{4}-\d\d-\d\d$/.test(v || '') ? v : ''; inp.dataset.iso = v; desc.set.call(inp, DatePick.fmt(v)); }
    });
    inp.value = iso;
  },
  scan: function (root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches('input[type=date]')) DatePick.enhance(root);
    root.querySelectorAll('input[type=date]').forEach(DatePick.enhance);
  },
  /* 某天是開學後第幾週：以學期開始日那週為第 1 週（週一到週日為一週） */
  week: function (d) {
    var start = typeof semesterStartOf === 'function' ? semesterStartOf(d) : null;
    return start ? L.weekNo(d, start) : null;
  },
  open: function (inp) {
    if (inp.disabled) return;
    var t = L.today();
    var cur = inp.value;
    var min = inp.getAttribute('min') || '';
    var max = inp.getAttribute('max') || '';
    var month = (cur || (min && min > t ? min : t)).slice(0, 7);
    var isSchool = typeof Leave !== 'undefined' ? Leave.isSchool() : null;
    var title = inp.closest('.field') && inp.closest('.field').querySelector('span');
    var pick = function (v, close) {
      inp.value = v;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      UI.buzz(8);
      close();
    };
    var draw = function (el) {
      var first = L.parse(month + '-01');
      var start = L.addDays(month + '-01', -first.getDay());
      var h = '<div class="dp-head"><button type="button" class="icon-btn" data-dp-m="-1" aria-label="上個月">' + icon('back') + '</button>' +
        '<b class="grow center serif">' + first.getFullYear() + ' 年 ' + (first.getMonth() + 1) + ' 月</b>' +
        '<button type="button" class="icon-btn flip" data-dp-m="1" aria-label="下個月">' + icon('back') + '</button></div>' +
        '<div class="dp-grid"><span class="dp-wk-h">週次</span>' + '日一二三四五六'.split('').map(function (w, i) {
          return '<span class="dp-wd' + (i === 0 || i === 6 ? ' we' : '') + '">' + w + '</span>';
        }).join('');
      for (var r = 0; r < 6; r++) {
        var row = L.addDays(start, r * 7);
        if (r > 3 && row.slice(0, 7) !== month) break;
        var wk = DatePick.week(L.addDays(row, 1));
        h += '<span class="dp-wk">' + (wk ? '第' + wk + '週' : '') + '</span>';
        for (var c = 0; c < 7; c++) {
          var d = L.addDays(row, c);
          var we = c === 0 || c === 6;
          var off = isSchool && !we && !isSchool(d);
          var bad = (min && d < min) || (max && d > max);
          h += '<button type="button" class="dp-d' + (we ? ' we' : '') + (off ? ' off' : '') + (d.slice(0, 7) !== month ? ' other' : '') + (d === t ? ' today' : '') + (d === cur ? ' sel' : '') + '"' +
            (bad ? ' disabled' : ' data-dp="' + d + '"') + ' aria-label="' + L.md(d) + ' 週' + L.WEEK[c] + (d === t ? '（今天）' : '') + '">' + Number(d.slice(8)) + (d === t ? '<small>今天</small>' : '') + '</button>';
        }
      }
      h += '</div>';
      el.innerHTML = h;
    };
    UI.sheet({
      center: true,
      title: title ? esc(title.textContent.replace(/（.*?）/g, '')) : '選擇日期',
      body: '',
      actions: [
        { label: icon('back') + '回上頁', cls: 'back' },
        !inp.required && cur ? { label: '清除', onClick: function (el, close) { pick('', close); return false; } } : null,
        (!min || t >= min) && (!max || t <= max) ? { label: '今天', cls: 'primary', onClick: function (el, close) { pick(t, close); return false; } } : null
      ],
      onMount: function (el, close) {
        el.parentNode.classList.add('dp-sheet');
        draw(el);
        el.addEventListener('click', function (e) {
          var m = e.target.closest('[data-dp-m]');
          if (m) { var d = L.parse(month + '-01'); d.setMonth(d.getMonth() + Number(m.dataset.dpM)); month = L.ymd(d).slice(0, 7); draw(el); return; }
          var b = e.target.closest('[data-dp]');
          if (b) pick(b.dataset.dp, close);
        });
      }
    });
  }
};
document.addEventListener('click', function (e) {
  var inp = e.target.closest && e.target.closest('input.date-in');
  if (inp) { e.preventDefault(); inp.blur(); DatePick.open(inp); }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('date-in')) { e.preventDefault(); DatePick.open(e.target); }
});
if (window.MutationObserver) {
  new MutationObserver(function (muts) {
    muts.forEach(function (m) { Array.prototype.forEach.call(m.addedNodes, function (n) { if (n.nodeType === 1) DatePick.scan(n); }); });
  }).observe(document.documentElement, { childList: true, subtree: true });
}

/* ---------- 座位格子的姓名：一行完整顯示，放不下時逐步縮小字級（最小 9px） ---------- */
function fitSeatNames(root) {
  (root || document).querySelectorAll('.seat .sn').forEach(function (n) {
    n.style.fontSize = '';
    var size = parseFloat(getComputedStyle(n).fontSize) || 13;
    var guard = 0;
    while (n.scrollWidth > n.clientWidth + 0.5 && size > 9 && guard++ < 20) {
      size -= 0.5;
      n.style.fontSize = size + 'px';
    }
  });
}
var _fitTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(_fitTimer);
  _fitTimer = setTimeout(function () { fitSeatNames(); }, 120);
});

/* ---------- 手勢：長按 ---------- */
var Gesture = {
  lpTimer: null,
  lpFired: false,
  start: null,
  handlers: {},
  init: function () {
    var self = this;
    document.addEventListener('pointerdown', function (e) {
      var el = e.target.closest('[data-lp]');
      self.lpFired = false;
      if (!el || e.button > 0) return;
      self.start = { x: e.clientX, y: e.clientY, el: el };
      clearTimeout(self.lpTimer);
      self.lpTimer = setTimeout(function () {
        self.lpFired = true;
        UI.buzz(20);
        var fn = self.handlers[el.dataset.lp];
        if (fn) fn(el.dataset, el);
      }, 520);
    }, { passive: true });
    var cancel = function () { clearTimeout(self.lpTimer); };
    document.addEventListener('pointermove', function (e) {
      if (self.start && Math.hypot(e.clientX - self.start.x, e.clientY - self.start.y) > 10) cancel();
    }, { passive: true });
    document.addEventListener('pointerup', cancel);
    document.addEventListener('pointercancel', cancel);
    document.addEventListener('scroll', cancel, true);
    document.addEventListener('contextmenu', function (e) {
      var el = e.target.closest('[data-lp]');
      if (!el) return;
      e.preventDefault();
      // 用滑鼠時，按右鍵等同長按
      if (window.matchMedia && matchMedia('(pointer: fine)').matches && !self.lpFired) {
        clearTimeout(self.lpTimer);
        var fn = self.handlers[el.dataset.lp];
        if (fn) fn(el.dataset, el);
      }
    });
    // 長按觸發後吃掉接著的 click
    document.addEventListener('click', function (e) {
      if (self.lpFired) { e.stopPropagation(); e.preventDefault(); self.lpFired = false; }
    }, true);
  },
  on: function (name, fn) { this.handlers[name] = fn; }
};

/* ---------- 手勢：左右滑動（待辦） ---------- */
var Swipe = {
  init: function (root, onRight, onLeft) {
    var cur = null;
    root.addEventListener('pointerdown', function (e) {
      var fg = e.target.closest('.swipe .fg');
      if (!fg) return;
      cur = { fg: fg, x: e.clientX, y: e.clientY, dx: 0, lock: null, id: fg.dataset.id };
    });
    root.addEventListener('pointermove', function (e) {
      if (!cur) return;
      var dx = e.clientX - cur.x;
      var dy = e.clientY - cur.y;
      if (!cur.lock) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { cur.lock = 'x'; cur.fg.classList.add('dragging'); try { cur.fg.setPointerCapture(e.pointerId); } catch (er) {} }
        else if (Math.abs(dy) > 8) { cur = null; return; }
      }
      if (cur.lock === 'x') {
        cur.dx = dx;
        cur.fg.style.transform = 'translateX(' + dx + 'px)';
        var sw = cur.fg.parentNode;
        sw.querySelector('.bg.r').style.opacity = dx > 0 ? 1 : 0;
        sw.querySelector('.bg.l').style.opacity = dx < 0 ? 1 : 0;
      }
    });
    var end = function () {
      if (!cur) return;
      var c = cur;
      cur = null;
      c.fg.classList.remove('dragging');
      if (c.lock !== 'x') return;
      Gesture.lpFired = true; // 避免觸發點擊
      setTimeout(function () { Gesture.lpFired = false; }, 50);
      var w = c.fg.offsetWidth;
      if (c.dx > Math.min(110, w * 0.3)) { c.fg.style.transform = 'translateX(' + w + 'px)'; setTimeout(function () { onRight(c.id); }, 160); }
      else if (c.dx < -Math.min(110, w * 0.3)) { c.fg.style.transform = 'translateX(' + -w + 'px)'; setTimeout(function () { onLeft(c.id); }, 160); }
      else c.fg.style.transform = '';
    };
    root.addEventListener('pointerup', end);
    root.addEventListener('pointercancel', end);
  }
};

/* ---------- 拖拉（座位安排）：放開時回呼 onDrop(dragData, targetEl) ---------- */
var Drag = {
  init: function (root, onDrop) {
    var cur = null;
    root.addEventListener('pointerdown', function (e) {
      var src = e.target.closest('[data-drag]');
      if (!src) return;
      cur = { src: src, x: e.clientX, y: e.clientY, moving: false, ghost: null, over: null };
    });
    root.addEventListener('pointermove', function (e) {
      if (!cur) return;
      if (!cur.moving) {
        if (Math.hypot(e.clientX - cur.x, e.clientY - cur.y) < 8) return;
        cur.moving = true;
        try { cur.src.setPointerCapture(e.pointerId); } catch (er) {}
        cur.ghost = cur.src.cloneNode(true);
        cur.ghost.classList.add('drag-ghost');
        cur.ghost.style.width = cur.src.offsetWidth + 'px';
        document.body.appendChild(cur.ghost);
      }
      cur.ghost.style.left = e.clientX + 'px';
      cur.ghost.style.top = e.clientY + 'px';
      var t = document.elementFromPoint(e.clientX, e.clientY);
      var over = t && t.closest('[data-drop]');
      if (cur.over && cur.over !== over) cur.over.classList.remove('drop');
      if (over) over.classList.add('drop');
      cur.over = over;
    });
    var end = function () {
      if (!cur) return;
      var c = cur;
      cur = null;
      if (c.ghost) c.ghost.remove();
      if (c.over) c.over.classList.remove('drop');
      if (c.moving) {
        Gesture.lpFired = true;
        setTimeout(function () { Gesture.lpFired = false; }, 50);
        if (c.over) onDrop(c.src.dataset, c.over.dataset);
      }
    };
    root.addEventListener('pointerup', end);
    root.addEventListener('pointercancel', end);
  }
};

/* ---------- 計時器提示音 ---------- */
var Beep = {
  ctx: null,
  prime: function () {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  ring: function (times) {
    var ctx = this.ctx;
    if (!ctx) return;
    for (var i = 0; i < (times || 3); i++) {
      [0, 0.18].forEach(function (off) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        var t = ctx.currentTime + i * 0.8 + off;
        o.frequency.value = 880;
        o.type = 'sine';
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.16);
      });
    }
  }
};
</script>

    <script>
/* App 外框：分頁與頁面堆疊、頂端列、底部分頁列、事件分派、啟動流程、PIN 鎖。 */

var TABS = [
  ['today', '今日', 'home'],
  ['leave', '請假', 'leave'],
  ['check', '勾選', 'check'],
  ['score', '成績', 'score'],
  ['todo', '待辦', 'todo'],
  ['cal', '行事曆', 'cal']
];
var TAB_ROOT = { today: 'today', leave: 'leave', check: 'checkList', score: 'scoreList', todo: 'todos', cal: 'cal' };
/* 分頁的首頁（例如請假紀錄）：從別處前往時直接切到那個分頁 */
function tabOfRoot(v) {
  var t = null;
  Object.keys(TAB_ROOT).forEach(function (k) { if (TAB_ROOT[k] === v && k !== 'today') t = k; });
  return t;
}

var Views = {};
var Act = {};
var Change = {};

var App = {
  booted: false,
  tab: 'today',
  stacks: {},
  ui: {},
  classId: null,
  afterRender: [],
  _raf: null,
  init: function () {
    var self = this;
    Object.keys(TAB_ROOT).forEach(function (t) { self.stacks[t] = [{ v: TAB_ROOT[t] }]; });
    this.classId = Prefs.get('classId', null);
    this.ui = Prefs.get('ui', {}) || {};
  },
  top: function () {
    var s = this.stacks[this.tab];
    return s[s.length - 1];
  },
  go: function (v, params) {
    UI.closeAll();
    var tab = tabOfRoot(v);
    if (tab && !(params && params.id)) { this.openIn(tab); return; }
    var top = this.top();
    if (top) top.scroll = this.mainEl() ? this.mainEl().scrollTop : 0;
    this.stacks[this.tab].push(Object.assign({ v: v }, params || {}));
    this.render();
    if (this.mainEl()) this.mainEl().scrollTop = 0;
  },
  replace: function (v, params) {
    this.stacks[this.tab][this.stacks[this.tab].length - 1] = Object.assign({ v: v }, params || {});
    this.render();
  },
  back: function () {
    var s = this.stacks[this.tab];
    if (s.length > 1) s.pop();
    this.render();
  },
  setTab: function (t, reset) {
    UI.closeAll();
    if (t === this.tab || reset) this.stacks[t].length = 1;
    var top = this.top();
    if (top) top.scroll = this.mainEl() ? this.mainEl().scrollTop : 0;
    this.tab = t;
    this.render();
  },
  openIn: function (tab, v, params) {
    UI.closeAll();
    this.stacks[tab].length = 1;
    var top = this.top();
    if (top && tab !== this.tab) top.scroll = this.mainEl() ? this.mainEl().scrollTop : 0;
    this.tab = tab;
    if (v) this.stacks[tab].push(Object.assign({ v: v }, params || {}));
    this.render();
    if (this.mainEl()) this.mainEl().scrollTop = 0;
  },
  setUi: function (k, v, persist) {
    this.ui[k] = v;
    if (persist !== false) Prefs.set('ui', this.ui);
    this.render();
  },
  cls: function () {
    var list = Q.classes();
    if (!list.length) return null;
    if (!this.classId || !list.some(function (c) { return c.id === App.classId; })) {
      this.classId = list[0].id;
      Prefs.set('classId', this.classId);
    }
    return DB.get('classes', this.classId);
  },
  setClass: function (id) {
    this.classId = id;
    Prefs.set('classId', id);
    this.render();
  },
  mainEl: function () { return document.getElementById('main'); },
  renderSoon: function () {
    var self = this;
    if (this._raf) return;
    this._raf = requestAnimationFrame(function () { self._raf = null; self.render(); });
  },
  render: function () {
    if (!this.booted) return;
    var root = document.getElementById('app');
    var view = this.top();
    var V = Views[view.v];
    if (!V) { this.back(); return; }
    var depth = this.stacks[this.tab].length;
    var main = this.mainEl();
    var ae = document.activeElement;
    var fk = ae && ae.dataset && ae.dataset.fk;
    var sel = null;
    var typed = fk ? ae.value : null;
    try { sel = fk ? [ae.selectionStart, ae.selectionEnd] : null; } catch (e) {}
    if (fk && ae.dataset.keep) { this._pending = true; return; }
    var sameView = main && main.dataset.key === this.viewKey(view);
    var scroll = sameView ? main.scrollTop : view.scroll || 0;

    if (!main) {
      root.innerHTML = '<header class="head" id="head"></header><main class="main" id="main"></main><nav class="tabs" id="tabs"></nav><div id="fab-slot"></div>';
      main = this.mainEl();
    }
    document.getElementById('head').innerHTML = this.renderHead(V, view, depth);
    var html;
    try { html = V.render(view); } catch (e) { console.error(e); html = '<div class="empty">畫面發生錯誤：' + esc(e.message) + '</div>'; }
    main.innerHTML = '<div class="page" data-view="' + esc(view.v) + '">' + html + '</div>';
    main.dataset.key = this.viewKey(view);
    main.classList.toggle('no-tabs', !!V.noTabs);
    root.classList.toggle('no-tabs', !!V.noTabs);
    root.dataset.view = view.v;
    var tabs = document.getElementById('tabs');
    tabs.classList.toggle('hidden', !!V.noTabs);
    // 寬螢幕時分頁列改為左側欄，品牌列只在左側欄顯示
    tabs.innerHTML = '<div class="tabs-brand"><span class="seal-logo">記</span><span class="serif">老師隨手記</span></div>' + TABS.map(function (t) {
      return '<button data-act="tab" data-tab="' + t[0] + '" class="' + (App.tab === t[0] ? 'on' : '') + '">' + icon(t[2]) + '<span>' + t[1] + '</span></button>';
    }).join('');
    var fab = V.fab && V.fab(view);
    document.getElementById('fab-slot').innerHTML = fab ? '<button class="fab" data-act="fab" data-lp="fab" aria-label="新增">' + icon('plus') + '</button>' : '';
    main.scrollTop = scroll;
    if (fk) {
      var n = main.querySelector('[data-fk="' + fk + '"]');
      if (n) {
        // 保留使用者正在輸入、尚未送出的內容；換成新欄位後瀏覽器不會再觸發 change，離開欄位時補發
        if (typed != null && typed !== n.value) {
          n.value = typed;
          var fired = false;
          n.addEventListener('change', function () { fired = true; }, { once: true });
          n.addEventListener('blur', function () { if (!fired) n.dispatchEvent(new Event('change', { bubbles: true })); }, { once: true });
        }
        n.focus();
        try { if (sel) n.setSelectionRange(sel[0], sel[1]); } catch (e) {}
      }
    }
    if (V.mount) V.mount(main, view);
    fitSeatNames(main);
    var after = this.afterRender;
    this.afterRender = [];
    after.forEach(function (fn) { fn(); });
  },
  viewKey: function (view) {
    return this.tab + ':' + view.v + ':' + (view.id || '');
  },
  renderHead: function (V, view, depth) {
    var left;
    if (depth > 1 || V.noTabs) {
      var t = esc(V.title ? V.title(view) : '');
      left = '<button class="icon-btn" data-act="back" aria-label="返回">' + icon('back') + '</button>' +
        (V.switcher ? '<button class="title grow ellipsis title-switch" data-act="switchItem" aria-label="切換事項"><span class="ellipsis">' + t + '</span><span class="caret">▾</span></button>' : '<div class="title grow ellipsis">' + t + '</div>');
    } else {
      var classes = Q.classes();
      var pick = V.classPicker && classes.length
        ? '<select class="class-pick" data-change="pickClass" aria-label="班級">' + UI.classOptions(this.classId) + '</select>'
        : '<span class="title">' + esc(V.title ? V.title(view) : '老師隨手記') + '</span>';
      left = '<span class="seal-logo">記</span>' + pick + '<span class="grow"></span>';
    }
    var sv = Sync.view();
    var s = sv.status;
    var n = sv.pending;
    // 同步狀態：燈號加文字（綠燈「已同步」），不用圖示，避免看起來像勾選框；手機寬度只留燈號（css 控制）
    var st = s === 'syncing' ? ['busy', '同步中'] : s === 'error' ? ['err', '同步失敗'] : s === 'offline' ? ['off', '離線'] : n ? ['wait', '待同步 ' + n] : s === 'synced' ? ['ok', '已同步'] : ['wait', '尚未同步'];
    var right = '<button class="sync-pill ' + st[0] + '" data-act="syncPanel" aria-label="同步狀態：' + st[1] + '" title="' + st[1] + '"><i class="lamp"></i><span>' + st[1] + '</span></button>';
    if (V.menu) right += '<button class="icon-btn" data-act="viewMenu" aria-label="更多">' + icon('more') + '</button>';
    if (!V.noGear) right += '<button class="icon-btn" data-act="openSettings" aria-label="設定">' + icon('gear') + '</button>';
    return left + right;
  }
};

/* ---------- 事件分派 ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = Act[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-change]');
  if (!el) return;
  var fn = Change[el.dataset.change];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-input]');
  if (!el) return;
  var fn = Change[el.dataset.input];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('keydown', function (e) {
  var el = e.target;
  if (e.key !== 'Enter' || e.isComposing || !el.dataset || !el.dataset.fk || !el.dataset.next) return;
  e.preventDefault();
  var all = Array.prototype.slice.call(document.querySelectorAll('[data-next="' + el.dataset.next + '"]'));
  var i = all.indexOf(el);
  if (all[i + 1]) all[i + 1].focus();
  else el.blur();
});
document.addEventListener('focusout', function () {
  setTimeout(function () {
    if (App._pending && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep)) {
      App._pending = false;
      App.render();
    }
  }, 0);
});

Act.tab = function (d) { App.setTab(d.tab); };
Act.back = function () { App.back(); };

Act.seg = function (d) { App.setUi(d.name, d.value); };
Act.go = function (d) { App.go(d.view, { id: d.id || null }); };
Act.openSettings = function () { App.go('settings'); };
Act.viewMenu = function (d, el) {
  var view = App.top();
  var V = Views[view.v];
  if (V.menu) UI.dropdown(el || document.querySelector('[data-act="viewMenu"]'), V.menu(view), { align: 'right', width: 280 });
};
Act.fab = function () {
  var V = Views[App.top().v];
  if (V.fab) V.fab(App.top())();
};
Gesture.on('fab', function () { quickAdd(); });
Change.pickClass = function (d, el) { App.setClass(el.value); };

Act.syncPanel = function () {
  var n = Sync.pending();
  var st = { synced: '已同步', syncing: '同步中…', error: '同步失敗', offline: '離線中', idle: '尚未同步' }[Sync.status];
  UI.sheet({
    title: '同步狀態',
    body: '<div class="kv"><span>狀態</span><b>' + st + '</b></div>' +
      '<div class="kv"><span>待同步筆數</span><b>' + n + '</b></div>' +
      (Sync.error ? '<div class="kv"><span>訊息</span><span class="red">' + esc(Sync.error) + '</span></div>' : '') +
      '<div class="kv"><span>上次同步</span><span>' + (DB.rev ? L.fmtStamp(DB.rev) : '—') + '</span></div>' +
      '<p class="dim">所有操作都會先存在這台裝置，約 2 秒後自動送到你的 Google 試算表；離線時會等連線後再送。</p>',
    actions: (ssOpenFailed() ? [{ label: '改用新檔', cls: 'danger', onClick: function () { setTimeout(resetDataFile, 0); } }] : [])
      .concat([{ label: '關閉' }, { label: '立即重試', cls: 'primary', onClick: function () { Sync.run(); } }])
  });
};

/* 資料試算表打不開（例如已被永久刪除）時，由老師確認後改用新的資料試算表 */
function ssOpenFailed() { return /無法開啟你的資料試算表/.test(Sync.error || ''); }
function resetDataFile() {
  UI.confirm('只有在原本的「老師隨手記資料」試算表已被永久刪除時才這樣做。會建立新的資料試算表，並把這台裝置上的資料重新上傳；原檔中只存在雲端的資料（例如封存紀錄）不會帶過來。', { title: '改用新的資料試算表？', ok: '改用新檔', danger: true }).then(function (yes) {
    if (!yes) return;
    var done = UI.busy('建立新的資料試算表…');
    Backend.call('resetDataFile').then(function () { return Sync.run({ full: true }); })
      .then(function () { done(); if (Sync.status === 'synced') UI.toast('已改用新的資料試算表'); else UI.error(Sync.error); if (!App.booted) location.reload(); })
      .catch(function (e) { done(); UI.error(e); });
  });
}

/* ---------- 快速新增（長按 ＋） ---------- */
function quickAdd() {
  UI.menu([
    { icon: 'flag', label: '快速登記學生', onClick: function () { App.openIn('today', 'quickLog'); } },
    { icon: 'leave', label: '登記學生請假', onClick: function () { App.openIn('leave'); } },
    { icon: 'check', label: '新增勾選事項', onClick: function () { createItemSheet('check'); } },
    { icon: 'score', label: '新增成績事項', onClick: function () { createItemSheet('score'); } },
    { icon: 'todo', label: '新增待辦', onClick: function () { todoSheet(); } },
    { icon: 'cal', label: '新增行事曆', onClick: function () { calSheet(); } }
  ], '快速新增');
}

/* ---------- PIN ---------- */
var Pin = {
  locked: false,
  conf: function () { return Settings.get('pin', { enabled: false }); },
  touch: function () { Prefs.set('lastActive', Date.now()); },
  shouldLock: function () {
    var c = this.conf();
    if (!c.enabled || !c.hash) return false;
    var last = Prefs.get('lastActive', 0);
    var mins = c.interval == null ? 5 : Number(c.interval);
    return Date.now() - last >= mins * 60000;
  },
  check: function () {
    if (!this.locked && this.shouldLock()) this.lock();
  },
  pad: function (title, sub, onDone, opts) {
    opts = opts || {};
    var el = document.createElement('div');
    el.className = 'lock';
    var code = '';
    var draw = function () {
      el.innerHTML = '<span class="seal-logo" style="width:56px;height:56px;font-size:34px;border-radius:10px">記</span>' +
        '<h2>' + esc(title) + '</h2><div class="dim">' + esc(sub || '') + '</div>' +
        '<div class="pin-dots">' + [0, 1, 2, 3].map(function (i) { return '<i class="' + (i < code.length ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="pin-pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-k="' + n + '">' + n + '</button>'; }).join('') +
        (opts.cancel ? '<button data-k="cancel" style="font-size:15px">取消</button>' : '<span></span>') + '<button data-k="0">0</button><button data-k="del" style="font-size:15px">刪除</button></div>' +
        (opts.forgot ? '<button class="btn" data-k="forgot" style="border:0;background:none;color:var(--red)">忘記 PIN？</button>' : '');
    };
    draw();
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-k]');
      if (!b) return;
      var k = b.dataset.k;
      if (k === 'cancel') { el.remove(); if (opts.onCancel) opts.onCancel(); return; }
      if (k === 'forgot') { opts.forgot(el); return; }
      if (k === 'del') code = code.slice(0, -1);
      else if (code.length < 4) code += k;
      UI.buzz(6);
      draw();
      if (code.length === 4) {
        var c = code;
        setTimeout(function () {
          onDone(c, function ok() { el.remove(); }, function fail(msg) {
            code = '';
            sub = msg || sub;
            draw();
            var dots = el.querySelector('.pin-dots');
            dots.classList.add('shake');
          });
        }, 120);
      }
    });
    document.body.appendChild(el);
    return el;
  },
  lock: function () {
    var self = this;
    this.locked = true;
    this.pad('請輸入 PIN', '', function (code, ok, fail) {
      var c = self.conf();
      sha256Hex(c.salt + code).then(function (h) {
        if (h === c.hash) { self.locked = false; self.touch(); ok(); }
        else { UI.buzz(80); fail('PIN 不正確'); }
      });
    }, {
      forgot: function (el) {
        UI.confirm('會以你目前登入的 Google 帳號確認身分並清除 PIN，需連上網路。', { title: '忘記 PIN', ok: '清除 PIN' }).then(function (yes) {
          if (!yes) return;
          var done = UI.busy('確認中…');
          Backend.call('resetPin').then(function (r) {
            done();
            Settings.set('pin', { enabled: false, asked: true });
            self.locked = false;
            el.remove();
            UI.toast('已清除 PIN（' + r.email + '）');
          }).catch(function (e) { done(); UI.error(e); });
        });
      }
    });
  },
  setup: function (then) {
    var self = this;
    this.pad('設定 PIN', '請輸入 4 位數字', function (first, ok) {
      ok();
      self.pad('再輸入一次', '確認 PIN', function (second, ok2, fail2) {
        if (second !== first) { fail2('兩次不一致，請重新輸入'); return; }
        var salt = uid();
        sha256Hex(salt + second).then(function (h) {
          var c = self.conf();
          Settings.set('pin', { enabled: true, asked: true, salt: salt, hash: h, interval: c.interval == null ? 5 : c.interval });
          self.touch();
          ok2();
          UI.toast('已開啟 PIN 保護');

var _touchThrottle = 0;

/* ---------- 計時器（全域，離開畫面仍會計時） ---------- */
var Timer = {
  total: 300,
  left: 300,
  running: false,
  endAt: 0,
  tick: null,
  ended: false,
  start: function () {
    Beep.prime();
    if (this.left <= 0) this.left = this.total;
    this.endAt = Date.now() + this.left * 1000;
    this.running = true;
    this.ended = false;
    var self = this;
    clearInterval(this.tick);
    this.tick = setInterval(function () { self.update(); }, 250);
  },
  pause: function () {
    this.update();
    this.running = false;
    clearInterval(this.tick);
  },
  reset: function () {
    this.running = false;
    this.ended = false;
    clearInterval(this.tick);
    this.left = this.total;
    this.paint();
  },
  set: function (sec) {
    this.total = Math.max(5, sec);
    this.reset();
  },
  update: function () {
    if (!this.running) return;
    this.left = Math.max(0, Math.round((this.endAt - Date.now()) / 1000));
    if (this.left === 0) {
      this.running = false;
      this.ended = true;
      clearInterval(this.tick);
      if (navigator.vibrate && Prefs.get('vibrate', true)) try { navigator.vibrate([400, 150, 400, 150, 800]); } catch (e) {}
      Beep.ring(4);
      UI.toast('時間到！', { ms: 5000 });
    }
    this.paint();
  },
  fmt: function (s) { return L.pad(Math.floor(s / 60)) + ':' + L.pad(s % 60); },
  paint: function () {
    var f = document.getElementById('timer-face');
    if (f) { f.textContent = this.fmt(this.left); f.classList.toggle('end', this.ended); }
    var b = document.getElementById('timer-toggle');
    if (b) b.textContent = this.running ? '暫停' : '開始';
    var mini = document.getElementById('timer-mini');
    if (mini) mini.textContent = this.running ? '倒數 ' + this.fmt(this.left) : '';
  }
};

/* ---------- 啟動 ---------- */
/* 外觀：預設淺色（宣紙）；可在設定「使用偏好 › 外觀」改成深色或跟隨系統 */
function themePref() { return Prefs.get('theme', 'light'); }
function isDark() {
  var t = themePref();
  return t === 'dark' || (t === 'auto' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
}
function applyTheme() {
  var t = themePref();
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', isDark() ? '#15171a' : '#f4ecd8');
}
if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (themePref() === 'auto') { applyTheme(); App.renderSoon(); } }); } catch (e) {}
}

function boot() {
  applyTheme();
  App.init();
  Gesture.init();
  document.getElementById('app').innerHTML = '<div class="loading"><span class="seal-logo">記</span><div class="serif">老師隨手記</div><div class="dim" id="boot-msg">載入中…</div></div>';
  LocalStore.load().then(function (data) {
    DB.loadFrom(data);
    DB.onChange(function () { App.renderSoon(); });
    Sync.listeners.push(function () { App.renderSoon(); });
    App.tab = Settings.get('defaultTab', 'today');
    if (!App.stacks[App.tab]) App.tab = 'today';
    Sync.ready = true;
    var hadLocal = DB.hasData() && DB.rev;
    if (hadLocal) {
      App.booted = true;
      App.render();
      Pin.check();
      Sync.run().then(afterFirstSync);
    } else {
      document.getElementById('boot-msg').textContent = '第一次使用，正在準備你的資料試算表…';
      Sync.run({ full: true }).then(function () {
        if (!DB.rev) {
          document.getElementById('boot-msg').innerHTML = '無法連線：' + esc(Sync.error) + '<br><button class="btn" onclick="location.reload()" style="margin-top:12px">重新整理</button>' +
            (ssOpenFailed() ? ' <button class="btn" onclick="resetDataFile()" style="margin-top:12px">改用新的資料試算表</button>' : '');
          return;
        }
        App.booted = true;
        App.render();
        Pin.check();
        afterFirstSync();
      });
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { if (!Pin.locked) Pin.touch(); }
    else { Pin.check(); Sync.schedule(0); Timer.update(); }
  });
  window.addEventListener('online', function () { Sync.schedule(0); });
  window.addEventListener('offline', function () { Sync.setStatus('offline'); });
}

function afterFirstSync() {
  if (!App.booted) { App.booted = true; App.render(); }
  // 第一次（或更新後第一次）同步完成才放內建範本，避免沒同步到別台已刪掉的設定
  if (Sync.status !== 'error' && Sync.status !== 'offline') seedTemplates();
  setTimeout(function () {
    if (!Pin.locked) Pin.askFirstTime();
  }, 600);
  Backend.call('checkVersion').then(function (v) {
    App.versionInfo = v;
    if (v && v.latest && v.latest !== v.current) App.renderSoon();
  }).catch(function () {});
}

          el.querySelector('#ci-amt-wrap').style.display = o.amount ? '' : 'none';
        }
        if (el.querySelector('#ci-max')) el.querySelector('#ci-max').value = o.max || Pref.maxScore();
      });
    }
  });
}

/* ---------- 事項共用選單 ---------- */
function itemMenu(item, extra) {
  return (extra || []).concat([
    { icon: 'edit', label: '修改標題', onClick: function () {
      UI.prompt('修改標題', item.title).then(function (v) { if (v) DB.update('items', item.id, { title: v }); });
    } },
    { icon: 'star', label: '存成範本', onClick: function () {
      UI.prompt('範本名稱', item.title.replace(/^\d\d\/\d\d\s*/, '')).then(function (v) {
        if (!v) return;
        var o = item.opts || {};
        DB.put('templates', { id: uid(), name: v, type: item.type, opts: { amount: !!o.amount, defaultAmount: o.defaultAmount || '', max: o.max || null }, order: Date.now() });
        UI.toast('已存成範本');
      });
    } },
    { icon: 'archive', label: '歸檔', onClick: function () {
      UI.confirm('歸檔後不會出現在清單中，可在「已歸檔事項」查詢或還原。', { title: '歸檔「' + esc(item.title) + '」？', ok: '歸檔' }).then(function (yes) {
        if (!yes) return;
        DB.update('items', item.id, { archived: true, archivedAt: Date.now() });
        App.back();
        UI.undo('已歸檔「' + item.title + '」', function () { unarchiveItem(item.id); });
      });
    } }
  ]);
}

/* 取消歸檔：還沒同步就直接改回；已同步並從這台裝置移除時，請伺服器還原後重新拉取 */
function unarchiveItem(id) {
  if (DB.get('items', id)) { DB.update('items', id, { archived: false, archivedAt: null }); return; }
  var done = UI.busy('還原中…');
  Sync.run().then(function () { return Backend.call('restoreItem', { id: id }); }).then(function () { return Sync.run(); })
    .then(function () { done(); UI.toast('已還原'); })
    .catch(function (e) { done(); UI.error(e); });
}

/* ---------- 修改標題：在事項頁標題的下拉清單裡，點事項旁的筆形圖示就能改 ---------- */
function renameItemTitle(id) {
  var item = DB.get('items', id);
  if (!item) return;
  UI.prompt('修改事項標題', item.title, { ok: '儲存' }).then(function (v) {
    if (v && v !== item.title) { DB.update('items', item.id, { title: v }); UI.toast('已修改標題'); }
  });
}

/* ---------- 快速切換：在事項頁點標題，下拉選擇同一分頁的其他事項；每個事項旁可直接改名 ---------- */
function itemProgress(i) {
  var ids = Q.rosterOf(i).filter(function (s) { return !s.out; }).map(function (s) { return s.id; });
  if (i.type === 'check') {
    var st = L.checkStats(ids, Q.checkMap(i.id));
    return st.undone ? '未勾 ' + st.undone + ' 人' : '全部完成';
  }
  var ss = L.scoreStats(ids, Q.scoreMap(i.id));
  return ss.entered < ss.total ? '未登記 ' + (ss.total - ss.entered) + ' 人' : '平均 ' + (ss.avg == null ? '—' : ss.avg);
}
Act.switchItem = function (d, el) {

  if (Views[view.v].switchMenu) { Views[view.v].switchMenu(view, el || document.querySelector('.title-switch')); return; }
  var cur = DB.get('items', view.id);
  if (!cur) return;
  var types = [cur.type];
  var list = [];
  types.forEach(function (t) { list = list.concat(Q.items(t, cur.classId)); });
  UI.dropdown(el || document.querySelector('.title-switch'), list.map(function (i) {
    return {
      icon: i.type === 'check' ? 'check' : 'score',
      label: i.title,
      sub: itemProgress(i),
      current: i.id === cur.id,
      edit: function () { renameItemTitle(i.id); },
      onClick: function () {
        if (i.id === cur.id) return;
        App.replace(TYPE_VIEW[i.type], { id: i.id });
        App.mainEl().scrollTop = 0;

/* ============ 勾選表 ============ */
function setCheck(item, sid, checked) {
  var id = item.id + ':' + sid;
  var cur = DB.raw('checks', id);
  var amount = cur && cur.amount != null ? cur.amount : '';
  if (checked && (amount === '' || amount == null) && item.opts && item.opts.amount && item.opts.defaultAmount) amount = item.opts.defaultAmount;
  DB.put('checks', { id: id, itemId: item.id, studentId: sid, checked: checked, checkedAt: checked ? Date.now() : null, amount: amount });
}

Act.toggleCheck = function (d, el, e) {
  if (e && e.target.closest('input')) return;
  var item = DB.get('items', d.item);
  var s = Q.student(d.sid);
  if (!item || !s) return;
  var id = item.id + ':' + d.sid;
  var prev = DB.raw('checks', id);
  var checked = !(prev && prev.checked && !prev.deleted);
  setCheck(item, d.sid, checked);
  UI.buzz(checked ? 15 : 8);
  if (checked) App.afterRender.push(function () { UI.sealPop(document.querySelector('[data-pop="' + d.sid + '"]')); });
  UI.undo((checked ? '已勾選 ' : '已取消 ') + s.no + ' 號', function () { restoreRec('checks', id, prev); });
};

function bulkCheck(item, sids, mode) {
  var cm = Q.checkMap(item.id);
  var prevs = sids.map(function (sid) { return [sid, DB.raw('checks', item.id + ':' + sid)]; });
  sids.forEach(function (sid) {
    var on = cm[sid] && cm[sid].checked;
    var want = mode === 'all' ? true : mode === 'none' ? false : !on;
    if (!!on !== want) setCheck(item, sid, want);
  });
  UI.buzz(20);
  return function () { prevs.forEach(function (p) { restoreRec('checks', item.id + ':' + p[0], p[1]); }); };
}

Act.checkGroup = function (d) {
  var item = DB.get('items', d.item);
  var sids = d.sids.split(',');
  var cm = Q.checkMap(item.id);
  var allOn = sids.every(function (sid) { return cm[sid] && cm[sid].checked; });
  var undo = bulkCheck(item, sids, allOn ? 'none' : 'all');
  UI.undo((allOn ? '已取消 ' : '已勾選 ') + d.name + ' 全組', undo);
};

Change.amount = function (d, el) {
  var item = DB.get('items', d.item);
  var id = item.id + ':' + d.sid;
  var cur = DB.raw('checks', id);
  var v = el.value.trim();
  if (v !== '' && isNaN(Number(v))) { UI.toast('請輸入數字'); el.value = cur ? cur.amount : ''; return; }
  DB.put('checks', Object.assign({ id: id, itemId: item.id, studentId: d.sid, checked: false, checkedAt: null }, cur || {}, { amount: v, deleted: false }));
};

function checkRow(item, s, c, detail) {
  var on = c && c.checked;
  return '<li class="stu ' + (on ? 'done ' : '') + (s.out ? 'out' : '') + '" data-act="toggleCheck" data-item="' + item.id + '" data-sid="' + s.id + '" data-lp="stu">' +
    '<span class="no">' + s.no + '</span><span class="name">' + esc(s.name) + (s.out ? ' <span class="tag">轉出</span>' : Leave.mark(s.id, item.date)) + '</span>' +
    (detail && on ? '<span class="time">' + L.fmtStamp(c.checkedAt) + '</span>' : '') +
    (item.opts && item.opts.amount ? '<input class="input num" inputmode="decimal" placeholder="金額" data-change="amount" data-item="' + item.id + '" data-sid="' + s.id + '" data-fk="amt:' + s.id + '" data-next="amt" value="' + esc(c && c.amount != null ? c.amount : '') + '">' : '') +
    '<span class="box" data-pop="' + s.id + '">' + (on ? '<span class="seal' + (Pref.seal().length > 1 ? ' two' : '') + '">' + esc(Pref.seal()) + '</span>' : '') + '</span></li>';
}

/* 座位表：以老師站在講台看學生的視角呈現。講台在最下面，最靠近講台的是第 1 橫排（row 0），
   離講台最遠的是最後一橫排；從老師看過去最左邊是第 1 直行（col 0）。預設 6 橫排 × 7 直行。
   opts.adjust：在座位表下方放「調整座位」按鈕 */
var SEAT_ROWS = 6;
var SEAT_COLS = 7;
function seatGridHtml(classId, students, cellFn, opts) {
  opts = opts || {};
  var cls = DB.get('classes', classId);
  var rows = (cls && cls.seatRows) || SEAT_ROWS;
  var cols = (cls && cls.seatCols) || SEAT_COLS;
  var byPos = {};
  var placed = {};
  var ids = {};
  students.forEach(function (s) { ids[s.id] = s; });
  DB.where('seats', function (x) { return x.classId === classId; }).forEach(function (x) {
    if (ids[x.studentId] && x.row < rows && x.col < cols) { byPos[x.row + ',' + x.col] = ids[x.studentId]; placed[x.studentId] = true; }
  });
  var tpl = 'grid-template-columns:repeat(' + cols + ',minmax(0,1fr))';
  var h = '<div class="seat-wrap"><div class="seat-rows" style="grid-template-rows:repeat(' + rows + ',minmax(0,1fr))">';
  for (var rr = rows - 1; rr >= 0; rr--) h += '<span>' + (rr + 1) + '<br>排</span>';
  h += '</div><div class="seats" style="' + tpl + '">';
  for (var r = rows - 1; r >= 0; r--) for (var c = 0; c < cols; c++) h += cellFn(byPos[r + ',' + c], r, c);
  h += '</div><div class="seat-cols" style="' + tpl + '">';
  for (var cc = 0; cc < cols; cc++) h += '<span>第 ' + (cc + 1) + ' 行</span>';
  h += '</div><div class="podium">講　台</div></div>';
  if (opts.adjust) h += '<div class="seat-tools"><span class="dim grow">從講台看學生：最下面是第 1 排</span><button class="btn small primary" data-act="go" data-view="seats" data-id="' + classId + '">' + icon('seat') + '調整座位</button></div>';
  var rest = students.filter(function (s) { return !placed[s.id]; });
  return { html: h, rest: rest };
}

Views.checkItem = {
  switcher: true,
  title: function (v) { var i = DB.get('items', v.id); return i ? i.title : ''; },
  menu: function (v) {
    var item = DB.get('items', v.id);
    if (!item) return [];
    var sids = Q.rosterOf(item).filter(function (s) { return !s.out; }).map(function (s) { return s.id; });
    return itemMenu(item, [
      { icon: 'checkAll', label: '全部勾選', onClick: function () { UI.undo('已全部勾選', bulkCheck(item, sids, 'all')); } },
      { icon: 'invert', label: '反向勾選', onClick: function () { UI.undo('已反向勾選', bulkCheck(item, sids, 'invert')); } },
      { icon: 'money', label: item.opts && item.opts.amount ? '關閉金額欄' : '開啟金額欄', onClick: function () {
        DB.update('items', item.id, { opts: Object.assign({}, item.opts, { amount: !(item.opts && item.opts.amount) }) });
      } },
      { icon: 'users', label: '以組為單位…', onClick: function () { pickGroupPlan(item); } }
    ]);
  },
  render: function (v) {
    var item = DB.get('items', v.id);
    if (!item) return '<div class="empty">這個事項已歸檔或刪除</div>';
    var students = Q.rosterOf(item);
    var active = students.filter(function (s) { return !s.out; });
    var cm = Q.checkMap(item.id);
    var st = L.checkStats(active.map(function (s) { return s.id; }), cm);
    var filter = App.ui.checkFilter || 'all';
    var mode = App.ui.checkMode || 'list';
    var detail = !!App.ui.checkDetail;
    var h = '<div class="card"><div class="stats" style="grid-template-columns:repeat(' + (item.opts && item.opts.amount ? 3 : 2) + ',1fr)">' +
      '<div><div class="v">' + st.done + '<span class="dim"> / ' + st.total + '</span></div><div class="k">已勾選</div></div>' +
      '<div><div class="v">' + st.undone + '</div><div class="k">未勾選</div></div>' +
      (item.opts && item.opts.amount ? '<div><div class="v">' + st.amount + '</div><div class="k">金額合計</div></div>' : '') +
      '</div><div class="progress"><i style="width:' + (st.total ? (st.done / st.total) * 100 : 0) + '%"></i></div>' +
      '<div class="card-foot">' + '<button class="btn small" data-act="parentMsg" data-item="' + item.id + '">' + icon('msg') + '家長訊息</button>' + '</div></div>';
    h += '<div class="toolbar">' + UI.seg('checkFilter', [['all', '全體'], ['on', '已勾選'], ['off', '未勾選']], filter) +
      UI.seg('checkMode', [['list', icon('list') + '清單'], ['seat', icon('seat') + '座位']], mode) +
      '<button class="btn small ' + (detail ? 'primary' : '') + '" data-act="seg" data-name="checkDetail" data-value="' + (detail ? '' : '1') + '">' + icon('eye') + '明細</button></div>';
    var pass = function (s) {
      var on = cm[s.id] && cm[s.id].checked;
      return filter === 'all' || (filter === 'on' ? on : !on);
    };
    if (mode === 'seat') {
      var g = seatGridHtml(item.classId, students, function (s, r, c) {
        if (!s || !pass(s)) return '<div class="seat empty"></div>';
        var on = cm[s.id] && cm[s.id].checked;
        return '<div class="seat ' + (on ? 'done' : '') + (Leave.onDay(item.date)[s.id] ? ' leave' : '') + '" data-act="toggleCheck" data-item="' + item.id + '" data-sid="' + s.id + '" data-lp="stu"><span class="sno">' + s.no + '</span><span class="sn">' + esc(s.name) + '</span>' +
          (detail && on ? '<span class="sno">' + L.hm(cm[s.id].checkedAt) + '</span>' : '') + '</div>';
      }, { adjust: true });
      h += g.html;
      var rest = g.rest.filter(pass);
      if (rest.length) {
        h += '<div class="section-label">未安排座位</div><div class="chips">' + rest.map(function (s) {
          var on = cm[s.id] && cm[s.id].checked;
          return '<button class="chip ' + (on ? 'on' : '') + '" data-act="toggleCheck" data-item="' + item.id + '" data-sid="' + s.id + '" data-lp="stu">' + s.no + ' ' + esc(s.name) + '</button>';
        }).join('') + '</div>';
      }
      if (!DB.where('seats', function (x) { return x.classId === item.classId; }).length) {
        h += '<div class="empty">尚未安排座位，按上面的「調整座位」安排。</div>';
      }
      return h;
    }
    var plan = item.opts && item.opts.groupPlanId && DB.get('groups', item.opts.groupPlanId);
    if (plan) {
      var inRoster = {};
      students.forEach(function (s) { inRoster[s.id] = s; });
      var seen = {};
      (plan.groups || []).forEach(function (grp, gi) {
        var members = grp.map(function (id) { return inRoster[id]; }).filter(Boolean).sort(L.byNo);
        members.forEach(function (s) { seen[s.id] = true; });
        if (!members.length) return;
        var done = members.filter(function (s) { return cm[s.id] && cm[s.id].checked; }).length;
        var name = '第 ' + (gi + 1) + ' 組';
        h += '<div class="group-head"><b>' + name + '</b><span class="dim">' + done + ' / ' + members.length + '</span><button class="btn small right" data-act="checkGroup" data-item="' + item.id + '" data-name="' + name + '" data-sids="' + members.map(function (s) { return s.id; }).join(',') + '">' + (done === members.length ? '整組取消' : '整組勾選') + '</button></div>';
        h += '<ul class="roster">' + members.filter(pass).map(function (s) { return checkRow(item, s, cm[s.id], detail); }).join('') + '</ul>';
      });
      var others = students.filter(function (s) { return !seen[s.id]; });
      if (others.length) h += '<div class="group-head"><b>未分組</b></div><ul class="roster">' + others.filter(pass).map(function (s) { return checkRow(item, s, cm[s.id], detail); }).join('') + '</ul>';
      return h;
    }
    var list = students.filter(pass);
    h += list.length ? '<ul class="roster">' + list.map(function (s) { return checkRow(item, s, cm[s.id], detail); }).join('') + '</ul>' : '<div class="empty">沒有符合的學生</div>';
    h += '<p class="dim center">點整列即勾選；<span class="only-touch">長按</span><span class="only-mouse">按右鍵或按住</span>學生可看勾選時間與個人明細</p>';
    return h;
  }
};

function pickGroupPlan(item) {

    }))

/* ============ 成績登記表 ============ */
Change.score = function (d, el) {
  var item = DB.get('items', d.item);
  var max = (item.opts && item.opts.max) || 100;
  var id = item.id + ':' + d.sid;
  var cur = DB.raw('scores', id);
  var v = el.value.trim();
  if (v !== '') {
    var n = Number(v);
    if (isNaN(n)) { UI.toast('請輸入數字'); el.value = cur && !cur.absent ? cur.score : ''; return; }
    if (n < 0 || n > max) { UI.toast('分數需在 0 到 ' + max + ' 之間'); el.value = cur && !cur.absent ? cur.score : ''; return; }
  }
  if (cur && !cur.deleted && String(cur.score) === v && !cur.absent) return;
  DB.put('scores', { id: id, itemId: item.id, studentId: d.sid, score: v, absent: false });
};
Act.absent = function (d) {
  var id = d.item + ':' + d.sid;
  var cur = DB.raw('scores', id);
  var on = !(cur && cur.absent && !cur.deleted);
  DB.put('scores', { id: id, itemId: d.item, studentId: d.sid, score: on ? '' : (cur && cur.score) || '', absent: on });
  UI.buzz(8);
};

    var h = '<div class="card"><div class="stats"><div><div class="v">' + f(st.avg) + '</div><div class="k">平均</div></div><div><div class="v">' + f(st.max) + '</div><div class="k">最高</div></div>' +
      '<div><div class="v">' + f(st.min) + '</div><div class="k">最低</div></div><div><div class="v">' + st.entered + '<span class="dim">/' + st.total + '</span></div><div class="k">已登記</div></div></div>' +
      '<div class="dim center" style="margin-top:6px">滿分 ' + ((item.opts && item.opts.max) || 100) + (st.absent ? '　缺考 ' + st.absent + ' 人（不計入）' : '') + '</div>' +

function completeTodo(id) {
  var t = DB.get('todos', id);
  if (!t) return;
  var prev = Object.assign({}, t);
  if (!t.done) {
    var patch = { done: true, doneAt: Date.now() };
    var next = null;
    if (t.repeat && t.repeat.type && t.repeat.type !== 'none' && !t.nextId) {
      var nd = L.nextDue(t.repeat, t.due || L.today(), t.occurrence || 1);
      if (nd) {
        next = DB.put('todos', { id: uid(), text: t.text, due: nd, classId: t.classId, repeat: t.repeat, occurrence: (t.occurrence || 1) + 1, done: false });
        patch.nextId = next.id;
      }
    }
    DB.update('todos', id, patch);
    UI.buzz(15);
    UI.undo(next ? '已完成，下一次：' + L.md(next.due) : '已完成「' + t.text.slice(0, 12) + '」', function () {
      DB.put('todos', prev);
      if (next) DB.del('todos', next.id);
    });
  } else {
    var nx = t.nextId && DB.get('todos', t.nextId);
    DB.update('todos', id, { done: false, doneAt: null, nextId: nx && !nx.done ? '' : t.nextId });
    if (nx && !nx.done) DB.del('todos', nx.id);
  }
}

function repeatFields(rep) {

    }).join('') + '</select></label>' +

      return '<label class="chip ' + (days.indexOf(n) >= 0 ? 'on' : '') + '"><input type="checkbox" value="' + n + '" ' + (days.indexOf(n) >= 0 ? 'checked' : '') + ' hidden>週' + L.WEEK[n] + '</label>';
    }).join('') + '</div></div>' +
    '<label class="field rep-monthly"><span>每月幾號</span><input class="input" id="td-mday" inputmode="numeric" value="' + (rep.monthDay || '') + '" placeholder="預設為期限當天"></label>' +
    '<div class="field rep-every"><span>每隔</span><div class="row"><input class="input" id="td-n" inputmode="numeric" value="' + (rep.n || 2) + '" style="width:90px"><select class="input" id="td-unit" style="width:100px"><option value="day"' + (rep.unit !== 'week' ? ' selected' : '') + '>天</option><option value="week"' + (rep.unit === 'week' ? ' selected' : '') + '>週</option></select></div></div>' +
    '<div class="field rep-end"><span>結束</span><select class="input" id="td-end">' +
    [['never', '永不結束'], ['count', '重複幾次後結束'], ['until', '到某個日期為止']].map(function (o) {
      return '<option value="' + o[0] + '"' + (end.type === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select>' +
    '<input class="input end-count" id="td-count" inputmode="numeric" placeholder="次數" value="' + (end.count || 10) + '" style="margin-top:6px">' +
    '<input class="input end-until" id="td-until" type="date" value="' + (end.until || '') + '" style="margin-top:6px"></div>';
}
function readRepeat(el) {
  var type = el.querySelector('#td-rep').value;
  if (type === 'none') return { type: 'none' };
  var rep = { type: type };
  if (type === 'weekly') rep.days = Array.prototype.map.call(el.querySelectorAll('.rep-weekly input:checked'), function (i) { return Number(i.value); });
  if (type === 'monthly' && el.querySelector('#td-mday').value) rep.monthDay = Math.min(31, Math.max(1, Number(el.querySelector('#td-mday').value)));
  if (type === 'every') { rep.n = Math.max(1, Number(el.querySelector('#td-n').value) || 1); rep.unit = el.querySelector('#td-unit').value; }
  var et = el.querySelector('#td-end').value;
  rep.end = { type: et };
  if (et === 'count') rep.end.count = Math.max(1, Number(el.querySelector('#td-count').value) || 1);
  if (et === 'until') rep.end.until = el.querySelector('#td-until').value;
  return rep;
}
function bindRepeat(el) {
  var sync = function () {
    var t = el.querySelector('#td-rep').value;
    el.querySelector('.rep-weekly').style.display = t === 'weekly' ? '' : 'none';
    el.querySelector('.rep-monthly').style.display = t === 'monthly' ? '' : 'none';
    el.querySelector('.rep-every').style.display = t === 'every' ? '' : 'none';
    el.querySelector('.rep-end').style.display = t === 'none' ? 'none' : '';
    var e = el.querySelector('#td-end').value;
    el.querySelector('.end-count').style.display = e === 'count' ? '' : 'none';
    el.querySelector('.end-until').style.display = e === 'until' ? '' : 'none';
  };
  el.querySelector('#td-rep').addEventListener('change', sync);
  el.querySelector('#td-end').addEventListener('change', sync);
  el.querySelectorAll('.rep-weekly label').forEach(function (lb) {
    lb.addEventListener('click', function (e) {
      e.preventDefault();
      var cb = lb.querySelector('input');
      cb.checked = !cb.checked;
      lb.classList.toggle('on', cb.checked);
    });
  });
  sync();
}

        el.querySelector('#cs-end-f').style.display = dayType === 'off' ? '' : 'none';

        if (dayType) { cb.checked = true; tm.disabled = true; }
      });
      cb.addEventListener('change', function () {
        tm.disabled = cb.checked;
        if (!cb.checked && !tm.value) tm.value = '08:00';

Change.semDate = function (d, el) {
  var m = el.value.trim().match(/^(\d{1,2})[\/\-.月](\d{1,2})日?$/);

  var dd = m && Number(m[2]);
  if (!m || mm < 1 || mm > 12 || dd < 1 || dd > 31) {
    UI.toast('請輸入月/日，例如 08/01');
    el.value = (d.key === 'sem1' ? Pref.sem1() : Pref.sem2()).replace('-', '/');
    return;

  var v = L.pad(mm) + '-' + L.pad(dd);

function addStudents(classId, list) {
  var have = {};
  Q.students(classId, true).forEach(function (s) { have[s.no] = true; });
  var added = 0;
  var skipped = 0;
  list.forEach(function (x) {
    if (have[x.no]) { skipped++; return; }
    have[x.no] = true;
    DB.put('students', { id: uid(), classId: classId, no: x.no, name: x.name, out: false });
    added++;
  });
  UI.toast('已加入 ' + added + ' 位學生' + (skipped ? '，' + skipped + ' 筆座號重複已略過' : ''));
}
/* 貼上名單：每行一個姓名，座號依貼上的順序自動編號（班上已有學生時接在最後一號後面）。
   如果每行前面已有座號（從 Excel 兩欄一起複製），座號會忽略，只取姓名。 */
function parseNames(text, startNo) {
  var no = startNo || 1;
  return text.split(/\r?\n/).map(function (line) {
    var name = line.replace(/^\s*\d+[\s\t,，、.．:：]+/, '').replace(/\s+/g, ' ').trim();
    return name ? { no: no++, name: name } : null;
  }).filter(Boolean);
}
function nextNo(classId) {
  return Q.students(classId, true).reduce(function (m, s) { return Math.max(m, s.no || 0); }, 0) + 1;
}

/* ============ 座位表安排 ============ */
function seatAt(classId) {
  var pos = {};
  var of = {};
  DB.where('seats', function (x) { return x.classId === classId; }).forEach(function (x) { pos[x.row + ',' + x.col] = x.studentId; of[x.studentId] = x; });
  return { pos: pos, of: of };
}
function placeSeat(classId, sid, r, c) {
  var m = seatAt(classId);
  var mine = m.of[sid];
  var other = r >= 0 ? m.pos[r + ',' + c] : null;
  if (other && other !== sid) {
    if (mine) DB.put('seats', { id: classId + ':' + other, classId: classId, studentId: other, row: mine.row, col: mine.col });
    else DB.del('seats', classId + ':' + other);
  }
  if (r < 0) DB.del('seats', classId + ':' + sid);
  else DB.put('seats', { id: classId + ':' + sid, classId: classId, studentId: sid, row: r, col: c });
}
Views.seats = {
  title: function (v) { return Q.className(v.id) + ' 座位表'; },
  render: function (v) {
    var c = DB.get('classes', v.id);

      '<button class="btn small" data-act="seatAuto" data-id="' + c.id + '">依座號排入</button><button class="btn small" data-act="seatClear" data-id="' + c.id + '">清空</button></div>' +
      '<p class="dim" style="margin:-4px 2px 8px">以老師站在講台看學生的方向排列：講台在下面，最靠近講台的是第 1 排，最左邊是第 1 行。</p>';
    var g = seatGridHtml(c.id, students, function (s, r, col) {
      return '<div class="seat ' + (s ? '' : 'empty ') + (s && pick === s.id ? 'picked' : '') + '" data-drop="1" data-r="' + r + '" data-c="' + col + '" data-act="seatTap" data-class="' + c.id + '"' + (s ? ' data-drag="1" data-sid="' + s.id + '"' : '') + '>' +

      g.rest.map(function (s) {
        return '<span class="chip ' + (pick === s.id ? 'on' : '') + '" data-drag="1" data-sid="' + s.id + '" data-act="seatTap" data-class="' + c.id + '" data-r="-1" data-c="-1">' + s.no + ' ' + esc(s.name) + '</span>';

/* ============ 快速範本 ============ */
/* 內建範本：依中學老師常見情境預先放好，老師可以改名、改設定或刪除。
   id 固定，兩台裝置同時第一次開啟也不會重複；放過一次就記在設定 tplSeeded，刪掉的不會再自己出現。 */
var DEFAULT_TEMPLATES = [
  { id: 'tpl-hw', name: '收作業', type: 'check', opts: {} },
  { id: 'tpl-book', name: '收聯絡簿', type: 'check', opts: {} },
  { id: 'tpl-slip', name: '收回條', type: 'check', opts: {} },

  { id: 'tpl-quiz', name: '小考', type: 'score', opts: { max: 100 } },
  { id: 'tpl-hwscore', name: '作業成績', type: 'score', opts: { max: 100 } },

/* 補上還沒有的內建範本（同類型已有同名範本就跳過）；回傳補上的數量 */
function addDefaultTemplates() {
  var have = {};
  Q.templates().forEach(function (t) { have[t.type + ':' + t.name] = true; });
  var base = Date.now();
  var n = 0;
  DEFAULT_TEMPLATES.forEach(function (d, i) {
    if (have[d.type + ':' + d.name]) return;
    DB.put('templates', Object.assign({}, d, { opts: Object.assign({}, d.opts), order: base + i, deleted: false }));
    n++;
  });
  return n;
}
function seedTemplates() {
  if (Settings.get('tplSeeded', false)) return;

  Settings.set('tplSeeded', true);
}

Act.tplMove = function (d) {
  var t = DB.get('templates', d.id);
  if (!t) return;
  var list = Q.templates().filter(function (x) { return x.type === t.type; });
  var i = list.indexOf(t);
  if (i < 0) i = list.map(function (x) { return x.id; }).indexOf(t.id);
  var j = i + Number(d.d);
  if (j < 0 || j >= list.length) return;
  var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
  // 依新順序重新編號，避免舊資料的 order 相同時換不動
  list.forEach(function (x, k) { if (x.order !== k + 1) DB.update('templates', x.id, { order: k + 1 }); });

function localRange(classId) {
  var items = DB.where('items', function (i) { return i.classId === classId && !i.archived && TYPE_TAB[i.type]; });
  var ids = {};
  items.forEach(function (i) { ids[i.id] = true; });
  var pick = function (t) { return DB.where(t, function (r) { return ids[r.itemId]; }); };
  return { items: items, checks: pick('checks'), events: pick('events'), scores: pick('scores'), local: true };
}
/* 伺服器資料只用來補上已歸檔事項；未歸檔事項一律用本機最新資料 */
function mergeRange(server, local) {
  if (!server) return local;
  var have = {};
  local.items.forEach(function (i) { have[i.id] = true; });
  var extra = server.items.filter(function (i) { return !have[i.id]; });
  var ex = {};
  extra.forEach(function (i) { ex[i.id] = true; });
  var pick = function (t) { return local[t].concat(server[t].filter(function (r) { return ex[r.itemId]; })); };
  return { items: local.items.concat(extra), checks: pick('checks'), events: pick('events'), scores: pick('scores'), local: false };
}
function fetchRangeCached(key, payload) {
  if (App.cache[key] || App.cache[key + ':loading'] || !online()) return;
  App.cache[key + ':loading'] = true;
  Backend.call('fetchRange', payload).then(function (r) {
    App.cache[key] = r;
    App.renderSoon();
  }).catch(function () {}).then(function () { App.cache[key + ':loading'] = false; });
}

function b64ToFile(b64, name) {
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, { type: 'application/pdf' });
}
/* 匯出後的說明：GAS 版存在雲端硬碟；網頁版沒連雲端時只下載到這台裝置（r.note 為空字串） */
function exportNote(r) {
  return r.note == null ? '已存到雲端硬碟「老師隨手記匯出」資料夾' : r.note || '可下載到這台裝置或直接分享';
}
/* 分享 PDF 檔本身；無法分享時（例如 App 所在的框架不允許）改存到這台裝置。
   不分享雲端硬碟連結：那是老師私人的檔案，家長打不開，也不該被改成公開。 */
function sharePdf(r) {
  var file = null;
  try { file = b64ToFile(r.base64, r.name); } catch (e) {}
  var fallback = function () {
    if (!file) { UI.toast('無法分享，PDF 已存在雲端硬碟「老師隨手記匯出」'); return; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = r.name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    UI.toast('已下載 PDF，請從手機的「檔案」分享給家長');
  };
  if (file && navigator.canShare && navigator.share) {
    var ok = false;
    try { ok = navigator.canShare({ files: [file] }); } catch (e) {}
    if (ok) {
      navigator.share({ files: [file], title: r.name }).catch(function (err) { if (!err || err.name !== 'AbortError') fallback(); });
      return;
    }
  }
  fallback();
}

/* ============ 隨機抽籤 ============ */
function drawKey(cls, mode, plan) { return 'drawn:' + cls + ':' + mode + ':' + (plan || ''); }
Views.draw = {
  title: function () { return '隨機抽籤'; },
  render: function () {
    var cls = App.cls();
    if (!cls) return noClassCard();
    var mode = App.ui.drawMode || 'person';
    var plans = Q.groupPlans(cls.id);
    var plan = mode === 'group' ? (DB.get('groups', App.ui.drawPlan) || plans[0]) : null;
    var noRepeat = App.ui.drawNoRepeat !== false;
    var drawn = Prefs.get(drawKey(cls.id, mode, plan && plan.id), []);
    var pool = mode === 'group' ? (plan ? plan.groups.map(function (g, i) { return String(i); }) : []) : Q.students(cls.id).map(function (s) { return s.id; });
    var left = noRepeat ? pool.filter(function (x) { return drawn.indexOf(x) < 0; }) : pool;
    var last = App.ui.drawLast;
    var h = '<div class="toolbar">' + UI.seg('drawMode', [['person', '抽個人'], ['group', '以組為單位']], mode) + '</div>';
    if (mode === 'group') {
      if (!plans.length) return h + '<div class="empty">還沒有分組方案<br><button class="btn small" data-act="go" data-view="groups">建立分組</button></div>';
      h += '<select class="input" data-change="drawPlan" style="margin-bottom:10px">' + plans.map(function (p) { return '<option value="' + p.id + '"' + (plan && p.id === plan.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select>';
    }
    var lastHtml = '&nbsp;';
    if (last && last.cls === cls.id && last.mode === mode) {
      if (mode === 'group' && plan) {
        var g = plan.groups[Number(last.id)] || [];
        lastHtml = '<div class="draw-no">第 ' + (Number(last.id) + 1) + ' 組</div><div style="font-size:18px">' + g.map(function (id) { var s = Q.student(id); return s ? esc(s.name) : ''; }).join('、') + '</div>';
      } else {
        var s = Q.student(last.id);
        if (s) lastHtml = '<div class="draw-no">' + s.no + ' 號</div><div class="draw-name">' + esc(s.name) + '</div>';
      }
    }
    h += '<div class="card draw-box"><div id="draw-out">' + lastHtml + '</div>' +
      '<button class="btn primary" style="min-width:160px;margin-top:14px;font-size:18px" data-act="doDraw"' + (left.length ? '' : ' disabled') + '>' + icon('dice') + (left.length ? '抽一' + (mode === 'group' ? '組' : '位') : '全部抽過了') + '</button></div>';
    h += '<label class="check-line"><input type="checkbox" data-change="drawNoRepeat"' + (noRepeat ? ' checked' : '') + '> 抽過的不重複（剩 ' + left.length + ' / ' + pool.length + '）</label>';
    if (drawn.length) {
      h += '<div class="section-label">已抽過</div><div class="chips">' + drawn.map(function (id) {
        if (mode === 'group') return '<span class="chip">第 ' + (Number(id) + 1) + ' 組</span>';
        var s = Q.student(id);
        return s ? '<span class="chip">' + s.no + ' ' + esc(s.name) + '</span>' : '';
      }).join('') + '</div><button class="btn small" style="margin-top:10px" data-act="drawReset">重新開始</button>';
    }
    return h;
  }
};
Change.drawPlan = function (d, el) { App.setUi('drawPlan', el.value); };
Change.drawNoRepeat = function (d, el) { App.setUi('drawNoRepeat', el.checked); };
Act.drawReset = function () {
  var cls = App.cls();
  var mode = App.ui.drawMode || 'person';
  var plan = mode === 'group' ? (DB.get('groups', App.ui.drawPlan) || Q.groupPlans(cls.id)[0]) : null;
  Prefs.set(drawKey(cls.id, mode, plan && plan.id), []);
  App.ui.drawLast = null;
  App.render();
};
Act.doDraw = function (d, el) {
  var cls = App.cls();
  var mode = App.ui.drawMode || 'person';
  var plan = mode === 'group' ? (DB.get('groups', App.ui.drawPlan) || Q.groupPlans(cls.id)[0]) : null;
  var key = drawKey(cls.id, mode, plan && plan.id);
  var drawn = Prefs.get(key, []);
  var noRepeat = App.ui.drawNoRepeat !== false;
  var pool = mode === 'group' ? plan.groups.map(function (g, i) { return String(i); }) : Q.students(cls.id).map(function (s) { return s.id; });
  var left = noRepeat ? pool.filter(function (x) { return drawn.indexOf(x) < 0; }) : pool;
  if (!left.length) return;
  var pickId = left[Math.floor(Math.random() * left.length)];
  var out = document.getElementById('draw-out');
  el.disabled = true;
  var label = function (id) {
    if (mode === 'group') return '<div class="draw-no">&nbsp;</div><div class="draw-name">第 ' + (Number(id) + 1) + ' 組</div>';
    var s = Q.student(id);
    return '<div class="draw-no">' + s.no + ' 號</div><div class="draw-name">' + esc(s.name) + '</div>';
  };
  var n = 0;
  var spin = setInterval(function () {
    out.innerHTML = label(pool[Math.floor(Math.random() * pool.length)]);
    if (++n > 14) {
      clearInterval(spin);
      UI.buzz(30);
      if (noRepeat || drawn.indexOf(pickId) < 0) drawn.push(pickId);
      Prefs.set(key, drawn);
      App.ui.drawLast = { cls: cls.id, mode: mode, id: pickId };
      App.render();
    }
  }, 60);
};
